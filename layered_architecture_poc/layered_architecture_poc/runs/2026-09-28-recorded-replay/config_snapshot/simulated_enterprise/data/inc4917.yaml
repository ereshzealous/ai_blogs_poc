# INC-4917, the one scenario both architectures run.  Everything here is simulated and deterministic.
# The simulated clock is in minutes after 00:00 UTC on `date`.  Nothing reads the wall clock.
scenario_id: INC-4917
date: "2026-09-22"
start_minute: 630            # 10:30, when the investigation begins

incident:
  id: INC-4917
  title: "Checkout API: p95 latency above 2 s and 5xx errors in production"
  service: checkout-api
  environment: production
  severity: SEV2
  status: investigating
  opened_minute: 611          # 10:11, opened by the latency alert
  reporter: alerting/latency-slo
  customer_impact: "About 4% of checkout requests fail; the rest are slow."

services:
  checkout-api:     {owner: checkout-engineering, tier: 1, slo_p95_ms: 400, runbook: RB-CHK-007}
  payment-gateway:  {owner: payments-platform,   tier: 1, slo_p95_ms: 600, runbook: RB-PAY-002}
  inventory-api:    {owner: fulfilment,          tier: 2, slo_p95_ms: 300, runbook: RB-INV-004}

# Release history, newest last per service/environment.  `current` marks what is running.
deployments:
  - {id: rel-2029, service: checkout-api, environment: production, version: 2.13.2, minute: -2870, author: dmitri.k, summary: "Retry budget for payment calls"}
  - {id: rel-2030, service: checkout-api, environment: production, version: 2.13.4, minute: -1450, author: priya.s, summary: "Fix currency rounding on refunds"}
  - {id: rel-2031, service: checkout-api, environment: production, version: 2.14.0, minute: 602, author: leo.m, summary: "Cost tuning: DB pool maximumPoolSize 50 -> 10; ORM 6.4 -> 6.5", current: true}
  - {id: rel-7709, service: payment-gateway, environment: production, version: 5.2.0, minute: -3000, author: ana.r, summary: "Card network timeouts to 4 s"}
  - {id: rel-7710, service: payment-gateway, environment: production, version: 5.2.1, minute: 588, author: ana.r, summary: "Enable 3DS2 challenge flow for EU cards (feature flag)", current: true}
  - {id: rel-3301, service: inventory-api, environment: production, version: 1.8.7, minute: -5000, author: sam.o, summary: "Warehouse sync every 5 min"}
  - {id: rel-3302, service: inventory-api, environment: production, version: 1.9.0, minute: 510, author: sam.o, summary: "SKU cache warm-up on start", current: true}
  - {id: rel-2032, service: checkout-api, environment: staging, version: 2.14.1, minute: 615, author: leo.m, summary: "Pool size back to 30 (staging only, not promoted)", current: true}

# Metric shapes: `incident` applies from `incident_start` until the service is recovered by a rollback to a
# healthy release.  After a rollback the service needs `recovery_minutes` to return to baseline.
recovery_minutes: 3
rollback_minutes: 6          # simulated time a rollout plus observation takes
healthy_releases: {checkout-api: [rel-2029, rel-2030]}
metrics:
  checkout-api:
    incident_start: 603
    latency_p95_ms:  {baseline: 210, incident: 2140}
    error_rate_pct:  {baseline: 0.2, incident: 3.9}
    db_pool_wait_ms: {baseline: 3,   incident: 1810}
    cpu_pct:         {baseline: 36,  incident: 34}
  payment-gateway:
    incident_start: null
    latency_p95_ms:  {baseline: 330}
    error_rate_pct:  {baseline: 0.3}
    db_pool_wait_ms: {baseline: 2}
    cpu_pct:         {baseline: 41}
  inventory-api:
    incident_start: null
    latency_p95_ms:  {baseline: 120}
    error_rate_pct:  {baseline: 0.1}
    db_pool_wait_ms: {baseline: 1}
    cpu_pct:         {baseline: 22}

logs:
  checkout-api:
    incident:
      - "WARN  HikariPool-1 - Connection is not available, request timed out after 1800ms (total=10, active=10, idle=0, waiting=143)"
      - "ERROR POST /v1/checkout 503 upstream=orders-db reason=connection-acquire-timeout"
      - "INFO  datasource pool config maximumPoolSize=10 minimumIdle=2 (release 2.14.0)"
      - "WARN  slow request POST /v1/checkout 2231ms (db wait 1794ms)"
      - "ERROR POST /v1/checkout 503 upstream=orders-db reason=connection-acquire-timeout"
    baseline:
      - "INFO  POST /v1/checkout 201 187ms"
      - "INFO  datasource pool config maximumPoolSize=50 minimumIdle=10"
  payment-gateway:
    baseline:
      - "INFO  3DS2 challenge flow enabled for EU cards (flag threeds2.eu=on)"
      - "INFO  POST /v1/authorize 200 298ms"
  inventory-api:
    baseline:
      - "INFO  SKU cache warmed: 48211 entries in 2.1s"
      - "INFO  GET /v1/stock 200 64ms"
