  fact = "effects.AB.gateway_verified"
  op = "=="
  value = 0
  [[experiments.checks]]
  id = "F1-R1-C08"
  description = "Every row of the published run recorded the live model's answers"
  kind = "implementation"
  fact = "rows.with_model_calls"
  op = "=="
  ref = "run.rows"

[[experiments]]
id = "F1-R2"
title = "Correctness as the catalog grows"
question = "How does correct operational handling change for each architecture from the smallest estate to the largest?"
claim = "Correct handling is the outcome that matters; the preregistered hypotheses and confirmatory tests say whether the control plane changes it."
hypothesis = "H1: all-tools correctness falls as the estate grows, more than the control plane's. H7: the control plane handles at least the preregistered share of blind cases correctly at the largest estate. Confirmatory: the control plane is more correct than each baseline at the largest estate."
setup = "{{cases.blind}} blind cases × {{variants.count}} arms × {{factor.values|count}} catalog sizes, run once and scored from the effects ledger and the declared outcome; exact McNemar tests, Holm-adjusted."
variable = "Catalog size ({{factor.values|and}} tools)."
invariant = "None: these are hypotheses and tests, reported as measured."
limitations = ["Three measured points; no curve is drawn between them.", "One local model; another model may scale differently.", "An architecture comparison, not a one-variable ablation."]
  [[experiments.checks]]
  id = "F1-R2-C01"
  description = "H1: all-tools correctness collapses as the estate grows"
  kind = "hypothesis"
  fact = "hyp.H1"
  op = "=="
  value = "supported"
  threshold_source = "experiment/preregistration.md §6 H1"
  [[experiments.checks]]
  id = "F1-R2-C02"
  description = "H7: the control plane meets the preregistered engineering target at the largest estate"
  kind = "hypothesis"
  fact = "hyp.H7"
  op = "=="
  value = "supported"
  threshold_source = "experiment/preregistration.md §6 H7"
  [[experiments.checks]]
  id = "F1-R2-C03"
  description = "Confirmatory: the control plane is significantly more correct than search only at the largest estate"
  kind = "confirmatory"
  fact = "conf.C_vs_B_500.significant"
  op = "=="
  value = true
  threshold_source = "experiment/preregistration.md §7"
  [[experiments.checks]]
  id = "F1-R2-C04"
  description = "Confirmatory: the control plane is significantly more correct than all tools at the largest estate"
  kind = "confirmatory"
  fact = "conf.C_vs_A_500.significant"
  op = "=="
  value = true
  threshold_source = "experiment/preregistration.md §7"

