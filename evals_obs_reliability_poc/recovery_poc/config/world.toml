[[kb]]
id = "kb-duplicate-v3"
title = "Duplicate charges (current policy)"
text = "When a customer is charged twice for the same purchase, credit the full amount of the later duplicate charge to the customer's account balance. Open a ticket for the billing audit trail and notify the customer by e-mail once the credit is issued."
version = 3
[[kb]]
id = "kb-duplicate-v2"
title = "Duplicate charges (superseded policy)"
text = "Duplicate charges may be refunded to the card within 14 days. Superseded by version 3: issue an account credit instead."
version = 2
superseded = true
[[kb]]
id = "kb-credit-limits"
title = "Credit limits for support agents"
text = "Automated agents may issue account credits up to 200.00 per charge. Credits above 200.00 require a human approver; escalate with the case id."
version = 5
[[kb]]
id = "kb-disputes"
title = "Charges under dispute"
text = "A charge with an open dispute or chargeback cannot be credited or refunded. Escalate to the payments team; do not promise a credit."
version = 2
[[kb]]
id = "kb-auth-holds"
title = "Pending authorizations are not charges"
text = "A pending card authorization can look like a second charge. It is released automatically within 7 days and is never credited; explain this to the customer."
version = 1
[[kb]]
id = "kb-address-change"
title = "Changing a billing address"
text = "Billing address changes are handled by the accounts team. Open a ticket with the new address; do not edit it in chat."
version = 4
[[kb]]
id = "kb-cancellation"
title = "Cancelling a subscription"
text = "Cancellations take effect at the end of the billing period. Open a ticket for the accounts team to process the cancellation."
version = 3
[[kb]]
id = "kb-invoice-copy"
title = "Invoice copies"
text = "Customers can request a copy of any invoice. Open a ticket and the billing team sends it within one business day."
version = 2
[[kb]]
id = "kb-price-difference"
title = "Charges with different amounts"
text = "Two charges with different amounts are not duplicates. Open a ticket for billing review rather than issuing a credit."
version = 1
[[kb]]
id = "kb-password-reset"
title = "Password reset"
text = "Customers reset their password from the sign-in page. Support never asks for a password."
version = 6
