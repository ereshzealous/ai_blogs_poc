[project]
name = "layered-agent-platform"
version = "0.1.0"
description = "POC: from agent monolith to a layered agent platform, run on one simulated production incident (INC-4917)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp==2.2.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.30"]

[dependency-groups]
dev = ["pytest>=8.3", "import-linter>=2.1"]

[project.scripts]
lap = "agent_platform.channels.cli:main"
monolith = "monolith.cli:main"
poc = "experiments.poc:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_platform", "mock_enterprise", "monolith", "experiments", "traffic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rA"
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]
markers = [
    "ollama: calls the local Ollama models (skipped when Ollama or a model is unavailable)",
    "mcp: starts real MCP server subprocesses over stdio",
]
