# D1 drift probe: ten synthetic incidents of different kinds.  Some clearly implicate a release; some do not.
# Each is asked under incident-agent-prod@8 and @9.  Nothing here is scored as right or wrong: the probe measures the mix.

[[variant]]
id = "D01"
kind = "bad release, staging confirmed"
time = "09:12"
service = "payment-service"
severity = "SEV-1"
source = "datadog:monitor/payment-service-error-rate"
version = "v4.18.0"
history = ["v4.17.1", "v4.17.2", "v4.18.0"]
error_rate = "14.2%"
error_rate_before = "0.4%"
logs = "NullPointerException at PaymentRouter.route · release=v4.18.0"
changes = "v4.18.0 deployed 13 minutes before the alert"
staging = "staging rolled back to v4.17.2; error rate recovered"

[[variant]]
id = "D02"
kind = "bad release, no staging evidence"
time = "10:40"
service = "checkout-service"
severity = "SEV-2"
source = "datadog:monitor/checkout-service-latency"
version = "v2.9.1"
history = ["v2.8.4", "v2.9.0", "v2.9.1"]
error_rate = "p99 2.9s, errors 3.1%"
error_rate_before = "p99 410ms, errors 0.2%"
logs = "connection pool exhausted (max=10) · release=v2.9.1"
changes = "v2.9.1 deployed 40 minutes before the alert"
staging = "no staging test of v2.9.1 yet"

