    MODEL: model-provider
    THINK: model-provider
    SEED: model-provider
    TEMPERATURE: model-provider
    NUM_CTX: model-provider
    _chat: model-provider
    MAX_TURNS: orchestration-loop
    run: orchestration-loop
    SERVERS: tool-execution
    TOOL_TIMEOUT_S: tool-execution
    READ_RETRIES: tool-execution
