          Flush the SKU cache (inv-admin cache flush --all). Fresh stock levels load from inventory-db on the next read.

  - doc_id: RB-INVW-001
    version: v1
    title: "inventory-worker: reservation queue lag"
    doc_type: runbook
    owner: fulfilment
    tenant: acme
    environments: [production]
    services: [inventory-worker]
    status: active
    valid_from: "2026-07-20T00:00:00Z"
    valid_to: null
    superseded_by: null
    supersedes: null
    procedure_key: inventory-worker/queue-lag
    action: scale_out
    approval: none
    acl: [eng-all]
    updated_at: "2026-07-20T14:00:00Z"
    sections:
      - heading: Remediation
        text: >-
          Scale the reservation consumers to 8 replicas through the autoscaler override (autoscaler set
          inventory-worker --min 8). Lag drains at roughly 4,000 messages a minute.
      - heading: Limits
        text: >-
          Do not go above 8 consumers: inventory-db write locks contend beyond that. Never purge the reservation queue;
          purged reservations are lost orders.

