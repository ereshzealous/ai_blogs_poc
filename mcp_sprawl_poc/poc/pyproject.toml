[project]
name = "sprawl-poc"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Eresh Gorantla", email = "924701+ereshzealous@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "mcp==2.2.0",
    "numpy>=2",
    "pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["mcp: starts real MCP server subprocesses over stdio"]
