[project]
name = "production-agentic-ai-platform-poc"
version = "1.0.0"
description = "Capstone POC: one INC-4917 rollback crosses every boundary of the final reference architecture (identity, context, model gateway, MCP, policy, approval digest, scoped capability, budget, control plane, evidence), broken on purpose."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.2.0",
    "opentelemetry-api>=1.45",
    "opentelemetry-sdk>=1.45",
    "pyyaml>=6.0",
]

[project.scripts]
pap = "pap_cli.cli:main"   # the Proof Contract v1 commands (runner/pap_cli/cli.py, on experiment-runner 1.1.0)

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_platform", "src/mcp_servers", "src/simulated_systems", "runner/pap_cli", "runner/experiment_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rA -p no:cacheprovider"
