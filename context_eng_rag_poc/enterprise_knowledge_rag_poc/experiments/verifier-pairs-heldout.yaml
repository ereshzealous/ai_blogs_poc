# Held-out claim-citation pairs, authored blind to the verifier. Gold labels by an independent author.
pairs:
  # ------------------------------------------------------------------------------------------ supported-verbatim (8)
  - id: V-H01
    principal: ananya.iyer
    environment: production
    service: cart-api
    claim: {text: "For cart-api latency after a deploy, turn on pool autotuning with the flag cart.redis_pool_autotune=on in the flag service; no approval is needed.", kind: procedure}
    citations: [{unit_id: "RB-CART-003@v3#remediation", quote: "Turn on pool autotuning with the flag cart.redis_pool_autotune=on in the flag service; no approval is needed."}]
    gold_supported: true
    category: supported-verbatim
    rationale: "RB-CART-003 v3, published at the source at 03:20 after the watermark, is cart-api's current runbook of record and says exactly this."

  - id: V-H02
    principal: ananya.iyer
    environment: production
    service: checkout-api
