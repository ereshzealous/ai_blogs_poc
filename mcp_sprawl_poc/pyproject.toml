# The Learning 01 runner: `uv run sprawl <command>` from the repository root (macOS, Linux, Windows, CI).
# Standard library only. The POC itself is the separate, frozen project in poc/ (its pyproject.toml and lock file are
# hash-pinned); every step the runner starts runs in that project's own locked environment.
[project]
name = "sprawl-runner"
version = "1.0.0"
description = "One command for the Learning 01 POC: doctor, verify, test, build, run, replay, analyze, report, all"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sprawl = "sprawl_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "runner"
module-name = ["sprawl_cli", "experiment_runner"]  # experiment_runner: pinned copy of the shared experiment-runner
