# F1 · MCP Tool Sprawl · proof experiments (Production AI Engineering Proof Contract v1, pae-proof/v1)
#
# Every check compares facts the adapter counted from the recorded files (poc/scripts/evidence_adapter.py and
# poc/scripts/proof_facts.py); the observed value is always the fact's value, never typed here. A FAIL is a reported
# result: a preregistered hypothesis or comparison the evidence did not bear out stays a FAIL. Reader text binds its
# numbers as {{facts}} and is linted like proof/learning.toml. Check ids are stable once published.

[[experiments]]
id = "F1-R1"
title = "MCP transport and catalog execution"
question = "Are these actual MCP servers and tool calls, or local functions labelled MCP?"
claim = "The protocol path is real: the official SDK, one server process per server, tools/list and tools/call; only the enterprise behind it is simulated."
hypothesis = "Every recorded session ran MCP over stdio with the pinned SDK, listed exactly the estate's tools, and every governed side effect arrived with a valid gateway token."
setup = "Each estate × arm session of the published run started the estate's MCP servers as OS processes, negotiated the protocol and recorded what tools/list returned; the simulated systems of record marked every effect with whether a valid gateway token came with it."
variable = "Catalog size ({{factor.values|and}} tools) and arm."
invariant = "A control-plane write reaches the ledger only through a signed gateway call; a baseline call goes straight to its server."
limitations = ["The servers are this POC's own, built on the official SDK; no third-party MCP server was exercised.", "stdio only; no remote transport or authorization flow."]
tests = ["poc/tests/test_gateway_mcp.py"]
  [[experiments.checks]]
  id = "F1-R1-C01"
  description = "Every recorded session used stdio, one OS process per server"
  kind = "implementation"
  fact = "protocol.stdio_sessions"
  op = "=="
  ref = "protocol.blocks"
  [[experiments.checks]]
  id = "F1-R1-C02"
  description = "Every recorded session used the official Python SDK at the pinned version"
  kind = "implementation"
  fact = "protocol.sdk_sessions"
  op = "=="
  ref = "protocol.blocks"
  [[experiments.checks]]
  id = "F1-R1-C03"
  description = "tools/list returned exactly the largest estate's tools"
  kind = "implementation"
  fact = "protocol.tools.500"
  op = "=="
  ref = "estate.500.tools"
  [[experiments.checks]]
  id = "F1-R1-C04"
  description = "The largest estate ran as many server processes as its manifest declares"
  kind = "implementation"
  fact = "protocol.servers.500"
  op = "=="
  ref = "estate.500.servers"
  [[experiments.checks]]
  id = "F1-R1-C05"
  description = "Every server negotiated the same protocol revision"
  kind = "implementation"
  fact = "protocol.all_servers_same"
  op = "=="
  value = true
  [[experiments.checks]]
  id = "F1-R1-C06"
  description = "Every control-plane ledger effect arrived with a valid gateway token"
