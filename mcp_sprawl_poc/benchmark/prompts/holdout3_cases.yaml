# Held-out set 3 (written 2026-09-17 for discovery v5). Kinds: 120 clear, 60 ambiguous, 20 trap.
defaults:
  identity: { user_id: oncall-1, roles: [sre-oncall] }
  split: holdout3
  policy_version: v2

cases:
  - id: H301
    category: direct
    kind: clear
    prompt: "whats p99 on checkout look like in prod, last 30 min"
    golden_tool: observability.query_latency
    acceptable_tools: []
    expected_args: { service: checkout-api, environment: production, percentile: p99, time_range: 30m }
    expected_policy: ALLOW
    traps: [legacy_monitoring.get_latency_report, apm.query_apm_latency]
    intent: { system: monitoring, resource: latency, action: read, environment: production }

  - id: H302
    category: ambiguity
    kind: ambiguous
    prompt: "can u pull up the checkout deployment in staging"
    golden_tool: kubernetes.get_deployment
    acceptable_tools: []
    expected_args: { service: checkout-api, environment: staging }
    expected_policy: ALLOW
    traps: []
    intent: { system: kubernetes, resource: kubernetes deployment, action: read, environment: staging }
    ambiguous_between: [kubernetes.get_deployment, source_control.search_deployments]

  - id: H303
    category: risky
    kind: clear
    prompt: "checkout-api-6c7d8e9f0-d3e4f in staging is wedged, bounce it"
    golden_tool: kubernetes.restart_pod
    acceptable_tools: []
    expected_args: { pod: checkout-api-6c7d8e9f0-d3e4f, environment: staging }
    expected_policy: ALLOW
    traps: [kubernetes.restart_deployment, k8s_prod_eu.restart_pod]
    intent: { system: kubernetes, resource: kubernetes pod, action: restart, environment: staging }

  - id: H304
    category: cross_domain
    kind: clear
    prompt: "checkout's db calls keep timing out and I'm starting to suspect the cloud vendor. Is managed postgres having a bad day in eu-west-1 on their end?"
    golden_tool: cloud.get_service_health
    acceptable_tools: []
    expected_args: { region: eu-west-1, provider_service: managed-postgres }
    expected_policy: ALLOW
    traps: [observability.get_service_health, status_page.get_component_status]
    intent: { system: cloud, resource: provider status, action: read, environment: null }

  - id: H305
    category: multi_step
    kind: clear
    prompt: "grab the slowest statements on the prod orders database first, then we'll decide whether anything needs killing"
