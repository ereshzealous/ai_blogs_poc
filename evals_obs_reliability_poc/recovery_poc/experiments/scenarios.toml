# Fault scenarios and their oracle.  FROZEN before the recorded run (experiments/FROZEN.sha256).
#
# Every scenario runs the same agent, the same tools and the same fault through three runtimes that differ only in their
# recovery layer (preregistration.toml [arms]).  The oracle states, for the classified runtime (A2) only, the decision
# sequence the preregistered matrix must produce, and for every runtime the business outcome that would be correct.
# Effects are counted in the simulated providers' own ledgers, never in the agent's records.
#
# fault grammar:  "<target>:<kind>[@attempt|@all][:arg]"
#   model:<step>:{unavailable,rate_limited,invalid_json,wrong_tool,bad_args}      the model gateway (decide = credit decision)
#   kb:search:unavailable                                                     the retrieval index
#   tool:<tool>:{refused,lost_response,stall_then_refuse,reject,duplicate_commit,lost_response_dup}
#   status:<tool>:unavailable                                                 the provider's status / search endpoint
#   journal:{intent,result}:<tool>:write_fails                                the workflow store (disk full)
#   process:{before_dispatch,in_flight,after_result}:<tool>:sigkill            a real SIGKILL of the worker
#   clock:advance_before_resume:<seconds>                                     provider time passes during an outage
#
# decisions: [class, certainty, action] in the order the A2 runtime must record them (CONTINUE on a clean step is not a
# decision and is not listed).  effects: credits = committed credits on the charge; tickets = open tickets for the case;
# notifications = messages accepted by the provider for the case.

[[scenarios]]
id = "S00"
title = "Baseline: no fault"
layer = "none"
case = "CASE-1042"
faults = []
decisions = []
status = "COMPLETED"
effects = { credits = 1, tickets = 1, notifications = 1 }

[[scenarios]]
id = "S01"
title = "Model provider unavailable once"
layer = "model invocation"
case = "CASE-1042"
faults = ["model:decide:unavailable@1"]
decisions = [["MODEL_UNAVAILABLE", "NOT_EXECUTED", "RETRY"]]
status = "COMPLETED"
effects = { credits = 1, tickets = 1, notifications = 1 }

