version: 2026-09-28.1
notes:
  owner: AI platform team (simulated)
  mutation: changes via reviewed commit only; hash pinned in the frozen run manifest
  source_of_truth_for: capability, authority, lifecycle, environment, region, side-effect, risk, scopes, approval
  not_source_of_truth_for: tool input schemas (validated against the server-declared inputSchema)
capabilities:
  customer.credit_balance:
    description: Get a customer's store credit balance.
    owner: customer-care
    authoritative:
      global: promotions.get_credit_balance
    entity: customer
  customer.lookup:
    description: Look up a customer profile.
    owner: customer-data
    authoritative:
      global: crm.get_customer
    entity: customer
  customer.store_credit:
    description: Give a customer store credit (spent on future orders, not returned to the card).
    owner: customer-care
    authoritative:
      global: promotions.issue_store_credit
    entity: customer
    user_owned:
    - amount
  customer.update_default_address:
    description: Change the default address saved on a customer profile (not existing orders).
    owner: customer-data
    authoritative:
      global: crm.update_default_address
    entity: customer
    user_owned:
    - address
  customer.update_email:
    description: Change the email address on a customer profile.
    owner: customer-data
    authoritative:
      global: crm.update_customer_email
    entity: customer
    user_owned:
    - email
  order.cancel:
    description: Cancel an order that has not shipped.
    owner: order-management
    authoritative:
      global: orders.cancel_order
    entity: order
  order.lookup:
    description: Look up an order's status, items, totals, customer and shipping address.
    owner: order-management
    authoritative:
      global: orders.get_order
    entity: order
  order.refund:
    description: Return money for an order to the original payment method, recorded against the order.
    owner: payments-platform
    authoritative:
      us: refunds.refund_order
      eu: refunds_eu.refund_order
    entity: order
    user_owned:
    - amount
  order.replacement:
    description: Send a free replacement for an item on a delivered order.
    owner: order-management
    authoritative:
      global: orders.create_replacement_order
    entity: order
    user_owned:
    - sku
  order.search:
    description: Find a customer's orders.
    owner: order-management
    authoritative:
      global: orders.search_orders
    entity: customer
  order.update_shipping_address:
    description: Change the delivery address of an unshipped order.
    owner: order-management
    authoritative:
      global: orders.update_shipping_address
    entity: order
    user_owned:
    - address
  payment.get_charge:
    description: Get one charge by payment id.
    owner: payments-platform
    authoritative:
      global: payments.get_charge
    entity: payment
  payment.list_charges:
    description: List the charges captured on an order.
    owner: payments-platform
    authoritative:
      global: payments.list_charges
    entity: order
  refund.status:
    description: Check refunds already issued on an order.
    owner: payments-platform
    authoritative:
      us: refunds.get_refund_status
      eu: refunds_eu.get_refund_status
    entity: order
  return.create_label:
    description: Create a prepaid return label for a delivered order.
    owner: logistics
    authoritative:
      global: shipping.create_return_label
    entity: order
  shipment.track:
    description: Get shipment status, carrier, tracking number and ETA for an order.
    owner: logistics
    authoritative:
      global: shipping.track_shipment
    entity: order
  subscriptions.apply_subscription_discount:
    description: Apply a discount code to a subscription.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.apply_subscription_discount
    entity: null
  subscriptions.cancel_subscription:
    description: Cancel a customer's subscription at the end of the billing period.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.cancel_subscription
    entity: null
  subscriptions.change_plan:
    description: Move a subscription to a different plan.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.change_plan
    entity: null
  subscriptions.get_dunning_status:
    description: Get the dunning (failed payment recovery) status of a subscription.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.get_dunning_status
    entity: null
  subscriptions.get_invoice:
    description: Get a subscription invoice.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.get_invoice
    entity: null
  subscriptions.get_subscription:
    description: Get a subscription by id.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.get_subscription
    entity: null
  subscriptions.issue_subscription_credit:
    description: Credit a subscriber's next invoice.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.issue_subscription_credit
    entity: null
  subscriptions.list_invoices:
    description: List invoices for a subscription.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.list_invoices
    entity: null
  subscriptions.list_subscriptions:
    description: List a customer's subscriptions.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.list_subscriptions
    entity: null
  subscriptions.pause_subscription:
    description: Pause a subscription for up to 3 billing cycles.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.pause_subscription
    entity: null
  subscriptions.preview_proration:
    description: Preview proration for a plan change.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.preview_proration
    entity: null
  subscriptions.refund_subscription_invoice:
    description: Refund a paid subscription invoice to the subscriber's card.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.refund_subscription_invoice
    entity: null
  subscriptions.resume_subscription:
    description: Resume a paused subscription.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.resume_subscription
    entity: null
  subscriptions.retry_failed_payment:
    description: Retry the card charge for a failed subscription invoice.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.retry_failed_payment
    entity: null
  subscriptions.update_billing_email:
    description: Change the billing email used for subscription invoices.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.update_billing_email
    entity: null
  subscriptions.update_payment_method:
    description: Replace the card on file for a subscription.
    owner: subscriptions-team
    authoritative:
      global: subscriptions.update_payment_method
    entity: null
  ticket.add_note:
    description: Add an internal note to a support ticket.
    owner: customer-care
    authoritative:
      global: helpdesk.add_internal_note
    entity: ticket
  ticket.escalate:
    description: Escalate a support ticket to another team.
    owner: customer-care
    authoritative:
      global: helpdesk.escalate_ticket
    entity: ticket
  ticket.lookup:
    description: Read a support ticket.
    owner: customer-care
    authoritative:
      global: helpdesk.get_ticket
    entity: ticket
  ticket.reply:
    description: Reply to the customer on a support ticket.
    owner: customer-care
    authoritative:
      global: helpdesk.reply_to_customer
    entity: ticket
