# T4 · AI Control Plane · claims → experiments → checks (Production AI Engineering Proof Contract v1, pae-proof/v1)
#
# Every material claim the editions make, without its numbers (they are facts). `verdict` is tested against the checks
# by the kit (supported: every check PASS; contradicted: a FAIL; control: an EXPECTED_FAILURE; limitation: names what it
# rests_on). `class` is what a reader sees, and tools/verify_evidence.py checks that it goes with the verdict:
#
#   SUPPORTED          supported | implementation    the recorded evidence shows it
#   QUALIFIED          supported                     shown within a stated bound (`qualification`), with the
#                                                    LIMITATION OBSERVED checks that measure the bound (`bound_checks`)
#   NEGATIVE CONTROL   control                       the property broke, by design, when its safeguard was removed
#   NOT SUPPORTED      contradicted                  a stronger version of a claim the evidence contradicts
#   ARGUED             limitation                    reasoned in the editions, not tested by this POC
#   NOT TESTED         limitation                    out of this POC's scope
#
# `article` names where the claim is stated (the Evidence Check row, Medium and Technical section headings); `facts`
# lists the result facts the editions print for it.

[[claims]]
id = "T4-C01"
class = "SUPPORTED"
statement = "One central change altered an agent's governed behaviour with the same agent code, the same runtime process and the same request; no agent edit, no redeploy."
observed = "{{p2.before_decision}} under `{{p2.before_version}}` → {{p2.after_decision}} under `{{p2.after_version}}`; agent sha256 `{{p2.agent_sha_before}}` → `{{p2.agent_sha_after}}`; process `{{p2.runtime_pid_before}}` → `{{p2.runtime_pid_after}}`; request `{{p2.request_hash_before}}` → `{{p2.request_hash_after}}`; edits {{p2.agent_edits}}, redeploys {{p2.redeploys}}; restarts {{p2.restarts_after_v1}} → {{p2.restarts_after_v2}}"
type = "measured"
verdict = "supported"
experiments = ["T4-R2"]
checks = ["T4-R2-C01", "T4-R2-C02", "T4-R2-C03", "T4-R2-C04", "T4-R2-C05", "T4-R2-C06", "T4-R2-C07", "T4-R2-C08", "T4-R2-C09", "T4-R2-C10"]
article = ["evidence"]
facts = ["p2.before_decision", "p2.after_decision", "p2.before_version", "p2.after_version", "p2.agent_sha_before", "p2.agent_sha_after",
         "p2.runtime_pid_before", "p2.runtime_pid_after", "p2.request_hash_before", "p2.request_hash_after", "p2.agent_edits", "p2.redeploys",
         "p2.restarts_after_v1", "p2.restarts_after_v2", "p2.side_effect_delta", "p2.acp_files_changed", "p2.approval_id",
         "p2.agent_code_sha256", "p2.control_plane_files_changed", "p2.restarts"]

