# Source system: Meridian runbook repository (docs-as-code). SIMULATED.
#
# Every runbook is a Markdown file with YAML front matter in the real world; here, one record per file version. The
# connector copies the front matter into the index at ingestion time (the nightly watermark, see sources.yaml). What the
# source says *after* the watermark lives in source_events.yaml, not here.
#
# action vocabulary (config/vocabulary.yaml): rollback_release, restart_pods, raise_pool_size, switch_traffic,
#   enable_read_replica, scale_out, resync_job, flush_cache, rollback_index_alias, replay_dlq, failover_provider,
#   disable_flag, enable_flag, pause_job, escalate, none
# approval: the role whose approval the runbook requires before the action, or "none".
# status at ingestion: active | superseded | draft | withdrawn.   tenant "*" = every tenant.   services ["*"] = estate-wide.
# Nothing in this file says which document is right for which question. Ground truth lives in groundtruth/labels.yaml.

source: runbooks
documents:

  # ------------------------------------------------------------------------------------------------ checkout-api (acme)
  - doc_id: RB-CHK-007
    version: v4
    title: "checkout-api: latency or errors after a deploy"
    doc_type: runbook
    owner: checkout-engineering
    tenant: acme
    environments: [production, staging]
    services: [checkout-api]
    status: active
    valid_from: "2026-07-01T00:00:00Z"
    valid_to: null
    superseded_by: null
    supersedes: RB-CHK-007@v3
    procedure_key: checkout-api/latency-after-deploy
    action: rollback_release
    approval: incident-commander
    acl: [eng-all]
    updated_at: "2026-07-01T09:12:00Z"
    sections:
      - heading: Symptoms
        text: >-
          p95 latency above the 400 ms SLO or 5xx errors on POST /v1/checkout within an hour of a production deploy.
          Typical signals: HikariPool connection-acquire timeouts in the checkout-api logs and orders-db pool wait above
          500 ms.
      - heading: Diagnose
        text: >-
          Open the deployment record of the release that preceded the alert and compare its config diff with the
          previous release: pool sizes, timeouts, ORM version. If the alert started within 60 minutes of the deploy and
          the diff touches the datasource, treat it as a release regression.
      - heading: Remediation
        text: >-
          Roll the release back through the release pipeline (release-pipeline rollback checkout-api --to
          <previous-version>) to the last good version named in the deployment record. Do not restart pods or run
          kubectl rollout undo: a restart does not fix a regressed release, and the GitOps controller reverts direct
          changes.
      - heading: Approval and exceptions
        text: >-
          A production rollback requires incident-commander approval under change policy CP-12, recorded in the
          incident before the pipeline runs. Exception: if the release record shows migration: true, do not roll back;
          escalate to the DBA on-call.

  - doc_id: RB-CHK-007
    version: v3
    title: "checkout-api: latency or errors after a deploy"
    doc_type: runbook
    owner: checkout-engineering
    tenant: acme
    environments: [production, staging]
    services: [checkout-api]
    status: superseded
    valid_from: "2026-02-10T00:00:00Z"
    valid_to: "2026-07-01T00:00:00Z"
    superseded_by: RB-CHK-007@v4
    supersedes: RB-CHK-007@v2
    procedure_key: checkout-api/latency-after-deploy
    action: restart_pods
    approval: none
    acl: [eng-all]
    updated_at: "2026-02-10T11:40:00Z"
    sections:
      - heading: Symptoms
        text: >-
          checkout-api p95 latency above SLO or elevated 5xx shortly after a deploy, often with connection pool timeouts.
      - heading: Remediation
        text: >-
          Restart the checkout-api pods (kubectl rollout restart deployment/checkout-api) and scale to 10 replicas to
          drain the connection pool. If latency has not recovered within 15 minutes, roll the release back.

