# Background estate: runbooks and tickets for services no case asks about directly. SIMULATED.
# They exist so retrieval works over a realistic mix of near-miss documents, not a corpus built around the questions.

sources:
  - source: runbooks
    documents:
      - doc_id: RB-CART-003
        version: v2
        title: "cart-api: latency after a deploy"
        doc_type: runbook
        owner: cart-team
        tenant: acme
        environments: [production]
        services: [cart-api]
        status: active
        valid_from: "2026-05-18T00:00:00Z"
        valid_to: null
        superseded_by: null
        supersedes: RB-CART-003@v1
        procedure_key: cart-api/latency-after-deploy
        action: rollback_release
        approval: incident-commander
        acl: [eng-all]
        updated_at: "2026-05-18T10:00:00Z"
        sections:
          - heading: Remediation
            text: >-
              cart-api latency after a deploy is usually the Redis client pool. Roll the release back through the
              release pipeline; the incident commander approves production rollbacks.
          - heading: Diagnose
            text: >-
              Check redis.pool.wait in the cart-api dashboard and compare with the previous release's baseline.

      - doc_id: RB-PRC-002
        version: v1
        title: "pricing-api: stale promotions"
        doc_type: runbook
        owner: pricing-team
        tenant: acme
        environments: [production]
        services: [pricing-api]
        status: active
        valid_from: "2026-04-11T00:00:00Z"
        valid_to: null
        superseded_by: null
        supersedes: null
        procedure_key: pricing-api/stale-promotions
        action: resync_job
        approval: none
        acl: [eng-all]
        updated_at: "2026-04-11T10:00:00Z"
        sections:
          - heading: Remediation
            text: >-
              Run the promotion sync job (jobs run promo-sync --tenant acme). Do not edit prices in the database by hand.

      - doc_id: RB-AUTH-006
        version: v3
        title: "auth-service: token validation errors"
        doc_type: runbook
        owner: identity-team
        tenant: acme
        environments: [production]
        services: [auth-service]
        status: active
        valid_from: "2026-06-30T00:00:00Z"
        valid_to: null
        superseded_by: null
        supersedes: RB-AUTH-006@v2
        procedure_key: auth-service/token-validation
        action: restart_pods
        approval: none
        acl: [eng-all]
        updated_at: "2026-06-30T10:00:00Z"
        sections:
          - heading: Remediation
            text: >-
              If token validation fails after a signing-key rotation, restart the auth-service pods so they reload the
              JWKS cache (kubectl rollout restart deployment/auth-service). This is the one service where a restart is
              the documented fix.

      - doc_id: RB-CDN-011
        version: v2
        title: "cdn-edge: stale assets after a frontend release"
        doc_type: runbook
        owner: web-platform
        tenant: acme
        environments: [production]
        services: [cdn-edge]
        status: active
        valid_from: "2026-03-22T00:00:00Z"
        valid_to: null
        superseded_by: null
        supersedes: RB-CDN-011@v1
        procedure_key: cdn-edge/stale-assets
        action: flush_cache
        approval: none
        acl: [eng-all]
        updated_at: "2026-03-22T10:00:00Z"
        sections:
          - heading: Remediation
            text: >-
              Purge the CDN cache for /static/* (cdn-ctl purge --path '/static/*'). Purges are safe at any hour.

      - doc_id: RB-FRD-001
        version: v2
        title: "fraud-scoring: model latency"
        doc_type: runbook
        owner: risk-engineering
        tenant: acme
        environments: [production]
        services: [fraud-scoring]
        status: active
        valid_from: "2026-07-03T00:00:00Z"
        valid_to: null
        superseded_by: null
        supersedes: RB-FRD-001@v1
        procedure_key: fraud-scoring/model-latency
        action: switch_traffic
        approval: risk-oncall
        acl: [eng-all]
        updated_at: "2026-07-03T10:00:00Z"
        sections:
          - heading: Remediation
            text: >-
              Switch scoring to the fallback rules engine (fraud-ctl mode --rules) and page risk on-call, who approves
              the switch. Payments continue with slightly higher manual review.

      - doc_id: RB-IDB-002
        version: v1
        title: "inventory-db: replication lag"
        doc_type: runbook
        owner: data-platform
        tenant: acme
        environments: [production]
        services: [inventory-db]
        status: active
        valid_from: "2026-05-05T00:00:00Z"
        valid_to: null
        superseded_by: null
        supersedes: null
        procedure_key: inventory-db/replication-lag
        action: escalate
        approval: dba
        acl: [eng-all]
        updated_at: "2026-05-05T10:00:00Z"
