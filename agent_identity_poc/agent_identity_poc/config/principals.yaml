# Simulated directory. In production: humans come from the enterprise identity provider, workloads and runtimes from a
# workload-identity system (SPIFFE-style), agents from an agent registry. Here they are one file, so every experiment is
# reproducible.
#
#   scopes      what a principal may do itself (for workloads: what it may INVOKE)
#   delegable   what a principal may lend to an execution it starts or requests
#   ceiling     (agents) the most an agent may ever hold, whoever asks
#   runtime     (agents) the runtime workload the agent is deployed on
#   may_delegate_to  (agents) agent -> agent edges that are allowed at all

humans:
  sre.maya: {oidc: maya@company.com, roles: [responder], on_call: true,
             scopes: [incident:investigate, incident:remediate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post],
             delegable: [incident:investigate, incident:remediate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post]}
  ic.dev:   {oidc: dev@company.com, roles: [responder, incident-commander], on_call: true,
             scopes: [incident:investigate, incident:remediate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post, deploy:rollback],
             delegable: [incident:investigate, incident:remediate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post]}
  pm.lee:   {oidc: lee@company.com, roles: [viewer], on_call: false, scopes: [incident:read], delegable: []}

workloads:   # the heads that invoke the runtime
  svc.monitoring-webhook: {scopes: [incident:investigate],
                           delegable: [incident:investigate, incident:remediate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post]}
  svc.web-portal:         {scopes: [incident:investigate],
                           delegable: [incident:investigate, incident:remediate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post]}
  svc.workflow-engine:    {scopes: [incident:investigate],
                           delegable: [incident:investigate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post]}
  svc.ci-pipeline:        {scopes: [release:check], delegable: [release:check, telemetry:read, deploy:read, itsm:read]}

runtimes:    # attested workloads the agents run on
  svc.hai-runtime:     {spiffe: spiffe://prod.company.internal/agent-runtime}
  svc.release-runtime: {spiffe: spiffe://prod.company.internal/release-runtime}
  svc.batch-runner:    {spiffe: spiffe://prod.company.internal/batch-runner}      # hosts no agent; used as the replay origin

agents:
  agent.incident-intel: {version: 1.3.0, owner: team-sre-platform, runtime: svc.hai-runtime,
                         ceiling: [incident:remediate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post],
                         may_delegate_to: [agent.remediation]}
  agent.remediation:    {version: 1.0.0, owner: team-sre-platform, runtime: svc.hai-runtime,
                         ceiling: [incident:remediate, telemetry:read, deploy:read, chat:post], may_delegate_to: []}
  agent.release-guard:  {version: 0.9.2, owner: team-release, runtime: svc.release-runtime,
                         ceiling: [release:check, telemetry:read, deploy:read, itsm:read], may_delegate_to: [agent.incident-intel]}

# Authority that never travels in a token. It reaches an execution only through an approval bound to one call.
non_delegable: [deploy:rollback]

# Channel credentials presented at ingress. Static only because this is a simulation.
credentials:
  cred-monitoring:  {principal: svc.monitoring-webhook, channel: event}
  cred-web:         {principal: svc.web-portal, channel: web}
  cred-workflow:    {principal: svc.workflow-engine, channel: workflow}
  cred-ci:          {principal: svc.ci-pipeline, channel: cicd}
  sso-maya:         {principal: sre.maya, channel: sso}
  sso-dev:          {principal: ic.dev, channel: sso}
  sso-lee:          {principal: pm.lee, channel: sso}

token_ttl_s: 900         # execution tokens: 15 minutes, re-exchanged (never extended) after a pause
max_delegation_depth: 2  # agent -> agent hops below the first agent
