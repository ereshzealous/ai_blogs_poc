variant = "L0"
headline = "{{L0.held.kn}} fully answered"
statement = "{{L0.held}} rows where application logs answered all thirteen questions correctly"
breakdown_title = "By group"
source = "L0.held"

[[metrics]]
id = "qualified-L0"
variant = "L0"
headline = "{{L0.qualified.kn}} with gaps"
statement = "{{L0.qualified}} rows where application logs left some answers missing or partial"
breakdown_title = "By group"
