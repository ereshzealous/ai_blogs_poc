# Simulated identity service (Agent Identity, T1, consumed as input). Static tokens only because this is a deterministic
# simulation. The agent and runtime hold no human credential; only a human principal can approve.
principals:
  staff.2210:               {kind: human,    roles: [support-agent],    refund_limit: 250.00, compensation_limit: 25.00}
  staff.1004:               {kind: human,    roles: [support-supervisor], refund_limit: 2000.00, compensation_limit: 150.00}
  agent.support:            {kind: agent,    roles: [],                 version: "1.4.0", status: enabled}
  svc.agent-runtime:        {kind: workload, roles: []}
  svc.tool-gateway:         {kind: workload, roles: []}
  agent.fulfilment:         {kind: agent,    roles: [],                 version: "2.0.0", status: enabled}   # a peer agent

credentials:
  tok-staff-2210:  staff.2210
  tok-staff-1004:  staff.1004
  tok-agent:       agent.support
  tok-runtime:     svc.agent-runtime

# Which runtimes may run which agent (T1: the attested workloads registered for an agent).
runtimes:
  agent.support: [svc.agent-runtime]

# The delegation the support agent acts under for this case. A reference, not a bearer of authority.
# subject = the human the agent represents; actor = the agent; scopes bound the agent's proposals.
delegations:
  dlg-case-20871:
    subject: staff.2210
    actor: agent.support
    resource: CASE-20871
    scopes: ["orders:read", "payments:read", "payments:refund:propose", "cases:read", "cases:write", "kb:read"]
    status: active
    issued_at: "2026-11-30T09:20:00Z"
    expires_at: "2026-11-30T17:20:00Z"

# Peer-agent delegation tokens the identity service will actually honour. A token NOT listed here (one a peer agent
# merely claims to hold) verifies to nothing: text is not a token.
peer_tokens:
  # (none issued for this case: no peer agent has been delegated authority over CASE-20871)
