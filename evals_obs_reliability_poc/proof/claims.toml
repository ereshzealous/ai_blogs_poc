facts = ["replay.level", "replay.identical", "replay.files", "replay.different", "tests.total", "tests.passed", "raw.canary_hits", "raw.prereg_changed"]

[[claims]]
id = "REL-C13"
class = "ARGUED"
statement = "Recovery decisions should not be delegated to a model: a policy over facts is testable, reproducible and auditable."
type = "limitation"
verdict = "limitation"
rests_on = "the design argument in the technical edition §17; the POC shows a deterministic policy works, not that a model-based one fails"
experiments = []
checks = []
article = ["The recovery decision"]
facts = []

[[claims]]
id = "REL-C14"
class = "NOT TESTED"
statement = "Behaviour under load, eventual consistency of status queries, partial batch success, and the real distribution of these faults in production."
type = "limitation"
verdict = "limitation"
rests_on = "out of scope; the scenarios are deterministic, single-run and simulated"
