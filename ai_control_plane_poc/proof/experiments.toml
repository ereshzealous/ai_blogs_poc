# T4 · AI Control Plane · proof experiments (Production AI Engineering Proof Contract v1, pae-proof/v1)
#
# One experiment per proof (T4-R1 = P1 … T4-R12 = P12) and one for the evidence itself (T4-R13). Every check compares
# facts that tools/proof_facts.py read from the recorded run; the observed value is always the fact's value, never typed
# here. `role` places the experiment in the proof hierarchy: baseline, core, capability, boundary, negative-control,
# governor. A measurement check that declares finding = "LIMITATION OBSERVED" states the ideal and records, as a result,
# that the run did not meet it: those FAILs are the qualifications the articles print, not broken proofs.
# Scenario assertions (scenario.json → checks) are counted separately from these proof checks, and unit tests apart
# from both.

[[experiments]]
id = "T4-R1"
role = "baseline"
title = "P1 · Baseline: the control plane allows"
question = "Under v1, does the incident agent's production restart run, and is it attributed to v1?"
claim = "Before any change, the governed path allows the action, executes it once and attributes it to the version and rule that allowed it."
hypothesis = "Under v1 the restart is allowed by a named rule, executed once, and the deploy system of record shows one restart."
setup = "Bootstrap v1; the incident agent runs its fixed plan in a long-lived runtime process."
variable = "none (baseline)"
invariant = "Every executed action names the config version and rule that allowed it."
limitations = ["One agent, one action: the baseline the other proofs change."]
tests = ["control_plane_poc/tests/test_proofs.py", "control_plane_poc/tests/test_invariants.py"]
  [[experiments.checks]]
  id = "T4-R1-C01"
  description = "Every P1 scenario assertion held"
  kind = "invariant"
  fact = "p1.assertions_passed"
  op = "=="
  ref = "p1.assertions_total"
  [[experiments.checks]]
  id = "T4-R1-C02"
  description = "The restart was decided ALLOW by the decision function"
  kind = "implementation"
  fact = "p1.decision"
  op = "=="
  value = "ALLOW"
  [[experiments.checks]]
  id = "T4-R1-C03"
  description = "The decision names config version v1"
  kind = "invariant"
  fact = "p1.config_version"
  op = "=="
  value = "v1"
  [[experiments.checks]]
  id = "T4-R1-C04"
  description = "The deploy system of record shows exactly one restart"
  kind = "invariant"
  fact = "p1.restarts"
  op = "=="
  value = 1

