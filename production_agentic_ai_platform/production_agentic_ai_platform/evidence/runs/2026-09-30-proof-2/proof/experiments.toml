  kind = "invariant"
  fact = "obs.R8.restricted"
  op = "=="
  value = "classification · acl"
  [[experiments.checks]]
  id = "P1-R8-C04"
  harness = "R8.staging"
  description = "the staging-only runbook is excluded by environment"
  kind = "invariant"
  fact = "obs.R8.staging"
  op = "=="
  value = "environment"
  [[experiments.checks]]
  id = "P1-R8-C05"
  harness = "R8.expired"
