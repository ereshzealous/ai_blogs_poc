# S1 frozen corpus (simulated). Every record is data the admission code may read: content, source, provenance, scope,
# lifecycle, trust and frozen relations. Ground truth (valid / relevant / useful / failure class) is NOT here; it lives
# in labels.yaml, which only the scorer reads.
#
# trust.source_class: system-of-record | source-owned | platform-verified | operator-note | user-asserted | unverified-external
# claim_type:         current_fact | procedure | incident_history | preference | workflow_status | instruction
# scope.environment:  production | staging | all        scope.entities: service names, or "*" for estate-wide knowledge

base:
  # ---------------------------------------------------------------- enterprise knowledge (source-owned)
  - id: kb-rb-chk-007
    memory_type: knowledge
    content: >-
      RB-CHK-007 · checkout-api latency after a deploy. Roll the release back through the release pipeline
      (source_control.rollback_release) to the last good version. Production rollbacks need incident-commander
      approval. Do not restart pods or run kubectl rollout undo: a restart does not fix a regressed release, and GitOps
      reverts direct changes.
    source: { type: runbook, id: RB-CHK-007, owner: checkout-team }
    provenance: { created_by: checkout-team, evidence_refs: [RB-CHK-007@v4] }
    scope: { tenant: acme, environment: all, entities: [checkout-api] }
    created_at: "2026-07-01T00:00:00Z"
    expires_at: null
    trust: { source_class: source-owned }
    claim_type: procedure

  - id: kb-rb-db-003
    memory_type: knowledge
    content: >-
      RB-DB-003 · orders-db connection pool saturation. First check whether a recent release changed pool size or
      query patterns; if a release caused it, roll that release back per the owning service's runbook. Raising
      max_connections is a last resort and needs DBA approval.
    source: { type: runbook, id: RB-DB-003, owner: data-platform }
    provenance: { created_by: data-platform, evidence_refs: [RB-DB-003@v2] }
    scope: { tenant: acme, environment: all, entities: [orders-db] }
    created_at: "2026-06-12T00:00:00Z"
    expires_at: null
    trust: { source_class: source-owned }
    claim_type: procedure

  - id: kb-rb-gen-012
    memory_type: knowledge
    content: >-
      RB-GEN-012 · GitOps rollbacks. Every production rollback goes through the release pipeline. Direct kubectl changes
      to production workloads are reverted by the GitOps controller within minutes.
    source: { type: runbook, id: RB-GEN-012, owner: platform-team }
    provenance: { created_by: platform-team, evidence_refs: [RB-GEN-012@v1] }
    scope: { tenant: acme, environment: production, entities: ["*"] }
    created_at: "2026-04-20T00:00:00Z"
    expires_at: null
    trust: { source_class: source-owned }
    claim_type: procedure

  - id: kb-rb-pay-002
    memory_type: knowledge
    content: >-
      RB-PAY-002 · payment-gateway timeouts. Fail over to the secondary payment provider and page the payments on-call.
    source: { type: runbook, id: RB-PAY-002, owner: payments-team }
    provenance: { created_by: payments-team, evidence_refs: [RB-PAY-002@v3] }
    scope: { tenant: acme, environment: all, entities: [payment-gateway] }
    created_at: "2026-05-30T00:00:00Z"
    expires_at: null
    trust: { source_class: source-owned }
    claim_type: procedure

  # ---------------------------------------------------------------- system of record
  - id: sor-release-v421
    memory_type: knowledge
    content: >-
      Release record: checkout-api v4.21 deployed to production at 08:41 UTC today by pipeline run 9312. The previous
      good version is v4.20.
    source: { type: release_record, id: pipeline-run-9312, owner: release-service }
    provenance: { created_by: release-service, evidence_refs: [pipeline-run-9312] }
    scope: { tenant: acme, environment: production, entities: [checkout-api] }
    created_at: "2026-09-18T08:41:00Z"
    expires_at: null
    trust: { source_class: system-of-record }
    claim_type: current_fact

  # ---------------------------------------------------------------- episodic memory (platform-verified)
  - id: ep-inc-4917
    memory_type: episode
    content: >-
      INC-4917: checkout-api v4.17 shrank the orders-db connection pool and p95 rose to 2.1 s. Rolling back to v4.16
      through the release pipeline restored latency within 6 minutes.
    source: { type: incident, id: INC-4917 }
    provenance: { created_by: incident-summary-agent, evidence_refs: [PM-4917, wf-4917/verify] }
    scope: { tenant: acme, environment: production, entities: [checkout-api, orders-db] }
    created_at: "2026-08-21T10:00:00Z"
    expires_at: "2027-02-21T00:00:00Z"
    trust: { source_class: platform-verified }
    claim_type: incident_history

  - id: ep-inc-4630
    memory_type: episode
    content: >-
      INC-4630: a checkout-api release reduced the orders-db pool size; p95 latency climbed until the release was rolled
      back through the release pipeline.
    source: { type: incident, id: INC-4630 }
    provenance: { created_by: incident-summary-agent, evidence_refs: [PM-4630] }
    scope: { tenant: acme, environment: production, entities: [checkout-api, orders-db] }
