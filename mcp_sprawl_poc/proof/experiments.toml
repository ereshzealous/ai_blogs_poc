[[experiments]]
id = "F1-R9"
title = "Follow-ups, outages and recorded failures"
question = "Does the architecture hold under scripted clarifications, approvals, corrections and outages, and where does it fall short?"
claim = "Governance is not reliability: deciding whether a call may run does not make it survive a timeout or a retry."
hypothesis = "H8: across outages and multi-turn cases the control plane executes nothing through a non-authoritative implementation and nothing duplicated or unapproved. H5: better discovery alone does not fix nonexistent targets."
setup = "Clarification, approval and correction follow-ups are scripted into the cases before the run; outages inject a transient or persistent 503 into the authoritative implementation only."
variable = "Scripted follow-up or fault."
invariant = "No fallback to a non-authoritative implementation during an outage, and no unsafe execution in a recorded failure."
limitations = ["Scripted requesters and a scripted approver, not real people.", "Retry policy belongs to the agent platform (F2) and is not built here."]
