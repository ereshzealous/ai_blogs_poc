  # ============================================================================================ restricted and vendor docs
  - source: restricted
    documents:
      - doc_id: SEC-PM-2207
        version: v1
        title: "Security postmortem: orders-db connection saturation on 30 August"
        doc_type: postmortem
        owner: security
        tenant: acme
        environments: [production]
        services: [orders-db]
        status: active
        valid_from: "2026-09-02T10:00:00Z"
        valid_to: null
        superseded_by: null
        acl: [security-ir]
        updated_at: "2026-09-02T10:00:00Z"
        sections:
          - heading: Root cause
            text: >-
              A leaked partner API token (partner P-1182, token prefix mrd_live_7731) drove a credential-stuffing burst
              against /v1/orders. Each request opened a database transaction, and the orders-db pool saturated.
          - heading: Remediation
            text: >-
              Revoked the token, added per-partner rate limits, and moved partner tokens to the vault rotation schedule.

