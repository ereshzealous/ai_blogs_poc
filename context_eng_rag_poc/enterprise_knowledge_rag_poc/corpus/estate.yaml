  - source: wiki
    documents:
      - doc_id: WIKI-ONCALL-101
        version: v1
        title: "On-call basics for new SREs"
        doc_type: wiki
        owner: sre-enablement
        tenant: acme
        environments: [production]
        services: ["*"]
        status: active
        valid_from: "2026-01-20T10:00:00Z"
        valid_to: null
        superseded_by: null
        acl: [eng-all]
        updated_at: "2026-01-20T10:00:00Z"
        sections:
