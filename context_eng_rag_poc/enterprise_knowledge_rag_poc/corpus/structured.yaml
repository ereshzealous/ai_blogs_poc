# Structured systems of record, queried live (never copied into the text index). SIMULATED.
#
# deployments: Meridian's release system. One record per release (or search index build) per tenant and environment.
# cmdb:        the configuration management database. One record per (tenant, environment, service). `runbooks` maps a
#              procedure key to the runbook of record; a missing key means the CMDB names no runbook of record for it.

