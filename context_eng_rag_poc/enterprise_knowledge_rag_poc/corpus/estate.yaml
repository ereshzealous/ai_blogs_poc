  - source: tickets
    documents:
      - doc_id: INC-4512
        version: v1
        title: "INC-4512 cart-api latency after 3.4.0"
        doc_type: ticket
        owner: incident-management
        tenant: acme
        environments: [production]
        services: [cart-api]
        status: active
        ticket_state: resolved
        valid_from: "2026-05-02T10:00:00Z"
        valid_to: null
        superseded_by: null
        acl: [eng-all]
        updated_at: "2026-05-02T13:00:00Z"
        sections:
          - heading: Summary
            text: >-
              cart-api p95 rose to 900 ms after 3.4.0 shrank the Redis pool. Rolled back to 3.3.9 through the pipeline
              with incident-commander approval; recovered in 6 minutes.

