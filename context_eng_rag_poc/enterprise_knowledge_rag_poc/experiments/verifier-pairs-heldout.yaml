    citations: [{unit_id: "CP-12@v3#emergencies", quote: "If the incident commander cannot be reached within 15 minutes, the SRE on-call lead may approve. The approval is recorded in the incident and reviewed within 24 hours."}]
    gold_supported: true
    category: supported-verbatim
    rationale: "CP-12 is acme's change policy for every acme service, so it can decide approval, and its Emergencies section states the fallback approver."

  - id: V-H03
