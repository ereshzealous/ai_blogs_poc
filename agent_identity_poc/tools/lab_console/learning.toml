# T1's Lab Console: the words and the layout.  Every number is a {{fact}} registered by tools/build_lab_console.py from
# the run directories; the kit refuses a hand-typed number.  No architecture diagrams: this page is the POC's output,
# scenario by scenario: use case, input, output, steps, data lineage, and whether the identity property held.

case_tabs = [{ id = "io", label = "Input & output" }, { id = "steps", label = "Steps" }, { id = "lineage", label = "Data lineage" }, { id = "logs", label = "Tool logs" }]

[kit]
version = "4"

[lint]
allow = ['\bT1\b', '\bF[123]\b', '\bI\d\b', '\bE\d\b', '\b\d{4}-\d{2}-\d{2}\b', '\bHTTP \d{3}\b', '(?m)^\d\. ']

[learning]
series = "Production AI Engineering"
id = "T1"
topic = "Agent identity"
label = "T1 · Lab Console · run {{run.id}}"
title = "Shared account, user token, delegation chain: scenario by scenario"
question = "The same rollback under three identity models, attacked on purpose. For every scenario: what went in, what came out, where identity broke, and where each number came from."
claim = ["Every scenario, its input and output.", "Every broken identity, at the step it broke."]
byline = "T1 · Production AI Engineering"
filed = "{{run.filed}}"
brand = "Production AI Engineering"
tagline = "Build. Test. Learn. Ship responsibly."
note = "Generated from the run directories; rebuild after every run"
state = "RECORDED"
links = [{ label = "Evidence Check", href = "agent-identity-evidence.html" }, { label = "Run report", href = "agent-identity-report.html" }, { label = "Real vs simulated", href = "agent-identity-real-vs-simulated.html" }]

[dimensions]
factor = { label = "Experiment", unit = "", all = "All experiments" }
result = { pass = "As expected", fail = "Not as expected" }
severity = [{ id = "none", label = "Held", tone = "ok" }, { id = "qualified", label = "Qualified", tone = "warn" }, { id = "broken", label = "Broken", tone = "bad" }]
[[dimensions.variants]]
key = "A"
name = "Shared account"
color = "red"
policy = "one automation account for every agent, head and runtime"
[[dimensions.variants]]
key = "B"
name = "User token"
color = "orange"
policy = "the agent is handed the human's own token (impersonation)"
[[dimensions.variants]]
key = "C"
name = "Delegation chain"
color = "green"
policy = "subject + actor chain, narrowed scopes, workload-bound token, minted tool credentials, hash-chained audit"
governed = true

[[pages]]
id = "overview"
title = "Overview"
icon = "home"
  [[pages.blocks]]
  type = "run_card"
  kpis = [["{{run.scenarios}}", "Scenarios"], ["{{all.held}}", "Held"], ["{{all.qualified}}", "Qualified"], ["{{all.broken}}", "Broken"], ["{{checks.passed}}/{{checks.total}}", "Checks passed"], ["{{run.events}}", "Recorded events"]]
  flow_title = "What every scenario records"
  flow = [{ icon = "user", title = "Head", sub = "who invoked, for whom", tone = "purple" }, { icon = "lock", title = "Trust layer", sub = "exchange, delegation, narrowing", tone = "blue" },
          { icon = "cpu", title = "Agent", sub = "a fixed plan; holds no tokens", tone = "blue" }, { icon = "server", title = "Gateway", sub = "policy, approval, broker", tone = "orange" },
          { icon = "box", title = "Tool", sub = "its own log of what it saw", tone = "gray" }, { icon = "check", title = "Checks", sub = "read from the record and the logs", tone = "green" }]
  systems = "systems"
  badges = [["flask", "Run {{run.id}}"], ["check", "Checks {{checks.passed}}/{{checks.total}}"], ["refresh", "Deterministic: a rerun is byte-identical (make verify)"], ["cpu", "No model: fixed agent plans"]]
  [[pages.blocks]]
  type = "metric_grid"
  style = "margin-top:16px"
  items = [{ value = "{{A.held.kn}}", label = "Shared account · held", metric = "held-A" }, { value = "{{A.broken.kn}}", label = "Shared account · broken", metric = "broken-A" }, { value = "{{B.held.kn}}", label = "User token · held", metric = "held-B" },
           { value = "{{B.broken.kn}}", label = "User token · broken", metric = "broken-B" },
           { value = "{{C.held.kn}}", label = "Delegation chain · held", metric = "held-C" }, { value = "{{C.qualified.kn}}", label = "Delegation chain · qualified", metric = "qualified-C" },
           { value = "{{C.broken.kn}}", label = "Delegation chain · broken", metric = "broken-C" }]
  [[pages.blocks]]
  type = "table"
  data = "matrix"
  title = "Every experiment, every identity model"
  sub = "✓ held · ~ qualified (held within a stated bound) · ✕ broken. One mark per scenario; select a scenario on the Scenarios page for its detail."
  [[pages.blocks]]
  type = "callout"
  icon = "bulb"
  title = "How a scenario's outcome is decided"
  text = "Held means the identity property the scenario tests held. Qualified means it held only within a stated bound, such as a credential's lifetime. Broken means the identity model lost it: the anti-pattern scenarios exist to show exactly that. Outcomes are read from the platform's audit record and each tool's own log. Separately, the run's own checks confirm each scenario behaved as expected: {{all.as_expected}} of {{run.scenarios}} did."

[[pages]]
id = "runs"
title = "Scenarios"
icon = "list"
count = "rows"
  [[pages.blocks]]
  type = "case_explorer"
  heading = "Scenarios"
  flag_tab = "Qualified and broken"
  search = "Search scenario ids, use cases, where identity broke…"
  csv_head = "scenario,use_case,identity_model,{factor},as_expected,outcome,where_it_broke"
  columns = [{ label = "Outcome", show = "severity" }, { label = "Where it broke", kv = "Where it broke" }, { label = "Checks", kv = "Checks" }, { label = "Identity model", kv = "Identity model" }]

[[pages]]
id = "problems"
title = "Broken & qualified"
icon = "alert"
  [[pages.blocks]]
  type = "head"
  title = "Where identity broke"
  sub = "Every scenario whose identity property did not simply hold, the step where it broke, and what the record shows. Select a row for its steps."
  [[pages.blocks]]
  type = "table"
  data = "problems"
  title = "Broken and qualified · run {{run.id}}"
  sub = "{{all.broken}} broken and {{all.qualified}} qualified, out of {{run.scenarios}} scenarios."
  [[pages.blocks]]
  type = "table"
  data = "every"
  title = "All scenarios"
  sub = "{{run.scenarios}} scenarios across {{run.experiments}} experiments. Select a row for its input, output, steps and lineage."

[[pages]]
id = "checks"
title = "Checks"
icon = "check"
  [[pages.blocks]]
  type = "head"
  title = "The run's checks, and the scenarios that answer them"
  sub = "Written into the POC's code and evaluated by the run into checks.json: {{checks.passed}} of {{checks.total}} passed."
  [[pages.blocks]]
  type = "table"
  data = "checks"
  title = "Checks · run {{run.id}}"
  sub = "A failing check fails the run and the evidence documents refuse to build."

[[pages]]
id = "lineage"
title = "Data lineage"
icon = "layers"
  [[pages.blocks]]
  type = "head"
  title = "From the scenario's inputs to the published number"
  sub = "The files that carry each scenario's data, in order. Every scenario's Data lineage tab lists its own files with record counts."
  [[pages.blocks]]
  type = "table"
  data = "lineage"
  title = "Per-scenario lineage"
  sub = "Paths inside the run directory; ‹scenario› is the scenario id, for example the first row on the Scenarios page."
  [[pages.blocks]]
  type = "table"
  data = "allruns"
  title = "Runs found"
  sub = "Every run directory with recorded scenarios is listed here and selectable on the Scenarios page ({{run.sources}} found). A new run appears after the page is rebuilt."

[[pages]]
id = "raw"
title = "Raw evidence"
icon = "folder"
footer = true
  [[pages.blocks]]
  type = "artifacts"
  sub = "Where every value on these pages comes from."
  files = [["agent_identity_poc/runs/{{run.id}}/scenarios/‹scenario›/scenario.json", "each scenario's input, expected and observed result, outcome and checks"],
           ["agent_identity_poc/runs/{{run.id}}/scenarios/‹scenario›/audit.jsonl", "each scenario's platform record: starts, delegations, decisions, approvals, revocations (hash-chained)"],
           ["agent_identity_poc/runs/{{run.id}}/scenarios/‹scenario›/tool-logs.json", "what each simulated system was shown, in its own log"],
           ["agent_identity_poc/runs/{{run.id}}/scenarios/‹scenario›/effects.json", "what the systems physically changed"],
           ["agent_identity_poc/runs/{{run.id}}/checks.json", "the run's checks ({{checks.passed}}/{{checks.total}})"],
           ["agent_identity_poc/runs/{{run.id}}/facts.json", "every number the editions and evidence documents substitute"],
           ["agent_identity_poc/runs/{{run.id}}/manifest.json", "environment, config hashes, what is real and what is simulated"]]

[[pages]]
id = "reproduce"
title = "Reproduce"
icon = "terminal"
footer = true
  [[pages.blocks]]
  type = "reproduce"
  quick_sub = "From the agent_identity folder."
  quickstart = [["Set up the POC (Python, uv)", "make setup"], ["Run the tests", "make test"], ["Run the experiments and rebuild this page", "make run"],
                ["Verify the published run, byte for byte", "make verify"], ["Rebuild this page only", "make console"]]
  environment = [["Python", "{{run.python}}", "uv sync --group dev"], ["Scenarios", "{{run.scenarios}} per run", "make run"]]
  replay_title = "Determinism"
  replay_sub = "The run is deterministic: make verify reruns every experiment into a fresh copy and compares it with the published run."
  reproduced_as = "byte-identical"

[claims]
title = ""

[[metrics]]
id = "held-A"
variant = "A"
headline = "{{A.held.kn}} held"
statement = "{{A.held}} of {{A.runs}} shared-account scenarios kept the identity property they test"
breakdown_title = "By experiment"
source = "A.held"

[[metrics]]
id = "broken-A"
variant = "A"
headline = "{{A.broken.kn}} broken"
statement = "{{A.broken}} of {{A.runs}} shared-account scenarios lost the identity property they test"
breakdown_title = "By experiment"
source = "A.broken"

[[metrics]]
id = "held-B"
variant = "B"
headline = "{{B.held.kn}} held"
statement = "{{B.held}} of {{B.runs}} user-token scenarios kept the identity property they test"
breakdown_title = "By experiment"
source = "B.held"

[[metrics]]
id = "broken-B"
variant = "B"
headline = "{{B.broken.kn}} broken"
statement = "{{B.broken}} of {{B.runs}} user-token scenarios lost the identity property they test"
breakdown_title = "By experiment"
source = "B.broken"

[[metrics]]
id = "held-C"
variant = "C"
headline = "{{C.held.kn}} held"
statement = "{{C.held}} of {{C.runs}} delegation-chain scenarios kept the identity property they test"
breakdown_title = "By experiment"
source = "C.held"

[[metrics]]
id = "qualified-C"
variant = "C"
headline = "{{C.qualified.kn}} qualified"
statement = "{{C.qualified}} of {{C.runs}} delegation-chain scenarios held only within a stated bound"
breakdown_title = "By experiment"
source = "C.qualified"

[[metrics]]
id = "broken-C"
variant = "C"
headline = "{{C.broken.kn}} broken"
statement = "{{C.broken}} of {{C.runs}} delegation-chain scenarios lost the identity property they test"
breakdown_title = "By experiment"
source = "C.broken"
