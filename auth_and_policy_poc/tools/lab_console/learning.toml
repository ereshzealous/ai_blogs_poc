# T2's Lab Console: the words and the layout.  Every number is a {{fact}} registered by tools/build_lab_console.py from
# the recorded run; the kit refuses a hand-typed number.  This page is the POC's test results, check by check: what went
# in, what came out, the decision behind it, the audit records it left, and where each number came from.
case_tabs = [{ id = "result", label = "Input & output" }, { id = "decision", label = "Decision" }, { id = "audit", label = "Audit trail" }, { id = "source", label = "Source" }]

[kit]
version = "4"

[lint]
allow = ['\bT2\b', '\bAUTHZ-INV-\d{2}\b', '\bL[1-4]\b', '\bINC-\d+\b', '\bSEV-\d\b', '\b\d{4}-\d{2}-\d{2}\b', '\b\d{2}:\d{2}(:\d{2})?\b', '\bv\d+\.\d+\.\d+\b',
         '\bF\d\b', '\bA\d\b', '\bC\d\b', '(?m)^\d\. ', '\bPart 5\b', '\bsha256\b']

[learning]
series = "Production AI Engineering"
id = "T2"
topic = "Authorization & policy"
label = "T2 · Lab Console · run {{run.id}}"
title = "Authorization & policy for AI agents: every check, recorded"
question = "An incident agent (incident-agent-prod, acting for sre-team) works a SEV-1 on payment-service. Every tool call passes a policy gateway. For every check: what the agent asked, what policy decided and why, what the gateway did, and whether it matched the expected outcome."
claim = ["Every decision, checked against its expected outcome.", "Every number, traced to a recorded file."]
byline = "T2 · Production AI Engineering · Part 5"
filed = "{{run.filed}}"
brand = "Production AI Engineering"
tagline = "Build. Test. Learn. Ship responsibly."
note = "Generated from the recorded run; rebuild after every run"
state = "RECORDED"
links = [{ label = "Technical edition", href = "../authorization-and-policy-for-ai-agents.html" }, { label = "Medium edition", href = "../medium/authorization-and-policy-for-ai-agents-medium.html" }]

[dimensions]
factor = { label = "Expected outcome", unit = "", all = "Any expected outcome" }
result = { pass = "Passed", fail = "Failed" }
severity = [{ id = "none", label = "Passed", tone = "ok" }, { id = "fail", label = "Failed", tone = "bad" }, { id = "error", label = "Error", tone = "bad" }]
[[dimensions.variants]]
key = "R"
name = "Incident run · L4 replay"
color = "blue"
policy = "the recorded incident: {{calls.proposed}} proposed calls, the approval attempts, the re-submitted call, and the L4 replay tests"
[[dimensions.variants]]
key = "S"
name = "Context sweep"
color = "indigo"
policy = "one production rollback, {{sweep.n}} contexts"
[[dimensions.variants]]
key = "T"
name = "L1 · Policy tests"
color = "orange"
policy = "tests/test_l1_policy.py: the decision table, the freeze case, combining, conditions, evidence, fingerprint"
[[dimensions.variants]]
key = "V"
name = "L2 · Invariants"
color = "green"
policy = "tests/test_l2_invariants.py: the named production authorization invariants"
governed = true
[[dimensions.variants]]
key = "G"
name = "L3 · Gateway tests"
color = "amber"
policy = "tests/test_l3_gateway.py: the real enforcement path, end to end"

[[pages]]
id = "overview"
title = "Overview"
icon = "home"
  [[pages.blocks]]
  type = "run_card"
  kpis = [["{{checks.all}}", "Checks"], ["{{checks.passed}}", "Passed"], ["{{checks.failed}}", "Failed"], ["{{decisions.total}}", "Policy decisions"], ["{{audit.records}}", "Audit records"], ["{{inv.passed}}/{{inv.total}}", "Invariants hold"]]
  flow_title = "How one tool call is checked"
  flow = [{ icon = "alert", title = "Event", sub = "Datadog alert opens the incident", tone = "gray" }, { icon = "user", title = "Identity", sub = "who the agent is, and for whom", tone = "purple" },
          { icon = "shield", title = "Gateway", sub = "every call enters here", tone = "blue" }, { icon = "target", title = "Policy", sub = "RBAC, then ReBAC, then ABAC", tone = "purple" },
          { icon = "check", title = "Approval", sub = "a human, bound to the exact call", tone = "orange" }, { icon = "lock", title = "Audit", sub = "hash-chained record", tone = "green" }]
  systems = "systems"
  badges = [["flask", "Run {{run.id}}"], ["target", "Policy {{policy.version}}"], ["check", "Invariants {{inv.passed}}/{{inv.total}} · test layers {{layers.pass}}/{{layers.n}}"], ["refresh", "Replay {{verify.replay}}: {{replay.same}}/{{replay.files}} files byte-identical"]]
  [[pages.blocks]]
  type = "metric_grid"
  style = "margin-top:16px"
  items = [{ value = "{{R.kn}}", label = "Incident run · L4 replay", metric = "pass-R" }, { value = "{{S.kn}}", label = "Context sweep", metric = "pass-S" },
           { value = "{{T.kn}}", label = "L1 · policy tests", metric = "pass-T" }, { value = "{{V.kn}}", label = "L2 · invariants hold", metric = "pass-V" },
           { value = "{{G.kn}}", label = "L3 · gateway tests", metric = "pass-G" }]
  [[pages.blocks]]
  type = "table"
  data = "suites"
  title = "Five suites, one run"
  sub = "Select a suite on the Checks page, or any row below, for its input, output, decision and audit trail."
  [[pages.blocks]]
  type = "callout"
  icon = "bulb"
  title = "How a check passes"
  text = "Each proposed call, approval attempt and sweep context has an expected decision (and, where it matters, the rule that must produce it) in `scenario.toml`. A check passes when the recorded decision and rule match, and the gateway enforced the decision: an allowed call ran, a denied call never reached the tool, an approval-gated call waited. Tests pass when `unittest` says so, in four layers: L1 policy units, L2 the named invariants, L3 the gateway end to end, L4 the recorded replay."

[[pages]]
id = "checks"
title = "Checks"
icon = "list"
count = "rows"
  [[pages.blocks]]
  type = "case_explorer"
  heading = "Every check"
  flag_tab = "Failed checks"
  search = "Search checks, actions, rules…"
  csv_head = "check,case,suite,{factor},passed,status,note"
  columns = [{ label = "Result", show = "severity" }]

[[pages]]
id = "incident"
title = "Incident run"
icon = "clock"
  [[pages.blocks]]
  type = "head"
  title = "The incident, call by call"
  sub = "{{calls.proposed}} proposed calls: {{calls.executed}} tool executions, {{calls.blocked}} denials, {{dec.ALLOW_WITH_APPROVAL}} approval request. Production rollback evidence went from {{evidence.first}} (denied, below the {{evidence.floor}} floor) to {{evidence.final}}; payment-service ended on {{final.version}}."
  [[pages.blocks]]
  type = "metric_grid"
  items = [{ value = "{{dec.ALLOW}}", label = "ALLOW", metric = "decisions-R" }, { value = "{{dec.ALLOW_WITH_CONSTRAINTS}}", label = "ALLOW_WITH_CONSTRAINTS", metric = "decisions-R" },
           { value = "{{dec.ALLOW_WITH_APPROVAL}}", label = "ALLOW_WITH_APPROVAL", metric = "decisions-R" }, { value = "{{dec.DENY}}", label = "DENY", metric = "decisions-R" }]
  [[pages.blocks]]
  type = "timeline"
  data = "story"
  title = "Timeline"
  sub = "Times from the audit log. Select an event for its check."
  [[pages.blocks]]
  type = "table"
  data = "decisions"
  title = "Every proposed call"
  sub = "✓ the decision, rule and enforcement matched the expected outcome. Select a row for both audiences of the decision."

[[pages]]
id = "sweep"
title = "Context sweep"
icon = "layers"
  [[pages.blocks]]
  type = "head"
  title = "One request, {{sweep.n}} contexts"
  sub = "The same production rollback of payment-service, re-asked with one thing changed each time: {{sweep.ALLOW}} ALLOW, {{sweep.ALLOW_WITH_APPROVAL}} ALLOW_WITH_APPROVAL, {{sweep.DENY}} DENY. The agent, the tool and the request never change."
  [[pages.blocks]]
  type = "table"
  data = "sweep"
  title = "Sweep results"
  sub = "Select a row for what was varied and what was held constant."

[[pages]]
id = "tests"
title = "Tests & invariants"
icon = "check"
  [[pages.blocks]]
  type = "head"
  title = "Policy is code, so it has tests"
  sub = "`python3 -m unittest discover -s tests -v`, recorded by `python3 -m authz.verify`: {{tests.methods}} test methods, {{tests.checks}} tests and subtests, {{tests.passed}} passed, in {{layers.n}} layers. The {{inv.total}} invariants are also recorded by the run itself."
  [[pages.blocks]]
  type = "table"
  data = "invariants"
  title = "L2 · The named production invariants"
  sub = "{{inv.passed}} of {{inv.total}} hold, across {{inv.cases}} named cases. Each case is asserted again by the test suite. Select one for its cases."
  [[pages.blocks]]
  type = "table"
  data = "tests"
  title = "L1 · Decision table"
  sub = "Each case names the request, the expected decision and the rule that must produce it."
  [[pages.blocks]]
  type = "table"
  data = "gateway"
  title = "L3 · Gateway integration"
  sub = "The real enforcement path: denied calls never reach a tool, constraints are applied by the gateway, approvals wait, stale authority is re-checked, tools refuse calls without a broker credential, and a failing policy engine means DENY."
  [[pages.blocks]]
  type = "table"
  data = "replay"
  title = "L4 · Recorded replay"
  sub = "The incident re-run into a fresh directory and compared byte for byte with the recorded run; every published fact re-derived from the artifacts."

[[pages]]
id = "audit"
title = "Audit chain"
icon = "lock"
  [[pages.blocks]]
  type = "head"
  title = "The hash-chained decision log"
  sub = "{{audit.records}} records in `decisions.jsonl`, each re-hashed from the file by `authz.verify`. Chain valid: {{audit.valid}}. Editing one DENY to ALLOW in a copy was detected: {{tamper.detected}}."
  [[pages.blocks]]
  type = "table"
  data = "chain"
  title = "Every record"
  sub = "Each record carries the previous record's hash. Tamper-evident, not tamper-proof: in production, anchor the chain in an independent, append-only store."

[[pages]]
id = "lineage"
title = "Data lineage"
icon = "folder"
  [[pages.blocks]]
  type = "head"
  title = "From the scenario to this page"
  sub = "The files that carry each check, in order. Every row's Source tab names its own entries."
  [[pages.blocks]]
  type = "table"
  data = "lineage"
  title = "Lineage"
  sub = "Nothing on this page is typed by hand: the builder reads these files and refuses to build if they disagree."

[[pages]]
id = "raw"
title = "Raw evidence"
icon = "folder"
footer = true
  [[pages.blocks]]
  type = "artifacts"
  sub = "Where every value on these pages comes from."
  files = [["authz_poc/runs/{{run.id}}/decisions.jsonl", "the audit log ({{audit.records}} records)"],
           ["authz_poc/runs/{{run.id}}/expectations.json", "every recorded outcome against its expected one"],
           ["authz_poc/runs/{{run.id}}/tests.json", "every test and subtest ({{tests.checks}})"],
           ["authz_poc/runs/{{run.id}}/invariants.json", "the invariants ({{inv.total}})"],
           ["authz_poc/runs/{{run.id}}/timeline.json", "each proposed call"],
           ["authz_poc/runs/{{run.id}}/sweep.json", "each sweep context"],
           ["authz_poc/runs/{{run.id}}/facts.json", "every number the articles quote"],
           ["authz_poc/runs/{{run.id}}/manifest.json", "input hashes ({{inputs.count}} files)"],
           ["authz_poc/runs/{{run.id}}/verification.json", "the verification summary: invariants, test layers, replay {{verify.replay}}, audit chain {{verify.chain}}"],
           ["authz_poc/runs/{{run.id}}/receipt.json", "the production rollback, reconstructed from the log"]]

[[pages]]
id = "reproduce"
title = "Reproduce"
icon = "terminal"
footer = true
  [[pages.blocks]]
  type = "reproduce"
  quick_sub = "From the auth_and_policy folder. Standard library only."
  quickstart = [["Run the incident, the sweep and the invariants", "cd authz_poc && python3 -m authz.run"], ["Run every test (L1–L4)", "python3 -m unittest discover -s tests -v"],
                ["Verify: invariants, tests twice, replay, audit chain", "python3 -m authz.verify"], ["Rebuild this page", "cd .. && python3 tools/build_lab_console.py"]]
  environment = [["Python", "{{python}}", "any Python with tomllib"], ["Agent", "scripted, no model", "nothing to install"], ["Policy", "{{policy.version}}", "config/policy.toml"]]
  replay_title = "Replay"
  replay_sub = "The scenario re-run into a fresh directory: every output file compared byte for byte with the recorded run."
  reproduced_as = "same result"
  frozen_sub = "sha256 of every input recorded with the run; ✓ when today's file still matches."

[claims]
title = ""

[[metrics]]
id = "pass-R"
variant = "R"
headline = "{{R.kn}} passed"
statement = "{{R.pass}} of {{R.n}} incident-run and L4 replay checks passed"
breakdown_title = "By what decided it"
source = "R.pass"
[[metrics]]
id = "pass-S"
variant = "S"
headline = "{{S.kn}} passed"
statement = "{{S.pass}} of {{S.n}} sweep contexts produced the expected decision and rule"
breakdown_title = "By what decided it"
source = "S.pass"
[[metrics]]
id = "pass-T"
variant = "T"
headline = "{{T.kn}} passed"
statement = "{{T.pass}} of {{T.n}} L1 policy tests and subtests passed"
breakdown_title = "By what decided it"
source = "T.pass"
[[metrics]]
id = "pass-V"
variant = "V"
headline = "{{V.kn}} hold"
statement = "{{V.pass}} of {{V.n}} invariants hold, in the run and in the test suite"
breakdown_title = "By kind"
source = "V.pass"
[[metrics]]
id = "pass-G"
variant = "G"
headline = "{{G.kn}} passed"
statement = "{{G.pass}} of {{G.n}} L3 gateway integration tests and subtests passed"
breakdown_title = "By layer"
source = "G.pass"
[[metrics]]
id = "decisions-R"
variant = "R"
headline = "{{calls.proposed}} proposed calls"
statement = "The first-pass decision on each of the {{calls.proposed}} calls the agent proposed"
breakdown_title = "By decision"
source = "calls.proposed"
