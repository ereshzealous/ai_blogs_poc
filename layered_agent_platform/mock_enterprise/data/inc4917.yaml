commits:
  a91f3c2:
    repository: shop/checkout-api
    message: "Migrate order persistence to orders-client v3"
    author: checkout-engineering
    committed_at: "2026-09-07T15:41:00Z"
    files_changed: [config/database.yaml, internal/orders/client.go, go.mod]
    diff: |
      --- a/config/database.yaml
      +++ b/config/database.yaml
      @@ -4,6 +4,8 @@ orders_db:
         host: ${ORDERS_DB_HOST}
         name: orders
      -  max_connections: ${DB_POOL_MAX:50}
      -  acquire_timeout_ms: 5000
      +  # pool settings now come from orders-client v3
      +  pool:
      +    max_connections: 10
      +    acquire_timeout_ms: 2000
      --- a/go.mod
      +++ b/go.mod
      -	shop/orders-client v2.9.4
      +	shop/orders-client v3.0.1
  7c4e1b9:
    repository: shop/checkout-api
    message: "Add rounding test for multi-currency cart totals"
    author: checkout-engineering
    committed_at: "2026-09-07T12:05:00Z"
    files_changed: [internal/cart/totals_test.go]
    diff: |
      --- a/internal/cart/totals_test.go
      +++ b/internal/cart/totals_test.go
      +func TestTotalsRoundHalfEven(t *testing.T) { ... }
  1b7f0e4:
    repository: shop/checkout-api
    message: "Retry payment authorisation once on 503"
    author: checkout-engineering
    committed_at: "2026-09-01T11:30:00Z"
    files_changed: [internal/payments/authorize.go]
    diff: |
      --- a/internal/payments/authorize.go
      +++ b/internal/payments/authorize.go
      +	if resp.StatusCode == 503 && attempt == 0 { return a.authorize(ctx, req, attempt+1) }
  5e02d7b:
    repository: shop/payment-gateway
    message: "Bump card-processor SDK to 4.2.0"
    author: payments-platform
    committed_at: "2026-09-08T09:31:00Z"
    files_changed: [go.mod]
    diff: |
      --- a/go.mod
      +++ b/go.mod
      -	cardproc/sdk v4.1.3
      +	cardproc/sdk v4.2.0
  c3d9a10:
    repository: shop/inventory-api
    message: "Batch stock reservation writes"
    author: fulfilment-engineering
    committed_at: "2026-09-07T10:50:00Z"
    files_changed: [internal/reservations/writer.go]
    diff: |
      --- a/internal/reservations/writer.go
      +++ b/internal/reservations/writer.go
      +	const batchSize = 200

