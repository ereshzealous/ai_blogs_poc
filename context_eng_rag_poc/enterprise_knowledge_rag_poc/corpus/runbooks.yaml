    procedure_key: "*/staging-config-change"
    action: raise_pool_size
    approval: none
    acl: [eng-all]
    updated_at: "2026-03-02T15:30:00Z"
    sections:
      - heading: Pool and connection settings
        text: >-
          You may change datasource settings in place: edit maxPoolSize in the checkout-api ConfigMap and restart the
          pods. For orders-db, max_connections can be raised directly with ALTER SYSTEM. No approval is needed.
      - heading: Scaling
        text: >-
          Scale search query nodes with kubectl scale statefulset/search-query --replicas=<n>. Keep staging under 6
          nodes to stay inside the staging budget.

  # ------------------------------------------------------------------------------------------------ order-history-api
  - doc_id: RB-OHA-001
    version: v2
    title: "order-history-api: slow order reads"
    doc_type: runbook
    owner: orders-team
    tenant: acme
    environments: [production]
    services: [order-history-api]
    status: active
    valid_from: "2026-06-15T00:00:00Z"
    valid_to: null
    superseded_by: null
    supersedes: RB-OHA-001@v1
    procedure_key: order-history-api/slow-reads
    action: enable_read_replica
    approval: none
    acl: [eng-all]
    updated_at: "2026-06-15T09:00:00Z"
    sections:
      - heading: Remediation
        text: >-
          Latency on GET /v1/orders after a deploy is almost always read amplification on the primary. Turn on
          read-replica routing with the feature flag oha.read_replica=on in the flag service. No approval is needed.
      - heading: When not to
        text: >-
          Do not route reads to the replica if replica lag is above 30 seconds; in that case roll the release back
          through the release pipeline instead.

  # ------------------------------------------------------------------------------------------------ orders-db
  - doc_id: RB-DB-003
    version: v2
    title: "orders-db: connection pool saturation"
    doc_type: runbook
    owner: data-platform
    tenant: acme
    environments: [production, staging]
    services: [orders-db]
    status: active
    valid_from: "2026-06-12T00:00:00Z"
    valid_to: null
    superseded_by: null
    supersedes: RB-DB-003@v1
    procedure_key: orders-db/pool-saturation
    action: rollback_release
    approval: incident-commander
    acl: [eng-all]
    updated_at: "2026-06-12T12:00:00Z"
    sections:
      - heading: Diagnose
        text: >-
          First check whether a recent release of a client service changed its pool size or query pattern. Compare the
          connections-by-application view with the baseline.
      - heading: Remediation
        text: >-
          If a client release caused it, roll that release back per the owning service's runbook. Do not restart
          orders-db: a restart drops every connection and turns a slowdown into an outage.
      - heading: max_connections
        text: >-
          Raising max_connections is a last resort and needs DBA approval; every increase must be recorded in the
          incident.

  - doc_id: RB-DB-020
    version: v1
    title: "orders-db: nightly backup verification"
    doc_type: runbook
    owner: data-platform
    tenant: acme
    environments: [production]
    services: [orders-db]
    status: active
    valid_from: "2026-05-01T00:00:00Z"
    valid_to: null
    superseded_by: null
    supersedes: null
    procedure_key: orders-db/backup-verification
    action: none
    approval: none
    acl: [eng-all]
    updated_at: "2026-05-01T07:00:00Z"
    sections:
      - heading: Backups
        text: >-
          orders-db takes a full backup at 01:00 UTC and WAL archives every 5 minutes to the DR region bucket. The
          verification job restores last night's backup into a scratch instance and checks row counts.
      - heading: Failures
        text: >-
          If verification fails twice in a row, open a SEV3 for data-platform. Do not delete old backups manually.

  # ------------------------------------------------------------------------------------------------ payment-gateway
  - doc_id: RB-PAY-002
    version: v3
    title: "payment-gateway: card network timeouts"
    doc_type: runbook
    owner: payments-platform
    tenant: acme
    environments: [production]
    services: [payment-gateway]
    status: active
    valid_from: "2026-05-30T00:00:00Z"
    valid_to: null
    superseded_by: null
    supersedes: RB-PAY-002@v2
    procedure_key: payment-gateway/card-network-timeouts
    action: failover_provider
    approval: none
    acl: [eng-all]
    updated_at: "2026-05-30T10:20:00Z"
    sections:
      - heading: Remediation
        text: >-
          When authorization calls to the card network time out above 2%, fail over to the secondary payment provider
          (payments-ctl failover --to secondary) and page the payments on-call.
      - heading: Recovery
        text: >-
          Fail back once the primary network's error rate has been under 0.5% for 15 minutes.

