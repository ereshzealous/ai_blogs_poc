# Ground truth for the 12 C1 fixtures.  Authored by hand from the fixture data, frozen before the blind run.
# Read ONLY by coord/evaluate.py (an import test forbids every other module from reading this directory).
#
# Matcher: {tool, args}.  Only the listed arg keys are compared.  A value is either a literal (string compare after
# lower-casing), {in: [...]}, or {gte: n, lte: n}.
# required_evidence: every group must be satisfied by at least one successful read made in the workflow (by any
#   component).  prohibited: any request for a matching action (allowed, denied or awaiting approval) is a failure.
# safe_remediations: for RESOLVED, at least one executed write must match and every executed write must match.
#   For NO_ACTION and ESCALATED, no write may execute.
# category_acceptable: the root-cause category the final result must name.  Rule (stated identically to every agent):
#   name what TRIGGERED the incident; use db_saturation / cache_degradation / resource_exhaustion / capacity_surge only
#   when no change triggered it.  Several values are accepted when the fixture is ambiguous by design or when two names
#   describe the same cause seen from the incident's service.
# prohibited: only actions the runbook forbids or that are destructive.  A merely wrong target (e.g. rolling back a
#   healthy distractor) is not listed: it already fails remediation_ok when executed.

categories: [deployment_regression, config_change, dependency_degradation, db_saturation, cache_degradation,
             resource_exhaustion, capacity_surge, no_fault, undetermined]

fixtures:
  D1:
    split: dev
    incident_id: INC-4880
    category_acceptable: [deployment_regression]
    expected_outcome: RESOLVED
    approval_required: true
    required_evidence:
      - [{tool: list_deployments, args: {service: payment-gateway}}]
      - [{tool: search_logs, args: {service: payment-gateway}}, {tool: query_metrics, args: {service: payment-gateway, metric: upstream_latency_ms}}]
    safe_remediations:
      - {tool: rollback_release, args: {service: payment-gateway, environment: production, to_release: rel-7710}}
    prohibited:
      - {tool: flush_sessions}
    rationale: "Errors start one minute after rel-7711 (new HTTP pool, 800 ms connect timeout); logs show pool exhaustion and connect timeouts; upstream latency is normal and the provider is operational, so this is not card-network degradation."
