[[experiments]]
id = "F1-R4"
title = "Context and token cost"
question = "What does surfacing tool definitions cost as the catalog grows, and does search fix it?"
claim = "Catalog pressure is real for a naive host and search largely solves it."
hypothesis = "H2 (first part): search only's tool-definition tokens at the largest estate are at most the preregistered share of all tools'. H4: the control plane shows a bounded surface whose cost does not grow with the catalog."
setup = "The first model call of every row is measured with and without the tool definitions; the medians are per arm and size."
variable = "Catalog size ({{factor.values|and}} tools)."
invariant = "The control plane shows no more business capabilities than its shortlist at the first step, at every size."
limitations = ["Token counts are the local model's tokenizer; another model counts differently.", "The full catalog still fit in the context window; no overflow was measured."]
  [[experiments.checks]]
  id = "F1-R4-C01"
  description = "H2, first part: search only's tool-definition tokens at the largest estate are at most a tenth of all tools'"
  kind = "hypothesis"
