[project]
name = "store-world"
version = "0.1.0"
description = "A deterministic simulated online store (Northwind Goods) and its anchor case ORD-4917, shared by the Production AI Engineering notes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/store_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
