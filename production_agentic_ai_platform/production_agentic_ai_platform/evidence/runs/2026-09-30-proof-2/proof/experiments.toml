[[experiments]]
id = "P1-R2"
harness = "R2"
title = "Effective authority is an intersection"
question = "Does a broad user permission give the agent broad authority?"
claim = "Effective authority is an intersection of the user's, the agent's, the delegation's, the workload's and the environment's permissions, never a union."
hypothesis = "Only the checkout-api production rollback is inside the intersection; every other combination is denied, naming the layers that removed it."
setup = "sre.alice holds rollback on every service in two environments; the agent's ceiling, the incident delegation, the attested workload and the production environment each grant less; dev.dan invokes the same agent."
variable = "the requested service, environment and operation, and the requesting user"
invariant = "A permission missing from any layer is not in the effective authority."
limitations = ["Principals and grants are YAML; the identity provider and workload attestation are simulated."]
tests = ["tests/test_units.py"]
  [[experiments.checks]]
  id = "P1-R2-C01"
  harness = "R2.user_broad"
  description = "sre.alice holds rollback on every service in two environments"
  kind = "invariant"
  fact = "obs.R2.user_broad"
  op = "=="
  value = 6
  [[experiments.checks]]
  id = "P1-R2-C02"
  harness = "R2.agent_narrow"
  description = "the agent's effective rollback authority for this request is one permission"
  kind = "invariant"
  fact = "obs.R2.agent_narrow"
  op = "=="
  value = "rollback:checkout-api:production"
  [[experiments.checks]]
  id = "P1-R2-C03"
  harness = "R2.checkout"
  description = "rollback checkout-api/production: inside the intersection -> REQUIRE_APPROVAL"
  kind = "invariant"
  fact = "obs.R2.checkout"
  op = "=="
  value = "REQUIRE_APPROVAL"
  [[experiments.checks]]
  id = "P1-R2-C04"
  harness = "R2.payments"
  description = "rollback payment-gateway: alice may, the agent's ceiling and the delegation do not -> DENY"
  kind = "invariant"
  fact = "obs.R2.payments"
  op = "=="
  value = "[\"DENY\", \"OUTSIDE_EFFECTIVE_AUTHORITY\", [\"agent\", \"delegation\"]]"
  [[experiments.checks]]
  id = "P1-R2-C05"
  harness = "R2.inventory"
  description = "rollback inventory-api: alice and the agent ceiling allow it, this delegation does not -> DENY"
  kind = "invariant"
  fact = "obs.R2.inventory"
  op = "=="
  value = "[\"DENY\", \"OUTSIDE_EFFECTIVE_AUTHORITY\", [\"delegation\"]]"
  [[experiments.checks]]
  id = "P1-R2-C06"
  harness = "R2.dan"
  description = "dev.dan invokes the same agent: the agent's ceiling cannot lend him rollback -> DENY"
  kind = "invariant"
  fact = "obs.R2.dan"
  op = "=="
  value = "[\"DENY\", \"OUTSIDE_EFFECTIVE_AUTHORITY\", [\"user\", \"delegation\"]]"
