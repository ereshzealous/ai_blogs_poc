title = "H1 · Exact action binding"
h = "H1"
question = "Does an approval authorize only the exact action the human reviewed?"
claim = "An approval for action A never executes action B."
hypothesis = "C: No action other than the approved one executes. B: Digest binding alone stops a different action. A: A boolean approval lets a different action through (predicted to break). A: Even under A, a policy DENY (namespace delete) is not turned into ALLOW by an approval: policy is enforced on every call."
setup = "Alice approves the rollback at +5 min. On resume the agent presents a different action: restartDeployment, or deleteProductionNamespace."
invariant = "An approval for action A never executes action B."
scenarios = ["H1a", "H1b"]
limitations = "Deterministic simulation: simulated Kubernetes, identity provider, chat channel and clock; scripted human decisions; no model."

