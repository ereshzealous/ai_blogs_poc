# Capability layer: business capabilities, not raw tools. An agent names a capability; the registry binds it to a
# versioned contract, an owner, a risk class, the scopes it needs, and a backend adapter (MCP server or API).
# A capability that is not listed here does not exist for the runtime. There is deliberately no execute_sql and no
# kubectl here: raw access is not a capability.
systems: [monitoring, logs, traces, deploy, itsm, chat]       # each backend holds ONE credential, at the gateway

capabilities:
  getServiceHealth:
    version: 1.2.0
    owner: sre-platform
    system: monitoring
    kind: read
    scope: telemetry:read
    timeout_s: 2
    retries: 2
    schema: {required: [service, environment], properties: {service: {type: string}, environment: {type: string, enum: [production, staging]}}}
  getLogs:
    version: 2.0.1
    owner: sre-platform
    system: logs
    kind: read
    scope: telemetry:read
    untrusted_output: true          # log lines are external data: labelled untrusted, never instructions
    timeout_s: 2
    retries: 2
    schema: {required: [service, environment], properties: {service: {type: string}, environment: {type: string, enum: [production, staging]},
             minutes: {type: integer, minimum: 1, maximum: 120}, level: {type: string, enum: [ERROR, WARN, INFO]}}}
  getTraceSummary:
    version: 1.0.4
    owner: sre-platform
    system: traces
    kind: read
    scope: telemetry:read
    timeout_s: 2
    retries: 2
    schema: {required: [service, environment], properties: {service: {type: string}, environment: {type: string, enum: [production, staging]}}}
  getRecentDeployments:
    version: 3.1.0
    owner: release-eng
    system: deploy
    kind: read
    scope: deploy:read
    timeout_s: 2
    retries: 2
    schema: {required: [service, environment], properties: {service: {type: string}, environment: {type: string, enum: [production, staging]},
             limit: {type: integer, minimum: 1, maximum: 20}}}
  getKnownIncidents:
    version: 1.1.0
    owner: sre-platform
    system: itsm
    kind: read
    scope: itsm:read
    timeout_s: 2
    retries: 2
    schema: {required: [service], properties: {service: {type: string}, signature: {type: string}}}
  createIncident:
    version: 2.2.0
    owner: sre-platform
    system: itsm
    kind: write
    risk: low
    scope: itsm:write
    idempotent: true               # the gateway sends an idempotency key; the backend keeps it
    timeout_s: 2
    retries: 2
    schema: {required: [service, environment, title, severity], properties: {service: {type: string}, environment: {type: string, enum: [production, staging]},
             title: {type: string}, severity: {type: string, enum: [SEV1, SEV2, SEV3]}, correlation_id: {type: string}}}
  postIncidentUpdate:
    version: 2.2.0
    owner: sre-platform
    system: itsm
    kind: write
    risk: low
    scope: itsm:write
    idempotent: true
    timeout_s: 2
    retries: 2
    schema: {required: [incident_id, text], properties: {incident_id: {type: string}, text: {type: string}}}
  notifyChannel:
    version: 1.0.0
    owner: collab-tools
    system: chat
    kind: write
    risk: low
    scope: chat:post
    idempotent: true
    timeout_s: 2
    retries: 2
    schema: {required: [channel, text], properties: {channel: {type: string}, text: {type: string}}}
  suggestRollback:
    version: 1.0.0
    owner: release-eng
    system: deploy
    kind: read                     # computes a plan; changes nothing
    scope: deploy:read
    timeout_s: 2
    retries: 2
    schema: {required: [service, environment], properties: {service: {type: string}, environment: {type: string, enum: [production, staging]}}}
  rollbackDeployment:
    version: 2.0.0
    owner: release-eng
    system: deploy
    kind: write
    risk: high
    scope: deploy:rollback
    idempotent: true
    timeout_s: 5
    retries: 2
    schema: {required: [service, environment, from_version, to_version], properties: {service: {type: string}, environment: {type: string, enum: [production, staging]},
             from_version: {type: string, pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"}, to_version: {type: string, pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"},
             reason: {type: string}}}
  deleteDeployment:
    version: 1.0.0
    owner: release-eng
    system: deploy
    kind: write
    risk: destructive              # registered so the platform can say no explicitly, and audit the attempt
    scope: deploy:admin
    idempotent: true
    timeout_s: 5
    retries: 0
    schema: {required: [service, environment, version], properties: {service: {type: string}, environment: {type: string}, version: {type: string}}}
