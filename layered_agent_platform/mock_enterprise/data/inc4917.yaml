# Deterministic scenario for INC-4917. Every mock backend reads this file; nothing here is random.
# All times are UTC on 2026-09-08 unless a full timestamp is given.
scenario_id: INC-4917
date: "2026-09-08"
# The investigation starts at this simulated wall-clock time.
session_start: "2026-09-08T10:40:00Z"
# Minutes the simulated clock advances after an executed rollback (rollout + observation).
rollback_observe_minutes: 10
# Minutes after a rollback starts before metrics return to baseline.
rollback_recovery_minutes: 3

services:
  checkout-api:
    display_name: Checkout API
    owner_team: checkout-engineering
    support_group: checkout-oncall
    tier: 1
    namespace: checkout
    runbook: RB-CHK-007
    slo: { p95_latency_ms: 400, availability_pct: 99.9 }
    dependencies: [orders-db, payment-gateway, inventory-api, redis-sessions]
    clusters: { production: prod-eu-west-1, staging: staging-eu-west-1, development: dev-eu-west-1 }
    replicas: { production: 6, staging: 2, development: 1 }
  payment-gateway:
    display_name: Payment Gateway
    owner_team: payments-platform
    support_group: payments-oncall
    tier: 1
    namespace: payments
    runbook: RB-PAY-002
    slo: { p95_latency_ms: 600, availability_pct: 99.95 }
    dependencies: [card-processor]
    clusters: { production: prod-eu-west-1, staging: staging-eu-west-1, development: dev-eu-west-1 }
    replicas: { production: 4, staging: 2, development: 1 }
  inventory-api:
    display_name: Inventory API
    owner_team: fulfilment-engineering
    support_group: fulfilment-oncall
    tier: 2
    namespace: inventory
    runbook: RB-INV-004
    slo: { p95_latency_ms: 300, availability_pct: 99.9 }
    dependencies: [inventory-db]
    clusters: { production: prod-eu-west-1, staging: staging-eu-west-1, development: dev-eu-west-1 }
    replicas: { production: 3, staging: 1, development: 1 }

