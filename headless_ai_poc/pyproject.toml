[project]
name = "f3-headless-ai-poc"
version = "1.0.0"
description = "F3 POC: one incident-intelligence runtime, many consumers. Event, chat, API, workflow, scheduler, CI/CD and agent heads over one governed capability layer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
hai = "hai.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rA -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
