harness = "R7"
title = "Model routing and fallback"
question = "What changes when the primary model provider is down?"
claim = "Model-provider failure is handled by the model gateway rather than by agent-specific provider code."
hypothesis = "With model A down, every call falls back to B under the same residency and approval constraints, with the same proposal, agent code and bundle; with both eligible models down the workflow fails closed."
setup = "Inject an outage of recorded-model-a, then of both eligible models."
variable = "provider availability"
invariant = "Only approved, policy-eligible models serve a request; there is no silent downgrade."
limitations = ["Recorded providers; latency, cost and quality routing are not exercised."]
tests = ["tests/test_units.py"]
  [[experiments.checks]]
  id = "P1-R7-C01"
  harness = "R7.fallback"
  description = "every model call fell back from recorded-model-a to recorded-model-b"
  kind = "invariant"
  fact = "obs.R7.fallback"
  op = "=="
  value = "{'recorded-model-b'} · true"
  [[experiments.checks]]
  id = "P1-R7-C02"
  harness = "R7.residency"
  description = "the cheaper us-resident model was never eligible for this eu tenant"
  kind = "invariant"
  fact = "obs.R7.residency"
  op = "=="
  value = "[false, [\"residency us != tenant eu\"]]"
  [[experiments.checks]]
  id = "P1-R7-C03"
  harness = "R7.approved"
  description = "the unapproved model was never eligible"
  kind = "invariant"
  fact = "obs.R7.approved"
  op = "=="
  value = "[false, [\"not approved\"]]"
  [[experiments.checks]]
  id = "P1-R7-C04"
  harness = "R7.same_decision"
  description = "the proposal is the same as R1's"
  kind = "invariant"
  fact = "obs.R7.same_decision"
  op = "=="
  ref = "exp.R7.same_decision"
  [[experiments.checks]]
  id = "P1-R7-C05"
  harness = "R7.same_agent"
  description = "same agent code (sha256) as R1: no application change"
  kind = "invariant"
  fact = "obs.R7.same_agent"
  op = "=="
  ref = "exp.R7.same_agent"
  [[experiments.checks]]
  id = "P1-R7-C06"
  harness = "R7.same_bundle"
  description = "same control-plane bundle as R1: the outage changed routing, not configuration"
  kind = "invariant"
  fact = "obs.R7.same_bundle"
  op = "=="
  ref = "exp.R7.same_bundle"
  [[experiments.checks]]
  id = "P1-R7-C07"
  harness = "R7.completed"
  description = "the governed workflow completed; production changed once"
  kind = "invariant"
  fact = "obs.R7.completed"
  op = "=="
  value = "COMPLETED · 1"
  [[experiments.checks]]
  id = "P1-R7-C08"
  harness = "R7.fail_closed"
  description = "both eligible models down: refused with NO_ELIGIBLE_MODEL, no silent downgrade, no action"
  kind = "invariant"
  fact = "obs.R7.fail_closed"
  op = "=="
  value = "FAILED_CLOSED · NO_ELIGIBLE_MODEL · 0"

[[experiments]]
id = "P1-R8"
harness = "R8"
title = "Context isolation"
question = "Can data the requester may not see reach the model?"
claim = "Context is filtered before inference: tenant, classification, ACL, environment and lifecycle predicates run inside retrieval."
hypothesis = "Only this tenant's permitted production items are selected; the other tenant's runbook, the restricted note, the staging runbook and the expired memory are excluded with their reasons; unsafe memory writes are refused; no canary reaches any prompt."
setup = "Knowledge and memory seeded with another tenant's confidential runbook, a restricted note, a staging runbook and an expired memory; retrieval for sre.alice."
variable = "the predicates applied before ranking; the control ranks by relevance only"
invariant = "No item outside the requester's tenant, clearance, ACL, environment and lifecycle enters model context."
limitations = ["A keyword retriever over SQLite, not a vector database."]
tests = ["tests/test_units.py"]
  [[experiments.checks]]
  id = "P1-R8-C01"
  harness = "R8.selected"
  description = "only this tenant's production items the requester's groups and clearance allow"
  kind = "invariant"
  fact = "obs.R8.selected"
  op = "=="
  value = "MEM-INC-4630 · RB-CHK-007"
  [[experiments.checks]]
  id = "P1-R8-C02"
  harness = "R8.tenant"
