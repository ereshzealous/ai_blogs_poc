    source: { type: incident, id: INC-4411 }
    provenance: { created_by: incident-summary-agent, evidence_refs: [PM-4411] }
    scope: { tenant: acme, environment: production, entities: [checkout-api] }
    created_at: "2026-05-03T09:00:00Z"
    expires_at: "2027-05-03T00:00:00Z"
    trust: { source_class: platform-verified }
    claim_type: incident_history

  - id: ep-inc-4502
    memory_type: episode
    content: >-
      INC-4502: payment-gateway timeouts were resolved by failing over to the secondary provider.
    source: { type: incident, id: INC-4502 }
    provenance: { created_by: incident-summary-agent, evidence_refs: [PM-4502] }
    scope: { tenant: acme, environment: production, entities: [payment-gateway] }
    created_at: "2026-06-02T09:00:00Z"
    expires_at: "2026-12-02T00:00:00Z"
    trust: { source_class: platform-verified }
    claim_type: incident_history

  - id: ep-inc-4380
    memory_type: episode
    content: >-
      INC-4380: search-api latency after a cache flush recovered on its own once the cache warmed up.
    source: { type: incident, id: INC-4380 }
    provenance: { created_by: incident-summary-agent, evidence_refs: [PM-4380] }
    scope: { tenant: acme, environment: production, entities: [search-api] }
    created_at: "2026-04-11T09:00:00Z"
    expires_at: "2026-10-11T00:00:00Z"
    trust: { source_class: platform-verified }
    claim_type: incident_history

  - id: ep-pref-alice
    memory_type: episode
    content: >-
      Alice prefers incident summaries as three short bullets with the decision first.
    source: { type: user_preference, id: alice }
    provenance: { created_by: preference-extractor, evidence_refs: [ses-s1-older] }
    scope: { tenant: acme, environment: all, entities: ["*"], user: alice }
    created_at: "2026-08-02T09:00:00Z"
    expires_at: "2027-08-02T00:00:00Z"
    trust: { source_class: platform-verified }
    claim_type: preference

