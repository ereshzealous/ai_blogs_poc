[project]
name = "t4-control-plane-poc"
version = "1.0.0"
description = "T4 POC: one centrally versioned control plane governs three agents running in a long-lived runtime process. Change the control plane, not the agent, and the governed behaviour changes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
acp = "acp.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rA -p no:cacheprovider"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]
