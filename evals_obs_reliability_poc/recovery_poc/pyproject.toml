[project]
name = "recovery-poc"
version = "1.0.0"
description = "R1+R2 · Evals, Observability & Production Reliability: failure classification, execution certainty and recovery evals for a production agent"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
recovery = "recovery.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
