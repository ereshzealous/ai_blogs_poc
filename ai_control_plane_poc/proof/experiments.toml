[[experiments]]
id = "T4-R9"
role = "boundary"
title = "P9 · When the control plane is unreachable"
question = "What does the runtime do without its control plane: for reads, mutations, stale policy, tampered bundles?"
claim = "Without its control plane the runtime serves reads from last-known-good within a staleness bound, fails mutations closed, never applies a tampered bundle and makes no call without a credential."
hypothesis = "Mutation denied CONTROL_PLANE_UNREACHABLE; everything denied past the bound; tampered bundle rejected; broker down denies calls."
setup = "Three scenarios: partition a runtime and publish a suspension it cannot see (P9a); alter a bundle in transit (P9b); stop the credential broker (P9c)."
variable = "The injected failure."
invariant = "No mutation without a fresh, verified policy and a credential."
limitations = ["A suspension cannot reach a partitioned runtime: exposure is bounded by the staleness bound and fail-closed mutations, not removed."]
  [[experiments.checks]]
  id = "T4-R9-C01"
  description = "Every P9a scenario assertion held"
  kind = "invariant"
  fact = "p9.outage.assertions_passed"
  op = "=="
  ref = "p9.outage.assertions_total"
  [[experiments.checks]]
  id = "T4-R9-C02"
  description = "A mutation during the outage fails closed"
  kind = "invariant"
  fact = "p9.outage.mutation_during_outage"
  op = "=="
  value = "CONTROL_PLANE_UNREACHABLE"
  [[experiments.checks]]
  id = "T4-R9-C03"
  description = "Past the staleness bound everything is denied"
  kind = "invariant"
  fact = "p9.outage.stale_run"
  op = "=="
  value = "POLICY_STALE"
  [[experiments.checks]]
  id = "T4-R9-C04"
  description = "Once the partition heals, the suspension applies"
  kind = "invariant"
  fact = "p9.outage.recovered_run"
  op = "=="
  value = "AGENT_SUSPENDED"
  [[experiments.checks]]
  id = "T4-R9-C05"
  description = "The tampered bundle was rejected; the runtime stayed on v1"
  kind = "invariant"
  fact = "p9.tamper.applied_version"
  op = "=="
  value = "v1"
  [[experiments.checks]]
  id = "T4-R9-C06"
  description = "Every P9b and P9c scenario assertion held"
  kind = "invariant"
  fact = "p9.tamper.assertions_passed"
  op = "=="
  ref = "p9.tamper.assertions_total"
  [[experiments.checks]]
  id = "T4-R9-C07"
  description = "With the broker down, calls policy would allow were denied"
  kind = "invariant"
  fact = "p9.broker.tool_calls_denied"
  op = ">"
  value = 0
  [[experiments.checks]]
  id = "T4-R9-C08"
  description = "Ideal kill switch: no call executes after a suspension is published"
  kind = "measurement"
  finding = "LIMITATION OBSERVED"
  fact = "p9.outage.calls_executed_after_suspension_published"
  op = "=="
  value = 0

