    procedure_key: search-api/relevance-after-index-build
    action: rollback_index_alias
    approval: search-oncall
    acl: [eng-all]
    updated_at: "2026-06-01T09:30:00Z"
    sections:
      - heading: Recovery
        text: >-
          Point the products alias back to the previous index build with the search-admin pipeline (search-admin alias
          products --to <previous-build>). The previous build id is in the index build record.
      - heading: Approval
        text: >-
          The search on-call approves the alias rollback. Keep the bad build for 48 hours for analysis.

