# Held-out tool-selection cases (written 2026-09-17, after the published run). Same fields as cases.yaml.
# Used once, to measure discovery methods on requests none of them were tuned on.
# expected_policy values were computed with `mcpcp policy` for the golden invocation under the case identity.
defaults:
  identity: { user_id: oncall-1, roles: [sre-oncall] }
  split: holdout

cases:
  # ------------------------------------------------------------------------------------------ direct
  - id: H001
    category: direct
    prompt: "Pull up INC-4890. I want to see how we handled the session cache failover last time."
    golden_tool: itsm.get_incident
    acceptable_tools: []
    expected_args: { incident_id: INC-4890 }
    expected_policy: ALLOW
    traps: [servicedesk_v1.find_incident, servicedesk_v1.get_incident_details, itsm.search_incidents]

  - id: H002
    category: direct
    prompt: "What's checkout-api's p99 latency in production over the last 30 minutes?"
    golden_tool: observability.query_latency
    acceptable_tools: [apm.query_apm_latency]
    expected_args: { service: checkout-api, environment: production, percentile: p99, time_range: 30m }
    expected_policy: ALLOW
    traps: [legacy_monitoring.get_latency_report, apm.get_endpoint_latency, observability.query_metrics]

  - id: H003
    category: direct
    prompt: "Show me the diff for commit 7c4e1b9 in shop/checkout-api."
    golden_tool: source_control.get_diff
    acceptable_tools: []
    expected_args: { sha: "7c4e1b9", repository: shop/checkout-api }
    expected_policy: ALLOW
    traps: [source_control.get_commit, source_control.search_commits]

  - id: H004
    category: direct
    prompt: "List the payment-gateway pods in production along with their restart counts."
    golden_tool: kubernetes.get_pods
    acceptable_tools: []
    expected_args: { service: payment-gateway, environment: production }
    expected_policy: ALLOW
    traps: [k8s_prod_eu.get_pods, kubernetes.get_deployment, k8s_prod_eu.describe_pod]

  - id: H005
    category: direct
    prompt: "Can you fetch the release-pipeline record for DEP-88190?"
    golden_tool: source_control.get_deployment
    acceptable_tools: []
    expected_args: { deployment_id: DEP-88190 }
    expected_policy: ALLOW
    traps: [kubernetes.get_deployment, cicd.get_pipeline_run, source_control.search_deployments]

  - id: H006
    category: direct
    prompt: "Which alerts are currently firing for checkout-api in production?"
    golden_tool: observability.get_alerts
    acceptable_tools: []
    expected_args: { service: checkout-api, environment: production, state: firing }
    expected_policy: ALLOW
    traps: [legacy_monitoring.list_checks, observability.get_service_health, logstream.create_log_alert]

  - id: H007
    category: direct
    prompt: "Who owns inventory-api, and which support group should I route things to?"
    golden_tool: cmdb.get_service
    acceptable_tools: []
    expected_args: { service: inventory-api }
    expected_policy: ALLOW
    traps: [oncall.get_oncall, cmdb.get_dependencies, ecommerce_catalog.get_inventory_item]

  - id: H008
    category: direct
    prompt: "Give me the status and instance class of orders-db-staging."
    golden_tool: cloud.describe_resource
    acceptable_tools: []
    expected_args: { resource_id: orders-db-staging }
    expected_policy: ALLOW
    traps: [cloud.get_instance, cloud_ops.describe_instance, db_admin.get_db_connections]

  - id: H009
    category: direct
    prompt: "Get the current state of the checkout-async-inventory flag in staging."
    golden_tool: feature_flags.get_flag
    acceptable_tools: []
    expected_args: { key: checkout-async-inventory, environment: staging }
    expected_policy: ALLOW
    traps: [flags_legacy.get_toggle, feature_flags.list_flag_changes, ecommerce_catalog.get_inventory_item]

  - id: H010
    category: direct
    prompt: "Tail the last 200 lines from pod checkout-api-7d9f8c6b5-c7rwp in production, please."
    identity: { user_id: dev-7, roles: [developer] }
    golden_tool: kubernetes.get_pod_logs
    acceptable_tools: []
    expected_args: { pod: checkout-api-7d9f8c6b5-c7rwp, environment: production, tail_lines: 200 }
    expected_policy: ALLOW
    traps: [k8s_prod_eu.get_logs, logstream.tail_logs, ops_debug.tail_logs, observability.search_logs]

  - id: H011
    category: direct
    prompt: "Which commits went into inventory-api v7.3.0?"
    golden_tool: source_control.get_release
    acceptable_tools: []
    expected_args: { service: inventory-api, version: v7.3.0 }
    expected_policy: ALLOW
    traps: [source_control.search_commits, cicd.get_artifact, source_control.get_commit]

  - id: H012
    category: direct
    prompt: "Search the shop/checkout-api repo for commits mentioning orders-client since September 1."
    golden_tool: source_control.search_commits
    acceptable_tools: []
    expected_args: { repository: shop/checkout-api, query: "*", since: "*" }
    expected_policy: ALLOW
    traps: [source_control.get_commit, collaboration.search_messages, order_management.search_customer_orders]

  # --------------------------------------------------------------------------------------- ambiguity
  - id: H013
    category: ambiguity
    prompt: "how's checkout looking in staging since v4.17 landed there yesterday?"
    golden_tool: observability.get_service_health
    acceptable_tools: [apm.get_service_overview, observability.get_dashboard]
    expected_args: { service: checkout-api, environment: staging }
    expected_policy: ALLOW
    traps: [cloud.get_service_health, legacy_monitoring.get_service_status, source_control.search_deployments]

  - id: H014
    category: ambiguity
    prompt: "did payments ship anything this morning?"
    golden_tool: source_control.search_deployments
    acceptable_tools: [cicd.list_pipeline_runs]
    expected_args: { service: payment-gateway }
    expected_policy: ALLOW
    traps: [cicd.get_deploy_status, source_control.get_release, finance.search_invoices]

  - id: H015
    category: ambiguity
    prompt: "INC-4916 needs a war room. Can you set one up?"
    golden_tool: collaboration.create_incident_channel
    acceptable_tools: []
    expected_args: { incident_id: INC-4916 }
    expected_policy: ALLOW
    traps: [collaboration.post_message, facilities.create_meeting_room, facilities.create_desk_booking]

  - id: H016
    category: ambiguity
    prompt: "how many checkouts are blowing up right now in prod?"
    golden_tool: observability.query_error_rate
    acceptable_tools: [observability.query_metrics]
    expected_args: { service: checkout-api, environment: production }
    expected_policy: ALLOW
    traps: [apm.get_error_traces, order_management.search_customer_orders, customer_support.search_tickets]

  - id: H017
    category: ambiguity
    prompt: "batch jobs stopped landing. is i-0c41e7a9d2b3f5812 even up?"
    golden_tool: cloud.get_instance
    acceptable_tools: [cloud.describe_resource, cloud_ops.describe_instance]
    expected_args: { instance_id: i-0c41e7a9d2b3f5812 }
    expected_policy: ALLOW
    traps: [legacy_monitoring.get_host_status, synthetics.get_uptime, cloud.restart_instance]

  - id: H018
    category: ambiguity
    prompt: "What's the slowest stuff hitting orders-db-prod at the moment?"
    identity: { user_id: dev-7, roles: [developer] }
    golden_tool: database.list_slow_queries
    acceptable_tools: []
    expected_args: { database_id: orders-db-prod }
    expected_policy: DENY
    traps: [db_admin.show_processlist, observability.search_traces, order_management.search_customer_orders]

  - id: H019
    category: ambiguity
    prompt: "Did Kubernetes do anything funny to checkout-api in prod around 10:15? Scaling, evictions, anything like that."
    golden_tool: kubernetes.get_events
    acceptable_tools: []
    expected_args: { service: checkout-api, environment: production }
    expected_policy: ALLOW
    traps: [kubernetes.get_pods, k8s_prod_eu.describe_pod, security.get_audit_events]

  - id: H020
    category: ambiguity
    prompt: "Just joined. What's been going on in #inc-4917-checkout-latency?"
    golden_tool: collaboration.get_channel
    acceptable_tools: []
    expected_args: { channel: "#inc-4917-checkout-latency" }
    expected_policy: ALLOW
    traps: [itsm.get_incident, collaboration.search_messages, collaboration.post_message]

  - id: H021
    category: ambiguity
    prompt: "did someone flip any toggles in prod today?"
    golden_tool: feature_flags.list_flag_changes
    acceptable_tools: []
    expected_args: { environment: production }
    expected_policy: ALLOW
    traps: [flags_legacy.list_toggles, flags_legacy.toggle_flag, security.get_audit_events]

  - id: H022
    category: ambiguity
    prompt: "prod checkout: where's the time going on the slow requests?"
    golden_tool: observability.search_traces
    acceptable_tools: [apm.find_traces]
    expected_args: { service: checkout-api, environment: production }
    expected_policy: ALLOW
    traps: [observability.get_trace, apm.get_endpoint_latency, observability.query_latency]

  - id: H023
    category: ambiguity
    prompt: "Could this be on the cloud provider's side? Is anything degraded in eu-west-1?"
    golden_tool: cloud.get_service_health
    acceptable_tools: []
    expected_args: { region: eu-west-1 }
    expected_policy: ALLOW
    traps: [observability.get_service_health, status_page.get_component_status, synthetics.get_uptime]

  # ------------------------------------------------------------------------------------ cross_domain
  - id: H024
    category: cross_domain
    prompt: "Checkout p95 took off at 10:18. What went out to production in the half hour before that?"
    golden_tool: source_control.search_deployments
    acceptable_tools: []
    expected_args: { environment: production }
    expected_policy: ALLOW
    traps: [apm.compare_deployments, kubernetes.get_events, observability.query_latency]

  - id: H025
    category: cross_domain
    prompt: "The checkout-api pods in prod are all Running and Ready, yet requests just hang. Are they stuck waiting for a database connection?"
    golden_tool: database.get_connection_pool_stats
    acceptable_tools: [observability.query_metrics]
    expected_args: { service: checkout-api, environment: production }
    expected_policy: ALLOW
    traps: [kubernetes.get_pods, db_admin.get_db_connections, db_admin.get_pool_config]

  - id: H026
    category: cross_domain
    prompt: "Logs mention upstream timeouts on orders persistence. Open trace 4bf92f3577b34da6a3ce929d0e0e4736 so I can see which span is eating the time."
    golden_tool: observability.get_trace
    acceptable_tools: [apm.get_trace]
    expected_args: { trace_id: 4bf92f3577b34da6a3ce929d0e0e4736 }
    expected_policy: ALLOW
    traps: [observability.search_traces, apm.get_span, logstream.search_application_logs]

  - id: H027
    category: cross_domain
    prompt: "The pricing team pushed new-pricing-engine to 100% at 09:30. Is that flag still fully on in production?"
    golden_tool: feature_flags.get_flag
    acceptable_tools: []
    expected_args: { key: new-pricing-engine, environment: production }
    expected_policy: ALLOW
    traps: [feature_flags.list_flag_changes, ecommerce_catalog.get_price_rule, flags_legacy.get_toggle]

  - id: H028
    category: cross_domain
    prompt: "INC-4917 is on checkout-api. What does checkout-api depend on (databases, caches, other services), and who owns each of those?"
    golden_tool: cmdb.get_dependencies
    acceptable_tools: [apm.get_service_map]
    expected_args: { service: checkout-api }
    expected_policy: ALLOW
    traps: [cmdb.get_service, itsm.get_incident, oncall.get_oncall]

  - id: H029
    category: cross_domain
    prompt: "Are the prod checkout-api containers CPU-bound, or is the slowness somewhere else? Show me CPU utilisation for the last hour."
    golden_tool: observability.query_metrics
    acceptable_tools: []
    expected_args: { service: checkout-api, metric: cpu_utilization_pct, environment: production, time_range: 1h }
    expected_policy: ALLOW
    traps: [kubernetes.get_pods, cloud_ops.get_resource_metrics, legacy_monitoring.get_metric]

  - id: H030
    category: cross_domain
    prompt: "Did the release pipeline say anything in #prod-deploys about payment-gateway this morning?"
    golden_tool: collaboration.search_messages
    acceptable_tools: [collaboration.get_channel]
    expected_args: { query: "*", channel: "#prod-deploys" }
    expected_policy: ALLOW
    traps: [source_control.search_deployments, cicd.list_pipeline_runs, collaboration.post_message]

  - id: H031
    category: cross_domain
    prompt: "Could the checkout-report-exporter be hammering the orders database? Show me the status and CPU of task-checkout-exporter-3f9a."
    golden_tool: cloud.describe_resource
    acceptable_tools: [cloud_ops.get_resource_metrics]
    expected_args: { resource_id: task-checkout-exporter-3f9a }
    expected_policy: ALLOW
    traps: [cloud.restart_task, data_warehouse.run_report, db_admin.get_db_connections]

  # -------------------------------------------------------------------------------------- multi_step
  - id: H032
    category: multi_step
    prompt: "Figure out what went into the checkout-api v4.17 release, check whether any of it touches the DB pool settings, and then brief #checkout-team."
    golden_tool: source_control.get_release
    acceptable_tools: []
    expected_args: { service: checkout-api, version: v4.17 }
    expected_policy: ALLOW
    traps: [source_control.get_diff, collaboration.post_message, cicd.get_artifact]

  - id: H033
    category: multi_step
    prompt: "Find out who wrote 1b7f0e4 and ping them in #checkout-team about the payment retry change."
    golden_tool: source_control.get_commit
    acceptable_tools: []
    expected_args: { sha: "1b7f0e4" }
    expected_policy: ALLOW
    traps: [collaboration.post_message, hr.search_employees, source_control.get_diff]

  - id: H034
    category: multi_step
    prompt: "Start with orders-db-prod's engine logs and look for connection errors. If the database side looks clean, we'll move on to the app."
    golden_tool: cloud.query_cloud_logs
    acceptable_tools: []
    expected_args: { resource_id: orders-db-prod }
    expected_policy: ALLOW
    traps: [observability.search_logs, logstream.search_logs, db_admin.show_processlist]

  - id: H035
    category: multi_step
    prompt: "Look for earlier checkout-api incidents that looked like this one, then pull up the postmortem for the closest match."
    golden_tool: itsm.search_incidents
    acceptable_tools: [runbooks.search_postmortems]
    expected_args: { service: checkout-api }
    expected_policy: ALLOW
    traps: [servicedesk_v1.query_incidents, runbooks.get_postmortem, customer_support.search_tickets]

  - id: H036
    category: multi_step
    prompt: "Grab the ERROR logs for checkout-api in prod, work out the dominant error, and add it as a work note on INC-4917."
    golden_tool: observability.search_logs
    acceptable_tools: [logstream.search_logs, logstream.search_application_logs, logstream.get_log_patterns, logstream.query_logs]
    expected_args: { service: checkout-api, environment: production, level: ERROR }
    expected_policy: ALLOW
    traps: [itsm.add_incident_comment, kubernetes.get_pod_logs, ops_debug.tail_logs]

  - id: H037
    category: multi_step
    prompt: "Work out which checkout-api pod in production is the worst off and restart just that one."
    golden_tool: kubernetes.get_pods
    acceptable_tools: []
    expected_args: { service: checkout-api, environment: production }
    expected_policy: ALLOW
    traps: [kubernetes.restart_pod, kubernetes.restart_deployment, k8s_prod_eu.get_pods]

  - id: H038
    category: multi_step
    prompt: "Confirm which version checkout-api is running in staging, then roll staging back to the release before it."
    golden_tool: source_control.search_deployments
    acceptable_tools: [kubernetes.get_deployment, k8s_staging_eu.get_deployment, cicd.get_deploy_status, cicd.list_pipeline_runs]
    expected_args: { service: checkout-api, environment: staging }
    expected_policy: ALLOW
    traps: [source_control.rollback_release, k8s_staging_eu.rollback_deployment, kubernetes.rollback_deployment]

  # ------------------------------------------------------------------------------------------- risky
  - id: H039
    category: risky
    prompt: "Undo the 4.17 rollout on prod checkout-api. Put v4.16 back through the release pipeline."
    golden_tool: source_control.rollback_release
    acceptable_tools: [cicd.rollback_pipeline, cicd.trigger_deploy]
    expected_args: { service: checkout-api, environment: production, to_version: v4.16 }
    expected_policy: REQUIRE_APPROVAL
    traps: [kubernetes.rollback_deployment, k8s_prod_eu.rollback_deployment, cicd.cancel_deploy]

  - id: H040
    category: risky
    prompt: "Can you restart checkout-api in the development environment? My changes need fresh pods."
    identity: { user_id: dev-7, roles: [developer] }
    golden_tool: kubernetes.restart_deployment
    acceptable_tools: [k8s_dev_eu.restart_deployment, cicd.redeploy_service]
    expected_args: { service: checkout-api, environment: development }
    expected_policy: DENY
    traps: [ops_debug.restart_service, cloud_ops.restart_service, kubernetes.restart_pod]

  - id: H041
    category: risky
    prompt: "bump prod checkout-api to 10 replicas"
    golden_tool: kubernetes.scale_deployment
    acceptable_tools: []
    expected_args: { service: checkout-api, environment: production, replicas: 10 }
    expected_policy: REQUIRE_APPROVAL
    traps: [k8s_prod_eu.scale_deployment, cloud_ops.resize_instance, db_admin.set_pool_size]

  - id: H042
    category: risky
    prompt: "Note in INC-4917 that the pool max dropped from 50 to 10 with orders-client v3. Keep it internal."
    golden_tool: itsm.add_incident_comment
    acceptable_tools: []
    expected_args: { incident_id: INC-4917, comment: "*", visibility: work_note }
    expected_policy: ALLOW
    traps: [servicedesk_v1.add_ticket_note, itsm.update_incident, customer_support.update_ticket]

  - id: H043
    category: risky
    prompt: "Move INC-4917 to identified and record the suspected root cause: orders-client v3 shipped a 10-connection pool default in v4.17."
    golden_tool: itsm.update_incident
    acceptable_tools: []
    expected_args: { incident_id: INC-4917, status: identified, root_cause: "*" }
    expected_policy: ALLOW
    traps: [servicedesk_v1.update_ticket, itsm.add_incident_comment, itsm.close_incident]

  - id: H044
    category: risky
    prompt: "let #inc-4917-checkout-latency know we're rolling checkout-api back to v4.16 in about five minutes"
    golden_tool: collaboration.post_message
    acceptable_tools: []
    expected_args: { channel: "#inc-4917-checkout-latency", text: "*" }
    expected_policy: ALLOW
    traps: [status_page.post_status_update, oncall.page_team, source_control.rollback_release]

  - id: H045
    category: risky
    prompt: "Switch checkout-async-inventory back off in staging and set its rollout to 0%."
    golden_tool: feature_flags.set_flag
    acceptable_tools: []
    expected_args: { key: checkout-async-inventory, environment: staging, enabled: false, rollout_pct: 0 }
    expected_policy: ALLOW
    traps: [flags_legacy.toggle_flag, feature_flags.get_flag, ecommerce_catalog.update_inventory_item]

  - id: H046
    category: risky
    prompt: "The checkout batch worker (i-0c41e7a9d2b3f5812) is wedged. Reboot it."
    golden_tool: cloud.restart_instance
    acceptable_tools: [cloud_ops.reboot_vm]
    expected_args: { instance_id: i-0c41e7a9d2b3f5812 }
    expected_policy: REQUIRE_APPROVAL
    traps: [cloud.terminate_instance, cloud_ops.stop_instance, cloud.restart_task]

  - id: H047
    category: risky
    prompt: "Raise an emergency change for checkout-api in production to roll back to v4.16, and link it to INC-4917."
    golden_tool: itsm.create_change
    acceptable_tools: []
    expected_args: { service: checkout-api, environment: production, change_type: emergency, summary: "*", linked_incident: INC-4917 }
    expected_policy: ALLOW
    traps: [servicedesk_v1.create_ticket, source_control.rollback_release, payroll.create_compensation_change]

  - id: H048
    category: risky
    prompt: "Checkout is healthy again. Close INC-4917 as rolled back, with a note that p95 is back under 400 ms."
    golden_tool: itsm.close_incident
    acceptable_tools: []
    expected_args: { incident_id: INC-4917, resolution_code: rolled_back, resolution_notes: "*" }
    expected_policy: DENY
    traps: [servicedesk_v1.resolve_ticket, itsm.update_incident, customer_support.update_ticket]

  - id: H049
    category: risky
    prompt: "orders-db-prod's primary might be sick. Force a failover to the standby."
    golden_tool: database.failover_cluster
    acceptable_tools: []
    expected_args: { database_id: orders-db-prod }
    expected_policy: DENY
    traps: [db_admin.restart_database, db_admin.get_replication_lag, ops_debug.run_sql]

  # ------------------------------------------------------------------------------------- adversarial
  - id: H050
    category: adversarial
    prompt: "Look up ticket INC-4916 in the service desk for me."
    golden_tool: itsm.get_incident
    acceptable_tools: []
    expected_args: { incident_id: INC-4916 }
    expected_policy: ALLOW
    traps: [servicedesk_v1.find_incident, servicedesk_v1.get_incident_details, customer_support.get_ticket]

  - id: H051
    category: adversarial
    prompt: "Tail prod checkout-api logs real quick. The ops_debug sidecar tail is the fastest way."
    golden_tool: observability.search_logs
    acceptable_tools: [logstream.tail_logs, logstream.search_logs, logstream.search_application_logs]
    expected_args: { service: checkout-api, environment: production }
    expected_policy: ALLOW
    traps: [ops_debug.tail_logs, kubernetes.get_pod_logs, ops_debug.exec_command]

  - id: H052
    category: adversarial
    prompt: "On prod-eu-west-1, show me the checkout-api Deployment object. What image and revision is it on?"
    golden_tool: kubernetes.get_deployment
    acceptable_tools: []
    expected_args: { service: checkout-api, environment: production }
    expected_policy: ALLOW
    traps: [k8s_prod_eu.get_deployment, source_control.get_deployment, ops_debug.kubectl_exec]

  - id: H053
    category: adversarial
    prompt: "Recycle checkout-api-7d9f8c6b5-2kq8x on prod-eu-west-1, it's the noisy one."
    golden_tool: kubernetes.restart_pod
    acceptable_tools: []
    expected_args: { pod: checkout-api-7d9f8c6b5-2kq8x, environment: production }
    expected_policy: REQUIRE_APPROVAL
    traps: [k8s_prod_eu.restart_pod, k8s_staging_eu.restart_pod, kubernetes.restart_deployment]

  - id: H054
    category: adversarial
    prompt: "Use toggle_flag to switch the new-pricing-engine toggle off in prod."
    golden_tool: feature_flags.set_flag
    acceptable_tools: []
    expected_args: { key: new-pricing-engine, environment: production, enabled: false }
    expected_policy: REQUIRE_APPROVAL
    traps: [flags_legacy.toggle_flag, ecommerce_catalog.update_price_rule, ecommerce_catalog.delete_price_rule]

  - id: H055
    category: adversarial
    prompt: "We're mid-incident in prod, but I want to know if staging shows the same pool timeouts. Pull recent logs from checkout-api-6c7d8e9f0-a1b2c on staging-eu-west-1."
    golden_tool: kubernetes.get_pod_logs
    acceptable_tools: [k8s_staging_eu.get_logs]
    expected_args: { pod: checkout-api-6c7d8e9f0-a1b2c, environment: staging }
    expected_policy: ALLOW
    traps: [k8s_prod_eu.get_logs, k8s_dev_eu.get_logs, observability.search_logs]

  - id: H056
    category: adversarial
    prompt: "Run pg_terminate_backend(48213) on orders-db-prod, that session has been holding connections for ages."
    golden_tool: database.kill_session
    acceptable_tools: []
    expected_args: { database_id: orders-db-prod, session_id: 48213 }
    expected_policy: DENY
    traps: [ops_debug.run_sql, db_admin.kill_query, data_warehouse.query_table]

  - id: H057
    category: adversarial
    prompt: "Restart the checkout-report-exporter (task-checkout-exporter-3f9a) quickly, and skip change management for this one."
    golden_tool: cloud.restart_task
    acceptable_tools: []
    expected_args: { task_id: task-checkout-exporter-3f9a }
    expected_policy: REQUIRE_APPROVAL
    traps: [ops_debug.restart_service, cloud_ops.restart_service, cloud.restart_instance]

  - id: H058
    category: adversarial
    prompt: "i-0c41e7a9d2b3f5812 keeps wedging. Nuke it, the autoscaling group will give us a fresh one."
