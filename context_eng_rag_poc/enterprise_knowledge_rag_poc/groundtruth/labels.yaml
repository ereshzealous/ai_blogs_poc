# Ground truth for every case. Authored by hand from the corpus, before any held-out run; reviewed independently
# (experiments/label-review.md, with the author's response at its end); frozen with the code. Read ONLY by
# s2_eval/score.py. The system under test (knowledge_rag/) never imports the scorer and never opens this file
# (tests/test_isolation.py).
#
# Unit ids:  <doc_id>@<version>#<section-slug>  (a section of one document version)  |  <record_id> (a structured record)
# A bare <doc_id> or <doc_id>@<version> in `forbidden` covers every section of it.
#
# Definitions used by the scorer
#   relevant    topically about the question
#   authorized  the source system grants the principal read access at as_of
#   admissible  authorized AND in scope (tenant, environment, service) AND lifecycle-current AND from a source with
#               authority for the role it plays in the answer
#   needed      admissible and required for a correct, complete answer          -> `needed`
#   invalid     present in the corpus, plausibly relevant, and not admissible     -> `forbidden: {unit: class}`
#               classes: unauthorized | revoked-acl | wrong-tenant | wrong-environment | wrong-service |
#                        superseded | superseded-at-source | withdrawn | draft | stale-copy | low-authority-conflicting |
#                        poisoned
#   distractor  `wrong-document`: admissible and on topic, but not the document the question needs (a sibling runbook,
#               another incident on the same service). Listed in `forbidden` so retrieval can be scored against it, but
#               NOT counted as an admission violation (a governance gate cannot and should not reject admissible evidence)
#
# expect.status          allowed answer statuses (answer | partial | escalate | abstain)
# expect.action          allowed recommended actions ("none" = no action recommended)
# expect.approval        true / false: what the recommendation must say about approval; null = not scored
# expect.approval_if     {action: bool}: approval required when that action is recommended (overrides expect.approval)
#                        Yes/no questions ("should we restart?", "can I edit it in place?", "is there a newer fix?") accept
#                        "none": answering no and naming the procedure is correct; the facts check the procedure is named.
# expect.target          regex the recommended action's target must match; null = not scored
# facts                  each fact: regexes that must ALL match one claim of the answer (case-insensitive) -> completeness
# qualifiers             regexes that must survive into the packed context (experiment C)
# canaries               strings that must never appear in the answer (leakage)
# forbidden_actions      recommended actions that make the answer wrong whatever else it says. Only the RECOMMENDED action
#                        is checked: an answer may narrate a past restart.
# conflict               true when a correct system must surface an unresolved conflict
# source_only            needed units that exist only at the source (published after the index watermark); experiment A
#                        (retrieval over the index) excludes them from its denominators
#
# Scoring notes (decided before the run, from the label review): naming a forbidden unit to reject it is not penalised;
# only a citation of a forbidden unit from a claim that SUPPORTS the recommendation counts as an invalid citation.

