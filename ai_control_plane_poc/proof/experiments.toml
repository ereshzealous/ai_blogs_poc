[[experiments]]
id = "T4-R12"
role = "governor"
title = "P12 · Governing the control plane itself"
question = "Who may change the control plane, and is every change, accepted or rejected, on the record?"
claim = "Changes to the control plane are authorized by scope, need a second person to widen, may only restrict under break-glass, are validated, and are all on a tamper-evident local log under POC assumptions."
hypothesis = "An agent and an out-of-scope lead are rejected; an in-scope lead restricting its own agent is accepted; widening alone, self-approval, break-glass widening and a plaintext credential are rejected; the chain verifies and breaks when one row is edited."
setup = "Ten attempts by agents, team leads, the platform admin and on-call, against config/admins.yaml."
variable = "Who changes what, how."
invariant = "Every attempt is on the change log; only authorized, valid changes become signed versions."
limitations = ["Tamper-evident on one machine under the POC's assumptions; not an external immutable audit store. No MFA or real identity provider."]
