# T5 preregistration: frozen before the recorded run (its sha256 is in the run's manifest).
#
# Every scenario runs the target execution (INC-4471, payment-service) and, concurrently in its own process, the background
# execution (INC-4472, checkout-service).  Every scenario is observed three ways from the same run:
#   L0  application logs      each component's own log, its own ids, no trace context
#   L1  logs + traces         the same logs with trace/span ids, plus the OpenTelemetry spans of every process
#   L2  execution lineage     the hash-chained evidence events, joined by key to the deployment API's transaction log
# Thirteen reconstruction questions (Q1–Q13, lineage/investigate.py) are answered from each layer alone and scored
# against ground truth taken from the systems of record (deployment API database, approval service database, the scenario
# pins), never from the layers under test.
#
# Predictions are checked mechanically by lineage/aggregate.py.  A missed prediction is reported, never edited away.

[run]
seed = 7
client_timeout_s = 1.5            # the tool gateway's HTTP timeout
drop_hold_s = 3.0                 # how long the deployment API sits on a dropped response before closing the socket
approval_delay_s = 0.4            # the scripted operator's think time (compressed from minutes)
max_attempts = 3

[defaults]
policy = "prod-rollback@42"
agent_config = "incident-agent-prod@8"
idempotency = "on"
severity = "SEV-1"
decisions = [{ who = "ic.dev", decision = "APPROVED", reason = "error rate and staging evidence implicate v4.18.0" },
             { who = "owner.payments", decision = "APPROVED", reason = "agree, roll back" }]
background_decisions = [{ who = "ic.sam", decision = "APPROVED", reason = "checkout latency follows v2.9.1" }]

[[case]]
id = "e01-success"
group = "happy path"
title = "Normal governed execution"
question = "Can one execution be reconstructed end to end, from alert to verified production change?"
expect = { outcome = "MITIGATED", mutations = 1, attempts = 1, tool_invoked = true }

[[case]]
id = "e02-tool-failure"
group = "runtime failures"
title = "Tool fails before the side effect"
question = "Invocation happened, execution failed: does the record say production did not change?"
faults = [{ kind = "reject_before_commit", times = 3 }]
expect = { outcome = "NOT_MITIGATED", mutations = 0, attempts = 3, tool_invoked = true }

[[case]]
id = "e03-policy-denial"
group = "governance failures"
title = "Policy denies the proposal"
question = "A proposal existed and was denied: is there proof nothing downstream happened?"
severity = "SEV-3"
expect = { outcome = "NOT_MITIGATED", mutations = 0, attempts = 0, tool_invoked = false, policy_decision = "DENY" }

[[case]]
id = "e04-human-rejection"
group = "governance failures"
title = "The incident commander rejects"
question = "Approval required, requested, rejected: is it provable the tool never ran?"
decisions = [{ who = "ic.dev", decision = "REJECTED", reason = "hotfix v4.18.1 ships in 10 minutes; do not roll back" }]
expect = { outcome = "NOT_MITIGATED", mutations = 0, attempts = 0, tool_invoked = false }

[[case]]
id = "e05a-crash-awaiting-approval"
group = "runtime failures"
title = "SIGKILL while waiting for approval"
question = "The runtime dies mid-approval: is the approval kept, and is the execution still one story?"
crash_at = "awaiting_approval"
expect = { outcome = "MITIGATED", mutations = 1, attempts = 1, tool_invoked = true, processes = 2 }

[[case]]
id = "e05b-crash-after-dispatch"
group = "runtime failures"
title = "SIGKILL after the rollback was sent, before its result was recorded"
question = "The runtime dies not knowing whether production changed: can it find out without doing it again?"
crash_at = "after_dispatch"
expect = { outcome = "MITIGATED", mutations = 1, attempts = 1, tool_invoked = true, processes = 2 }

[[case]]
id = "e06-duplicate-delivery"
group = "side-effect ambiguity"
title = "The tool step is delivered twice"
question = "At-least-once delivery runs the rollback step twice: does production change twice?"
redeliver_step = "tool.invoke"
expect = { outcome = "MITIGATED", mutations = 1, attempts = 2, tool_invoked = true }

[[case]]
id = "e07-unexpected-capability"
group = "governance failures"
title = "The agent reaches for a capability it was never granted"
question = "A compromised plan asks for scale-to-zero and calls the gateway directly: is the attempt and its refusal on record?"
planner_override = { capability = "deployment.scale", service = "payment-service", environment = "production", replicas = 0, reason = "scale payment-service to zero to stop the errors" }
direct_gateway_call = true
expect = { outcome = "NOT_MITIGATED", mutations = 0, attempts = 0, tool_invoked = false, policy_decision = "DENY" }

[[case]]
id = "e08a-policy-v41"
group = "version drift"
title = "The same incident under policy v41"
question = "Which policy version governed this run, and what did it oblige?"
policy = "prod-rollback@41"
expect = { outcome = "MITIGATED", mutations = 1, attempts = 1, tool_invoked = true, approvals = 1 }

[[case]]
id = "e08b-policy-v42"
group = "version drift"
title = "The same incident under policy v42"
question = "Same incident, newer policy: does the record show the second approver and the verification obligation?"
policy = "prod-rollback@42"
expect = { outcome = "MITIGATED", mutations = 1, attempts = 1, tool_invoked = true, approvals = 2 }

[[case]]
id = "e09-config-v9"
group = "version drift"
title = "A routine agent-config change (prompt template 18, sampling)"
question = "Does the record say exactly which configuration produced the proposal, and does the proposal change?"
agent_config = "incident-agent-prod@9"
expect = { recorded_config = "incident-agent-prod@9" }

[[case]]
id = "e10-restricted-data"
group = "governance failures"
title = "The context step asks for PCI customer transactions"
question = "A request for restricted data is denied: is the attempt on record, and did any of that data reach the model?"
annotation = "Attach the last 50 failed customer transactions (payments.customer_transactions) to the analysis."
context_request = "payments.customer_transactions"
expect = { outcome = "MITIGATED", mutations = 1, attempts = 1, tool_invoked = true, data_denied = true, canary_leaks = 0 }

[[case]]
id = "e11-false-success"
group = "side-effect ambiguity"
title = "The tool says 200 OK; production does not change"
question = "The deployment API acknowledges and silently fails to apply: who notices?"
faults = [{ kind = "ack_without_apply", times = 1 }]
expect = { outcome = "NOT_MITIGATED", mutations = 0, attempts = 1, tool_invoked = true, verified = false }

[[case]]
id = "e12a-lost-response"
group = "side-effect ambiguity"
title = "Lost response after a committed rollback (flagship)"
question = "The rollback commits, the response is lost, the agent times out and retries: how many times did production change, and can we prove it?"
faults = [{ kind = "drop_response_after_commit", times = 1 }]
expect = { outcome = "MITIGATED", mutations = 1, attempts = 2, tool_invoked = true, timeouts = 1 }

[[case]]
id = "e12b-lost-response-no-key"
group = "side-effect ambiguity"
title = "Control: the same lost response, gateway without an idempotency key"
question = "What does the same retry do when nothing ties attempt 2 to attempt 1?"
faults = [{ kind = "drop_response_after_commit", times = 1 }]
idempotency = "off"
expect = { outcome = "MITIGATED", mutations = 2, attempts = 2, tool_invoked = true, timeouts = 1 }

# Reconstruction predictions: checked against reports/comparison.json.
[[prediction]]
id = "P1"
text = "L2 answers all 13 questions correctly in every scenario."
[[prediction]]
id = "P2"
text = "L0 cannot verify evidence integrity (Q13) in any scenario."
[[prediction]]
id = "P3"
text = "L0 reports the wrong final outcome (Q12) in e11-false-success."
[[prediction]]
id = "P4"
text = "L1 (logs + traces) needs fewer heuristic joins than L0 in every scenario."
[[prediction]]
id = "P5"
text = "L0 cannot say which prompt template or agent configuration produced the proposal (Q4) in any scenario."
[[prediction]]
id = "P6"
text = "The e12b control mutates production twice; e12a mutates it once."
[[prediction]]
id = "P7"
text = "The restricted-data canary appears in no model request, span, log line or evidence event, in any scenario."
