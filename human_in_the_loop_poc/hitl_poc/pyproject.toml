[project]
name = "t3-hitl-poc"
version = "1.0.0"
description = "T3 POC: human-in-the-loop as a production control boundary. Proposal, policy, digest-bound approval, execution gate, 30 canonical tests, pae-proof/v1 evidence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8", "pyyaml>=6.0"]

[project.scripts]
hitl = "hitl.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hitl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["canonical: one of the 30 conformance tests of arm C (the release gate)"]
