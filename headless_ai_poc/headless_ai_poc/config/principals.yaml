# Simulated identities. In production these come from an identity provider (humans) and a workload-identity system
# (services, agents). Here they are a file, so every experiment is reproducible.
#
#   kind      human | workload | agent
#   roles     used by approval rules (who may approve what)
#   scopes    the most this principal can ever hold; a token carries a subset
#   delegable scopes this principal may pass to an execution it starts (invocation authority, not action authority)
principals:
  # humans
  sre.maya:  {kind: human, roles: [responder], scopes: [incident:investigate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post],
              delegable: [incident:investigate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post]}
  ic.dev:    {kind: human, roles: [responder, incident-commander], scopes: [incident:investigate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post, deploy:rollback],
              delegable: [incident:investigate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post]}
  pm.lee:    {kind: human, roles: [viewer], scopes: [incident:read], delegable: []}

  # workloads that invoke the runtime (heads without a human)
  svc.monitoring-webhook: {kind: workload, roles: [], scopes: [incident:investigate], delegable: [incident:investigate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post]}
  svc.workflow-engine:    {kind: workload, roles: [], scopes: [incident:investigate], delegable: [incident:investigate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post]}
  svc.scheduler:          {kind: workload, roles: [], scopes: [health:sweep], delegable: [telemetry:read, deploy:read, itsm:read]}
  svc.ci-pipeline:        {kind: workload, roles: [], scopes: [release:check], delegable: [telemetry:read, deploy:read, itsm:read]}
  svc.status-api-client:  {kind: workload, roles: [], scopes: [incident:investigate], delegable: [incident:investigate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post]}
  svc.web-portal:         {kind: workload, roles: [], scopes: [incident:investigate], delegable: [incident:investigate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post]}

  # agents (a workload identity of their own; never a human's credentials)
  agent.incident-intel:   {kind: agent, version: "1.3.0", roles: [], scopes: [telemetry:read, deploy:read, itsm:read, itsm:write, chat:post], delegable: []}
  agent.release-guard:    {kind: agent, version: "0.9.2", roles: [], scopes: [release:check], delegable: [telemetry:read, deploy:read, itsm:read]}

  # used only by baseline B (layered, chat-only entry): the bot user an alert bridge posts as
  bot.alerts:             {kind: workload, roles: [], scopes: [incident:investigate], delegable: [incident:investigate, telemetry:read, deploy:read, itsm:read, itsm:write, chat:post]}

  # the runtime itself: the workload every execution runs as
  svc.hai-runtime:        {kind: workload, roles: [], scopes: [], delegable: []}

# Channel credentials (what a head presents at ingress). Static only because this is a simulation: a real deployment
# uses short-lived tokens from the identity provider, never shared secrets in a file.
credentials:
  tok-slack-maya:      {principal: sre.maya, channel: chat}
  tok-slack-dev:       {principal: ic.dev, channel: chat}
  tok-slack-lee:       {principal: pm.lee, channel: chat}
  tok-monitoring:      {principal: svc.monitoring-webhook, channel: event}
  tok-workflow:        {principal: svc.workflow-engine, channel: workflow}
  tok-scheduler:       {principal: svc.scheduler, channel: scheduler}
  tok-ci:              {principal: svc.ci-pipeline, channel: cicd}
  tok-web:             {principal: svc.web-portal, channel: web}
  tok-api-client:      {principal: svc.status-api-client, channel: api}
  tok-release-guard:   {principal: agent.release-guard, channel: agent}
  tok-slack-alertbot:  {principal: bot.alerts, channel: chat}

token_ttl_s: 900          # execution tokens are short-lived; an approval pause outlives them and must re-exchange
