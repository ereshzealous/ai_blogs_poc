# F2's Lab Console: the words and the layout.  Every number is a {{fact}} registered by tools/build_lab_console.py from
# the run directories; the kit refuses a hand-typed number.  No architecture diagrams: this page is the POC's output,
# run by run: use case, input, output, steps, data lineage, and whether each run succeeded, failed or errored.

case_tabs = [{ id = "io", label = "Input & output" }, { id = "steps", label = "Steps" }, { id = "lineage", label = "Data lineage" }, { id = "logs", label = "Logs" }]

[kit]
version = "4"

[lint]
allow = ['\bF[12]\b', '\bE\d\b', '\bINC-\d+\b', '\brel-\d+\b', '\b\d{4}-\d{2}-\d{2}\b', '\bSIGKILL\b', '\bHTTP \d{3}\b', '(?m)^\d\. ', '\bs\d+\b']

[learning]
series = "Production AI Engineering"
id = "F2"
topic = "Layered agent platform"
label = "F2 · Lab Console · run {{run.id}}"
title = "Monolith vs layered agent platform, run by run"
question = "The same incident (INC-4917) through an agent monolith and a layered platform, with faults injected on purpose. For every run: what went in, what came out, which step went wrong, and where each number came from."
claim = ["Every run, its input and output.", "Every failure, at the step it happened."]
byline = "F2 · Production AI Engineering"
filed = "{{run.filed}}"
brand = "Production AI Engineering"
tagline = "Build. Test. Learn. Ship responsibly."
note = "Generated from the run directories; rebuild after every run"
state = "RECORDED"
links = [{ label = "Evidence check", href = "layered-agent-platform-evidence-check.html" }, { label = "Run report", href = "layered-agent-platform-run-report.html" }]

[dimensions]
factor = { label = "Seed", unit = "", all = "All seeds" }
result = { pass = "Success", fail = "Failure or error" }
severity = [{ id = "none", label = "Success", tone = "ok" }, { id = "failure", label = "Failure", tone = "warn" }, { id = "error", label = "Error", tone = "bad" }]
[[dimensions.variants]]
key = "M"
name = "Agent monolith"
color = "orange"
policy = "one agent loop: prompt, tools, approval callback, session"
[[dimensions.variants]]
key = "L"
name = "Layered platform"
color = "blue"
policy = "workflow, durable state, policy, action gateway, model services"
governed = true

[[pages]]
id = "overview"
title = "Overview"
icon = "home"
  [[pages.blocks]]
  type = "run_card"
  kpis = [["{{run.scenarios}}", "Runs (scenarios)"], ["{{all.success}}", "Success"], ["{{all.failure}}", "Failure"], ["{{all.error}}", "Error"], ["{{run.model_calls}}", "Model calls"], ["{{run.sigkills}}", "Real SIGKILLs"]]
  flow_title = "What every run records"
  flow = [{ icon = "user", title = "Input", sub = "request, incident data, fault", tone = "purple" }, { icon = "cpu", title = "Model", sub = "every call and token", tone = "blue" },
          { icon = "plug", title = "Tools", sub = "every MCP call and outcome", tone = "blue" }, { icon = "lock", title = "Policy", sub = "every decision and approval", tone = "orange" },
          { icon = "server", title = "Backend", sub = "every physical side effect", tone = "gray" }, { icon = "check", title = "Checks", sub = "eight, read from the world", tone = "green" }]
  systems = "systems"
  badges = [["flask", "Run {{run.id}}"], ["cpu", "{{run.models}}"], ["check", "Verification {{verify.passed}}/{{verify.total}}"], ["refresh", "Replay: {{replay.served}} model answers from tape, {{replay.fresh}} fresh"]]
  [[pages.blocks]]
  type = "metric_grid"
  style = "margin-top:16px"
  items = [{ value = "{{M.success.kn}}", label = "Agent monolith · success", metric = "success-M" }, { value = "{{M.failure.kn}}", label = "Agent monolith · failure", metric = "failure-M" },
           { value = "{{M.error.kn}}", label = "Agent monolith · error", metric = "error-M" }, { value = "{{L.success.kn}}", label = "Layered platform · success", metric = "success-L" },
           { value = "{{L.failure.kn}}", label = "Layered platform · failure", metric = "failure-L" }, { value = "{{L.error.kn}}", label = "Layered platform · error", metric = "error-L" }]
  [[pages.blocks]]
  type = "table"
  data = "matrix"
  title = "Every use case, every run"
  sub = "✓ success · ✕ failure (a check failed) · ! error (a step errored or a process died). One mark per run; select a run on the Runs page for its detail."
  [[pages.blocks]]
  type = "callout"
  icon = "bulb"
  title = "How a run's status is decided"
  text = "Success means every applicable check passed. Failure means the run finished but a check failed. Error means a process ended abnormally, or a tool call errored and the run then failed a check. The checks read the simulated world and the backend ledger, not the model's prose."

[[pages]]
id = "runs"
title = "Runs"
icon = "list"
count = "rows"
  [[pages.blocks]]
  type = "case_explorer"
  heading = "Runs"
  flag_tab = "Failures and errors"
  search = "Search run ids, use cases, failures…"
  csv_head = "run_id,use_case,architecture,{factor},success,status,failed_step_and_reason"
  columns = [{ label = "Status", show = "severity" }, { label = "Failed at step", kv = "Failed at step" }, { label = "Checks", kv = "Checks" }, { label = "Harness", kv = "Harness" }]

[[pages]]
id = "problems"
title = "Failures & errors"
icon = "alert"
  [[pages.blocks]]
  type = "head"
  title = "Where runs went wrong"
  sub = "Every run that did not succeed, the step where it first went wrong, and what the ledgers recorded. Select a row for its steps."
  [[pages.blocks]]
  type = "table"
  data = "problems"
  title = "Failures and errors · run {{run.id}}"
  sub = "{{all.failure}} failures and {{all.error}} errors."
  [[pages.blocks]]
  type = "table"
  data = "every"
  title = "All runs"
  sub = "{{run.scenarios}} runs of the preregistered plan. Select a row for its input, output, steps and lineage."

[[pages]]
id = "lineage"
title = "Data lineage"
icon = "layers"
  [[pages.blocks]]
  type = "head"
  title = "From the request to the published number"
  sub = "The files that carry each run's data, in order. Every run's Data lineage tab lists its own files with record counts."
  [[pages.blocks]]
  type = "table"
  data = "lineage"
  title = "Per-run lineage"
  sub = "Paths inside the run directory; ‹run id› is the scenario, for example the first row on the Runs page."
  [[pages.blocks]]
  type = "table"
  data = "allruns"
  title = "Runs found"
  sub = "Every run directory with scored scenarios is listed here and selectable on the Runs page ({{run.sources}} found). A new run appears after the page is rebuilt."

[[pages]]
id = "raw"
title = "Raw evidence"
icon = "folder"
footer = true
  [[pages.blocks]]
  type = "artifacts"
  sub = "Where every value on these pages comes from."
  files = [["layered_architecture_poc/runs/{{run.id}}/scenarios/‹run id›/score.json", "each run's checks and counts"],
           ["layered_architecture_poc/runs/{{run.id}}/scenarios/‹run id›/raw/", "each run's ledgers: model, tools, policy, approvals, backend, executions, checkpoints, traces"],
           ["layered_architecture_poc/runs/{{run.id}}/scenarios/‹run id›/tape/model_tape.jsonl", "each model answer, for replay"],
           ["layered_architecture_poc/runs/{{run.id}}/scenarios/‹run id›/logs/", "each process's log"],
           ["layered_architecture_poc/runs/{{run.id}}/manifest.json", "environment, models, seeds, frozen hashes"],
           ["layered_architecture_poc/runs/{{run.id}}/verification.json", "the run verifier ({{verify.passed}}/{{verify.total}})"]]

[[pages]]
id = "reproduce"
title = "Reproduce"
icon = "terminal"
footer = true
  [[pages.blocks]]
  type = "reproduce"
  quick_sub = "From the F2 folder."
  quickstart = [["Tests without live models", "make test-fast"], ["Replay the published run from its tape", "make replay"], ["Verify the run's evidence", "make verify-evidence"],
                ["A new recorded run (live models)", "make run-recorded"], ["Rebuild this page from every run", "make console"]]
  environment = [["Models", "{{run.models}}", "ollama pull the same models"], ["Runs", "{{run.scenarios}} per run", "make run-recorded"]]
  replay_title = "Replay"
  replay_sub = "Each run of the recorded run against the same run replayed from the model tape: same checks, same status."
  reproduced_as = "same status"

[claims]
title = ""

[[metrics]]
id = "success-M"
variant = "M"
headline = "{{M.success.kn}} success"
statement = "{{M.success}} of {{M.runs}} agent monolith runs succeeded: every applicable check passed"
breakdown_title = "By experiment"
source = "M.success"

[[metrics]]
id = "success-L"
variant = "L"
headline = "{{L.success.kn}} success"
statement = "{{L.success}} of {{L.runs}} layered platform runs succeeded: every applicable check passed"
breakdown_title = "By experiment"
source = "L.success"

[[metrics]]
id = "failure-M"
variant = "M"
headline = "{{M.failure.kn}} failure"
statement = "{{M.failure}} of {{M.runs}} agent monolith runs failed: the run finished but a check failed"
breakdown_title = "By experiment"
source = "M.failure"

[[metrics]]
id = "failure-L"
variant = "L"
headline = "{{L.failure.kn}} failure"
statement = "{{L.failure}} of {{L.runs}} layered platform runs failed: the run finished but a check failed"
breakdown_title = "By experiment"
source = "L.failure"

[[metrics]]
id = "error-M"
variant = "M"
headline = "{{M.error.kn}} error"
statement = "{{M.error}} of {{M.runs}} agent monolith runs errored: a step errored or a process died"
breakdown_title = "By experiment"
source = "M.error"

[[metrics]]
id = "error-L"
variant = "L"
headline = "{{L.error.kn}} error"
statement = "{{L.error}} of {{L.runs}} layered platform runs errored: a step errored or a process died"
breakdown_title = "By experiment"
source = "L.error"
