  # ------------------------------------------------------------------------------------------------ inventory
  - doc_id: RB-INV-004
    version: v5
    title: "inventory-api: stale stock levels"
    doc_type: runbook
    owner: fulfilment
    tenant: acme
    environments: [production]
    services: [inventory-api]
    status: active
    valid_from: "2026-08-22T00:00:00Z"
    valid_to: null
    superseded_by: null
    supersedes: RB-INV-004@v4
    procedure_key: inventory-api/stale-stock
    action: resync_job
    approval: none
    acl: [eng-all]
    updated_at: "2026-08-22T10:00:00Z"
    sections:
      - heading: Remediation
        text: >-
          Trigger the warehouse resync job from the job runner (jobs run inv-resync --tenant acme). Stock converges
          within 10 minutes. No approval is needed.
      - heading: Cache caution
        text: >-
          Do not flush the SKU cache between 06:00 and 22:00 UTC: a flush during trading hours causes a cache stampede
          on inventory-db (see INC-4702).

  - doc_id: RB-INV-004
    version: v4
