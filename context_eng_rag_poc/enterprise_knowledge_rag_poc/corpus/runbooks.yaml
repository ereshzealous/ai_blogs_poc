    action: disable_flag
    approval: payments-oncall
    acl: [eng-all]
    updated_at: "2026-08-25T13:00:00Z"
    sections:
      - heading: Remediation
        text: >-
          If 3DS2 challenge completions drop after a change to the threeds2 flags, turn the affected flag off in the
          flag service (for EU cards: threeds2.eu=off). Payments on-call must approve the flag change.
      - heading: Before you change the flag
        text: >-
          Only change the flag after confirming the card network status page is green; if the network is degraded,
          leave the flag on and follow the network incident instead.

