  - doc_id: RB-SRCH-004
    version: v2
    title: "search-api: relevance drop after an index build"
    doc_type: runbook
    owner: search-platform
    tenant: acme
    environments: [production]
    services: [search-api]
    status: active
    valid_from: "2026-06-01T00:00:00Z"
