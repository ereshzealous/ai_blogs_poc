  # ------------------------------------------------------------------------------------------------ inventory (globex)
  - doc_id: GX-RB-INV-002
    version: v1
    title: "globex inventory-api: stale stock levels"
    doc_type: runbook
    owner: globex-fulfilment
    tenant: globex
    environments: [production]
    services: [inventory-api]
    status: active
    valid_from: "2026-07-14T00:00:00Z"
    valid_to: null
    superseded_by: null
    supersedes: null
    procedure_key: inventory-api/stale-stock
    action: resync_job
    approval: none
    acl: [eng-all]
    updated_at: "2026-07-14T09:00:00Z"
    sections:
      - heading: Remediation
        text: >-
          globex stock comes from the merchant's ERP feed. Run stock-reconcile from the globex scheduler
          (gx-sched run stock-reconcile); it replays the last ERP snapshot. No approval is needed.

