[[experiments]]
id = "T4-R13"
role = "evidence"
title = "Evidence integrity and replay"
question = "Does the recorded evidence hold together: chains, signatures, credentials, processes, code and request hashes, and a rerun from source?"
claim = "The evidence is internally consistent, recomputable from the raw state, and reproduced exactly by a rerun."
hypothesis = "Every chain and signature verifies; no plaintext credential; no runtime restarted; one agent source hash; every request hash recomputes; the rerun differs only in masked process ids."
setup = "Recompute from the raw state the scenarios left behind (tools/proof_facts.py); rerun every proof from source into a scratch copy (tools/verify_run.py --record)."
variable = "none"
invariant = "The evidence recomputes; the rerun is equivalent."
limitations = ["SHA256SUMS is a checksum list, not a signature. The signing key is a POC file, not a KMS."]
  [[experiments.checks]]
  id = "T4-R13-C01"
  description = "Every runtime audit log's hash chain verifies"
  kind = "implementation"
  fact = "raw.audit_chains_verified"
  op = "=="
  ref = "raw.audit_chains"
  [[experiments.checks]]
  id = "T4-R13-C02"
  description = "Every control-plane change log's hash chain verifies"
  kind = "implementation"
  fact = "raw.changelogs_verified"
  op = "=="
  ref = "raw.changelogs"
