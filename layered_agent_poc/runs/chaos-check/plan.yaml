# Resolved plan for this run (written by poc run).
name: chaos
description: More failure, one model. Faults from the start of the workflow, and three
  SIGKILLs in one workflow.
minutes: 4
models:
- gpt-oss:20b
runs: 1
model_answers:
  mode: live
  replay_from: null
  record: true
experiments:
- tests
- faults
- crash
tests:
  model_tests: false
faults:
  model: gpt-oss:20b
  arm_at: start
  inject:
  - tool: observability.query_latency
    mode: timeout
    times: 2
    delay_s: 3.0
  - tool: source_control.rollback_release
    mode: lose_response
    times: 1
    delay_s: 4.0
  - tool: itsm.update_incident
    mode: lose_response
    times: 1
    delay_s: 5.0
crash:
  model: gpt-oss:20b
  kill_at:
  - after_step:investigate
  - after_step:await_approval
  - executed:source_control.rollback_release
  inject: []
monolith:
  lost_response: true
  crash: true
expect:
  tests_pass: true
  contracts_kept: true
  platform_runs_complete: all
  platform_all_checks: all
  lost_response_backend_executions: 1
  monolith_lost_response_rollbacks_at_least: 2
  crash_final_status: COMPLETED
  crash_backend_rollbacks: 1
  change_contracts_kept: true
