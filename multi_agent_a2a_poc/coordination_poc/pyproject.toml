[project]
name = "c1-coordination-poc"
version = "0.1.0"
description = "C1 POC: one agent vs deterministic workflow + agents vs multi-agent over A2A, on the same headless capability"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk[http-server]==1.2.2",
    "mcp==2.2.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rA -p no:cacheprovider"
asyncio_mode = "strict"
markers = [
    "mcp: starts real MCP server subprocesses over stdio",
    "a2a: starts real A2A agent server processes",
    "model: calls a local Ollama model (skipped when Ollama or the model is unavailable)",
]
filterwarnings = ["ignore::DeprecationWarning"]
