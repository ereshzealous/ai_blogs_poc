checks = ["F1-R7-C01", "F1-R7-C02", "F1-R7-C03", "F1-R7-C08"]
article = ["What the evidence said", "Search narrows the choice. The platform decides.", "Where this belongs", "What the failures changed", "fig:f21", "fig:f22", "fig:f26", "fig:f27", "fig:f20", "fig:f29"]
technical = ["fig:chart:safety"]
facts = ["C.all.unsafe_proposal.k", "C.all.unsafe_execution.k", "C.all.unsafe_proposal.kn", "C.all.unsafe_execution.kn", "C.all.incorrect.k", "rows.per_variant"]

