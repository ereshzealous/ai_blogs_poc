<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approval inbox · HITL POC</title>
<style>
:root{--ink:#172B4D;--sub:#52637A;--line:#E3E8EF;--orange:#D97706;--orange-bg:#FFF7EA;--red:#C2410C;--green:#1F9D74;--indigo:#4551C9;--bg:#F6F8FB}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;letter-spacing:.01em}header .who{margin-left:auto;font-size:13px;color:var(--sub)}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
main{max-width:860px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.kicker{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:var(--orange);text-transform:uppercase}
.title{font-size:21px;font-weight:700;margin:8px 0 2px}.lead{color:var(--sub);margin:0 0 14px}
dl{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;margin:0 0 14px}dt{font:600 11.5px/1.6 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:var(--sub);text-transform:uppercase}
dd{margin:0}code{font:13px ui-monospace,Menlo,monospace;background:var(--bg);padding:1px 5px;border-radius:5px;white-space:nowrap}
.auth{background:var(--orange-bg);border:1px solid #F6D9A6;border-radius:10px;padding:10px 12px;margin:0 0 14px}
.auth b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}textarea{flex:1 1 260px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;min-height:40px}
button{font:600 14px/1 inherit;padding:10px 16px;border-radius:9px;border:1px solid transparent;cursor:pointer}
.approve{background:var(--green);color:#fff}.reject{background:#fff;border-color:#E7B8A6;color:var(--red)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.msg{margin-top:12px;font-size:14px}.msg.ok{color:var(--green)}.msg.err{color:var(--red)}
.empty{color:var(--sub);text-align:center;padding:40px 0}
@media (max-width:560px){dl{grid-template-columns:1fr}dt{margin-top:6px}}
</style>
</head>
<body>
<header>
  <h1>Approval inbox</h1>
  <label class="who">Signed in as (demo identity provider)
    <select id="who" aria-label="Demo identity">
      <option value="tok-alice">alice · production-approver</option>
      <option value="tok-omar">omar · production-approver</option>
      <option value="tok-dana">dana · production-approver, authored v4.18.0</option>
      <option value="tok-reggie">reggie · readonly-engineer</option>
      <option value="tok-agent">agent.incident-investigator</option>
    </select>
  </label>
</header>
<main id="main" aria-live="polite"><p class="empty">Loading…</p></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {"Content-Type": "application/json", "Authorization": "Bearer " + $("#who").value},
                               body: body ? JSON.stringify(body) : undefined});
  return [r.status, await r.json()];
}
function card(a) {
  return `<article class="card" aria-labelledby="t-${a.proposal_id}">
  <div class="kicker">Approval required · ${esc(a.risk)} · expires ${esc(a.expires)}</div>
  <div class="title" id="t-${a.proposal_id}">Roll back ${esc(a.what.split(" ")[1])} in ${esc(a.where)}: ${esc(a.from)} → ${esc(a.to)}</div>
  <p class="lead">${esc(a.why)}</p>
  <dl>
    <dt>What</dt><dd><code>${esc(a.what)}</code></dd>
    <dt>Where</dt><dd>${esc(a.where)}</dd>
    <dt>From → to</dt><dd>${esc(a.from)} → ${esc(a.to)} <span style="color:#52637A">(${esc(a.precondition)})</span></dd>
    <dt>Evidence</dt><dd>${a.evidence.map((e) => `<code>${esc(e)}</code>`).join(" ")}</dd>
    <dt>Requested by</dt><dd>${esc(a.requested_by)}</dd>
    <dt>Triggered by</dt><dd>${esc(a.invoked_by)}</dd>
    <dt>Acting for</dt><dd>${esc(a.acting_for)}</dd>
    <dt>Policy</dt><dd>${esc(a.policy)}</dd>
    <dt>Impact</dt><dd>${esc(a.impact)}</dd>
    <dt>Recovery</dt><dd>${esc(a.recovery)}</dd>
    <dt>Deployed by</dt><dd>${esc(a.deployment_author)} (cannot approve this rollback)</dd>
  </dl>
  <div class="auth"><b>You are authorizing</b>${esc(a.you_are_authorizing)}<br><span style="color:#52637A;font-size:13px">action digest <code>${esc(a.action_digest.slice(0, 16))}…</code> · one execution · nothing else</span></div>
  <div class="row"><textarea aria-label="Reason" id="r-${a.proposal_id}" placeholder="Reason (recorded in the audit trail)"></textarea>
    <button class="approve" data-p="${a.proposal_id}" data-d="${a.action_digest}" data-v="approve">Approve</button>
    <button class="reject" data-p="${a.proposal_id}" data-d="${a.action_digest}" data-v="deny">Deny</button></div>
  <div class="msg" id="m-${a.proposal_id}" role="status"></div></article>`;
}
async function load() {
  const [s, list] = await api("GET", "/approvals");
  if (s !== 200) { $("#main").innerHTML = `<p class="empty">${esc(list.error)}</p>`; return; }
  $("#main").innerHTML = list.length ? list.map(card).join("") : `<p class="empty">Nothing is waiting for a decision.</p>`;
  document.querySelectorAll("button[data-p]").forEach((b) => b.addEventListener("click", async () => {
    const p = b.dataset.p, [s, out] = await api("POST", `/approvals/${p}/decision`, {decision: b.dataset.v, action_digest: b.dataset.d, reason: $("#r-" + p).value});
    const m = $("#m-" + p);
    if (s === 200) { m.className = "msg ok"; m.textContent = `${out.decision.decision}d by ${out.decision.approver.identity}` + (out.execution ? ` · execution: ${out.execution.code}` : ""); setTimeout(load, 1500); }
    else { m.className = "msg err"; m.textContent = `${s}: ${out.error}`; }
  }));
}
$("#who").addEventListener("change", load);
load();
</script>
</body>
</html>
