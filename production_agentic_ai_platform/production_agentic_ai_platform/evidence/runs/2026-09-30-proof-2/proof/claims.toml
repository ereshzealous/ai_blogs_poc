# P1 · Production Agentic AI Platform (capstone) · claims (Production AI Engineering Proof Contract v1, pae-proof/v1)
#
# Every material claim the articles make → the experiments and checks it rests on → their evidence. A statement holds
# no result number: numbers are facts, listed under `facts` (every result fact an article prints belongs to a claim).
# The verdict is tested against the checks by evidence_kit.proof.trace: "supported" needs every check PASS (a control
# check may be EXPECTED_FAILURE), "control" needs an EXPECTED_FAILURE and no FAIL, "implementation" needs every check
# PASS, and a "limitation" names what it rests on. `article` names the sections and figures that make the claim.

[[claims]]
id = "P1-C01"
statement = "A model proposal does not itself authorize production execution: the rollback reaches production only through policy, an approval of its exact digest and a capability bound to that digest."
type = "measured"
verdict = "supported"
experiments = ["P1-R1", "P1-R2"]
checks = ["P1-R1-C05", "P1-R1-C06", "P1-R1-C07", "P1-R1-C08", "P1-R1-C09", "P1-R1-C10", "P1-R1-C11", "P1-R1-C12", "P1-R1-C13", "P1-R1-C18", "P1-R2-C03"]
article = ["1 · The model proposes", "2 · Policy decides", "fig:governed-path", "fig:proposal-boundary"]
facts = ["r1_model", "r1_model_calls", "r1_decision_id", "r1_policy_version", "r1_offered", "r1_exposed", "r1_selected", "r1_excluded",
         "r1_workflow_id", "r1_workflow_steps", "r1_tool_calls", "r1_rollback_id", "r1_p95_after", "r1_slo", "r1_eval_passed", "r1_eval_total"]

