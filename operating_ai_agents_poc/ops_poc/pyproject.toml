[project]
name = "ops-poc"
version = "1.0.0"
description = "O1 + O2 POC: a deterministic agent-operations simulator. Admission, tenant fairness, bounded concurrency, workflow resource envelopes, routing inside an eligibility contract, retrieval budgets, a tool gateway, a behavioural release manifest, invariant gates and a behavioural canary. Simulation units only; no model, no network."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
agentops = "agentops.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
