# F1 · MCP Tool Sprawl · claims → experiments → checks (Production AI Engineering Proof Contract v1, pae-proof/v1)
#
# Every material measured claim the articles make, without its numbers (they are facts). `verdict` is tested against
# the checks: supported needs every check PASS, contradicted and not_established need a FAIL, control needs an
# EXPECTED_FAILURE, a limitation names what it rests on. `article` names where the Medium edition states it (section
# headings and figures), `technical` the Technical edition's figures and charts that show it; `facts` lists every result
# fact the article prints for it. tools/verify_publication.py fails
# when a result fact in the article belongs to no claim, or a location does not exist.

[[claims]]
id = "F1-C01"
statement = "The benchmark runs real MCP, not functions labelled MCP: the official SDK over stdio, one process per server, tools/list and tools/call, and a live local model."
type = "implementation"
verdict = "implementation"
experiments = ["F1-R1"]
checks = ["F1-R1-C01", "F1-R1-C02", "F1-R1-C03", "F1-R1-C04", "F1-R1-C05", "F1-R1-C08"]
article = ["What actually ran", "ORD-4917, end to end", "fig:f09", "fig:f30", "fig:f31"]
facts = ["protocol.revisions", "protocol.transport", "protocol.sdk_version", "model.temperature", "run.rows", "rows.per_variant", "harness.shortlist_k",
         "model.name", "model.digest", "model.ollama_version", "protocol.servers.500", "protocol.tools.500", "embed.name", "published.run_id"]

[[claims]]
id = "F1-C02"
statement = "Every control-plane side effect went through a signed gateway call; the baselines called their servers directly."
