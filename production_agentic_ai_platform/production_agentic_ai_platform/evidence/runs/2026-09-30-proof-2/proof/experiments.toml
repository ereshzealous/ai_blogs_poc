  harness = "R2.world"
  description = "no rollback executed"
  kind = "invariant"
  fact = "obs.R2.world"
  op = "=="
  value = 0

[[experiments]]
id = "P1-R3"
harness = "R3"
title = "Approval tampering"
question = "What if the action changes after the human approved it?"
claim = "Approval authorizes one exact invocation, not a session: a change to the approved action is refused at execution."
hypothesis = "Changing v4.16 to v4.15 after approval, rewriting the approval record, replaying it in another workflow, self-approval and approval by someone without the incident-commander role are all refused, with no capability and no production change; the approved action itself executes once."
setup = "Approve the rollback, then present five attacks to the execution gateway before executing the approved invocation."
variable = "the invocation or the approval presented at execution"
invariant = "Execution needs an approval whose digest equals the executing invocation's, signed for an eligible approver other than the requester."
limitations = ["HMAC with a per-run key stands in for asymmetric signatures."]
tests = ["tests/test_units.py"]
  [[experiments.checks]]
  id = "P1-R3-C01"
  harness = "R3.version"
  description = "target_version changed v4.16 -> v4.15 after approval -> APPROVAL_DIGEST_MISMATCH"
  kind = "invariant"
  fact = "obs.R3.version"
  op = "=="
  value = "DENIED · APPROVAL_DIGEST_MISMATCH"
  [[experiments.checks]]
  id = "P1-R3-C02"
  harness = "R3.digests_differ"
  description = "the two digests differ"
  kind = "invariant"
  fact = "obs.R3.digests_differ"
  op = "=="
  value = true
  [[experiments.checks]]
  id = "P1-R3-C03"
  harness = "R3.forged"
  description = "approval record rewritten to the new digest -> APPROVAL_SIGNATURE_INVALID"
  kind = "invariant"
  fact = "obs.R3.forged"
  op = "=="
  value = "DENIED · APPROVAL_SIGNATURE_INVALID"
  [[experiments.checks]]
  id = "P1-R3-C04"
  harness = "R3.replay"
  description = "the same approval presented by another workflow -> APPROVAL_DIGEST_MISMATCH"
  kind = "invariant"
  fact = "obs.R3.replay"
  op = "=="
  value = "DENIED · APPROVAL_DIGEST_MISMATCH"
  [[experiments.checks]]
  id = "P1-R3-C05"
  harness = "R3.self"
  description = "the requester approving her own request -> SELF_APPROVAL"
  kind = "invariant"
  fact = "obs.R3.self"
  op = "=="
  value = "REFUSED · SELF_APPROVAL"
  [[experiments.checks]]
  id = "P1-R3-C06"
  harness = "R3.non_approver"
  description = "someone without the incident-commander role approving -> APPROVER_NOT_AUTHORIZED"
  kind = "invariant"
  fact = "obs.R3.non_approver"
  op = "=="
  value = "REFUSED · APPROVER_NOT_AUTHORIZED"
  [[experiments.checks]]
  id = "P1-R3-C07"
  harness = "R3.no_capability"
  description = "no capability was issued for any attack"
  kind = "invariant"
  fact = "obs.R3.no_capability"
  op = "=="
  value = 0
  [[experiments.checks]]
  id = "P1-R3-C08"
  harness = "R3.no_effect"
  description = "production unchanged by the attacks"
  kind = "invariant"
  fact = "obs.R3.no_effect"
  op = "=="
  value = 0
  [[experiments.checks]]
  id = "P1-R3-C09"
  harness = "R3.approved_runs"
  description = "the approved action itself executes, once"
  kind = "invariant"
  fact = "obs.R3.approved_runs"
  op = "=="
  value = "SUCCEEDED · 1"

[[experiments]]
id = "P1-R4"
harness = "R4"
title = "Tool governance"
question = "Can an unregistered, untrusted or retired capability execute?"
claim = "Discovery and execution governance are different controls: what an MCP server exposes is not what the agent may execute."
hypothesis = "Discovery withholds the unregistered, untrusted and retired tools; executing them through the platform is refused with their own codes; only a call that bypasses the platform reaches production (the control)."
setup = "Three MCP servers expose more tools than the registry trusts; the platform is asked to execute force_deploy (unregistered), the toolbox rollback (untrusted) and the legacy rollback (retired); a raw MCP client then calls the untrusted server directly."
variable = "the capability's registry state; then the platform bypassed"
invariant = "No call reaches an unregistered, untrusted or retired capability through the platform."
limitations = ["The bypass control shows why R5's server-side capability check matters; this experiment does not prevent it."]
tests = ["tests/test_units.py"]
  [[experiments.checks]]
  id = "P1-R4-C01"
  harness = "R4.exposed_vs_offered"
  description = "MCP servers expose more than discovery offers the agent"
  kind = "invariant"
  fact = "obs.R4.exposed_vs_offered"
  op = "=="
  value = true
  [[experiments.checks]]
  id = "P1-R4-C02"
  harness = "R4.not_offered"
  description = "force_deploy, the toolbox rollback and the legacy rollback were never offered"
  kind = "invariant"
  fact = "obs.R4.not_offered"
  op = "=="
  value = "false · false · false"
  [[experiments.checks]]
  id = "P1-R4-C03"
  harness = "R4.unregistered"
  description = "release.force_deploy (exposed by MCP, absent from the registry) -> CAPABILITY_NOT_REGISTERED"
  kind = "invariant"
  fact = "obs.R4.unregistered"
  op = "=="
  value = "CAPABILITY_NOT_REGISTERED"
  [[experiments.checks]]
  id = "P1-R4-C04"
  harness = "R4.untrusted"
  description = "toolbox.execute_rollback (unvetted server) -> TOOL_UNTRUSTED"
  kind = "invariant"
  fact = "obs.R4.untrusted"
  op = "=="
  value = "TOOL_UNTRUSTED"
  [[experiments.checks]]
  id = "P1-R4-C05"
  harness = "R4.retired"
  description = "release.legacy_rollback (retired) -> TOOL_LIFECYCLE"
  kind = "invariant"
  fact = "obs.R4.retired"
  op = "=="
  value = "TOOL_LIFECYCLE"
  [[experiments.checks]]
  id = "P1-R4-C06"
  harness = "R4.no_calls"
  description = "no call reached the toolbox server or force_deploy through the platform"
  kind = "invariant"
  fact = "obs.R4.no_calls"
  op = "=="
  value = "0 · 0"
  [[experiments.checks]]
  id = "P1-R4-C07"
  harness = "R4.no_effect"
  description = "no production change through the platform"
  kind = "invariant"
  fact = "obs.R4.no_effect"
  op = "=="
  value = 0
  [[experiments.checks]]
  id = "P1-R4-C08"
  harness = "R4.control_direct"
  description = "Control, safeguard absent (the gateway bypassed): a direct call to the untrusted server must not change production"
  kind = "control"
  fact = "obs.R4.control_direct"
  op = "!="
  value = "SUCCEEDED"
  expect = "fail"

[[experiments]]
