# Learning 01 POC in Docker, on any platform.
#
#   docker compose build
#   docker compose run --rm poc                                    # evidence mode (no model), about 4 minutes
#   docker compose run --rm poc doctor                             # what the container can reach
#   docker compose run --rm poc run --preset quick                 # live: 12 rows against the host's Ollama
#   docker compose run --rm poc all --live --preset full --run-id rerun-1
#   docker compose run --rm poc report                             # rebuild evidence/lab-console.html
#
# The repository is mounted at /work, so new runs (experiment/runs/) and the Lab Console land in this checkout,
# and the git commit is recorded with each run.  On Linux, add  --user "$(id -u):$(id -g)"  to keep file ownership.
#
# The model runs outside the image.  On a Mac, run Ollama natively (Metal GPU) and keep the default endpoint.
# On a Linux host with an NVIDIA GPU you can run Ollama as a service instead:
#   docker compose --profile ollama up -d ollama
#   docker compose exec ollama ollama pull gpt-oss:20b && docker compose exec ollama ollama pull nomic-embed-text
#   SPRAWL_OLLAMA_HOST=http://ollama:11434 docker compose run --rm poc run --preset quick
services:
  poc:
    build: .
    image: sprawl-poc:learning01
    volumes:
      - .:/work
    environment:
      SPRAWL_OLLAMA_HOST: ${SPRAWL_OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama: {}
