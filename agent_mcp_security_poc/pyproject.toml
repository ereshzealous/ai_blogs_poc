[project]
name = "t6-redteam-poc"
version = "1.0.0"
description = "T6 POC: a red-team harness for agent, tool and MCP security. A worst-case compliant model proposes hostile actions; a trusted registry, identity, policy, approval, MCP gateway and egress boundary decide what executes. pae-proof/v1 evidence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "store-world>=0.1.0",
]

[project.scripts]
redteam = "redteam.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv.sources]
store-world = { path = "./store_world", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redteam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
addopts = "-q -p no:cacheprovider"
markers = ["contract: an import-boundary contract test (a gate must not import the corpus)"]
