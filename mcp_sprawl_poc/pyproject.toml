[project]
name = "mcp-capability-control-plane"
version = "0.1.0"
description = "POC and benchmark: capability-aware discovery and deterministic governance for large MCP tool ecosystems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp==2.2.0",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
]

[project.optional-dependencies]
reports = ["matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3", "matplotlib>=3.9"]

[project.scripts]
mcpcp = "control_plane.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "benchmark", "control_plane", "servers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "mcp: starts real MCP server subprocesses over stdio",
    "ollama: needs a local Ollama server (skipped when unavailable)",
]
