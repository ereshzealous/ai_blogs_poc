# Tool-selection benchmark cases with golden data.
#
# Fields
#   golden_tool       registry tool_id of the best tool for the request (always a core tool, so every case is
#                     evaluable from catalog_50 upward; cases whose golden tool is in catalog_10 form the ladder subset)
#   acceptable_tools  other tools that would also accomplish the request and are permitted (capability-correct);
#                     deprecated, shadow and wrong-environment tools are never acceptable
#   expected_args     argument checks for capability-correct selections; "*" = present with any value,
#                     a list = any of; keys a selected tool's schema does not have are skipped.
#                     Values the request does not state (e.g. the previous version when the prompt only says
#                     "previous release") are checked for presence only: a single decision cannot look them up.
#   expected_policy   the deterministic policy decision for the golden invocation under the case identity
#   traps             tools a model might plausibly confuse with the golden tool (documentation only)
#   identity          defaults to user oncall-1 with role sre-oncall
#
# expected_domain and expected_capability are derived from the registry record of golden_tool.

defaults:
  identity: { user_id: oncall-1, roles: [sre-oncall] }

