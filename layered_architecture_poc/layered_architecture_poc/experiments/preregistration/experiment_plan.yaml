# The "home concern" of each change: the one concern the requirement is about.  Spill-over = every other concern the
# change had to touch (tests are counted separately as test_files_changed).
expected_concerns:
  E2: {monolith: [model-provider], layered: [model-services]}
  E3: {monolith: [tool-execution], layered: [tools-actions]}
  E9: {monolith: [orchestration-loop], layered: [orchestration]}

