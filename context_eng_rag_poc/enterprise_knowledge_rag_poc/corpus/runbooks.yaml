          Draft for review by checkout-engineering and the change advisory board. Effective 2026-10-01 if approved.

  # ------------------------------------------------------------------------------------------------ checkout-api (globex)
  - doc_id: GX-RB-CHK-003
    version: v2
    title: "globex checkout-api: latency after a deploy (blue/green)"
    doc_type: runbook
    owner: globex-checkout
    tenant: globex
    environments: [production]
    services: [checkout-api]
    status: active
    valid_from: "2026-05-04T00:00:00Z"
    valid_to: null
    superseded_by: null
    supersedes: GX-RB-CHK-003@v1
    procedure_key: checkout-api/latency-after-deploy
    action: switch_traffic
    approval: none
    acl: [eng-all]
    updated_at: "2026-05-04T08:00:00Z"
    sections:
      - heading: Remediation
        text: >-
          globex runs checkout-api blue/green. Switch production traffic back to the blue stack in Traffic Manager
          (traffic-manager switch checkout-api --to blue). Pool saturation and latency regressions clear within a minute
          of the switch.
      - heading: Approval
        text: >-
          No approval is needed for a traffic switch within 30 minutes of the deploy. After 30 minutes, page the globex
          incident commander before switching.

  # ------------------------------------------------------------------------------------------------ estate-wide
  - doc_id: RB-GEN-012
    version: v1
    title: "Production rollbacks and configuration changes (GitOps)"
    doc_type: runbook
    owner: platform-team
    tenant: acme
    environments: [production]
    services: ["*"]
    status: active
    valid_from: "2026-04-20T00:00:00Z"
    valid_to: null
    superseded_by: null
    supersedes: null
    procedure_key: "*/production-rollback"
    action: rollback_release
    approval: incident-commander
    acl: [eng-all]
    updated_at: "2026-04-20T10:00:00Z"
    sections:
      - heading: Rollbacks
        text: >-
          Every production rollback goes through the release pipeline. Direct kubectl changes to production workloads
          are reverted by the GitOps controller within minutes.
      - heading: Configuration changes
        text: >-
          Configuration changes in production (ConfigMaps, pool sizes, timeouts, feature defaults) also go through the
          pipeline as a release. Editing them in place is not permitted and will be reverted.
      - heading: Exceptions
        text: >-
          Releases with schema migrations: if the release record shows migration: true, a rollback can leave the schema
          ahead of the code. Do not roll back. Escalate to the DBA on-call, who decides between a forward fix and a
          migration rollback.

  # ------------------------------------------------------------------------------------------------ staging
  - doc_id: STG-OPS-004
    version: v3
    title: "Staging operations guide: datasource and scaling changes"
    doc_type: runbook
    owner: platform-team
    tenant: acme
    environments: [staging]
    services: [checkout-api, orders-db, search-api]
