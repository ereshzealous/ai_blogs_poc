# T5's Lab Console: the words and the layout.  Every number is a {{fact}} registered by tools/build_lab_console.py from
# the run directories; the kit refuses a hand-typed number.  No architecture diagrams: this page is the POC's output, scenario
# by scenario and layer by layer: input, output, the thirteen answers against truth, recorded steps, data lineage.

case_tabs = [{ id = "io", label = "Input & output" }, { id = "answers", label = "Answers vs truth" }, { id = "steps", label = "Steps" }, { id = "lineage", label = "Data lineage" }]

[kit]
version = "4"

[lint]
allow = ['\bT[1235]\b', '\bF[123]\b', '\bL[012]\b', '\bQ\d+\b', '\bE\d+[ab]?\b', '\be\d+[ab]?\b', '\bD\d+\b', '\bP\d\b', '\bC\d\b', '\b\d{4}-\d{2}-\d{2}\b', '\b\d{2}:\d{2}(:\d{2})?\b', '\bv\d+(\.\d+)*\b', '@\d+', '(?m)^\d\. ', 'qwen3:8b', 'SIGKILL', 'W3C']

[learning]
series = "Production AI Engineering"
id = "T5"
topic = "Observability & Governance"
label = "T5 · Lab Console · run {{run.id}}"
title = "Logs, traces and execution lineage: scenario by scenario"
question = "After an autonomous production action, what can each observation layer reconstruct and prove? For every scenario and every layer: what went in, what came out, the thirteen answers against ground truth, every recorded step, and where each number came from."
claim = ["Every scenario, read three ways from the same run.", "Every answer scored against the systems of record."]
byline = "T5 · Production AI Engineering"
filed = "{{run.filed}}"
brand = "Production AI Engineering"
tagline = "Build. Test. Learn. Ship responsibly."
note = "Generated from the run directories; rebuild after every run"
state = "RECORDED"
links = [{ label = "Run report", href = "observability-governance-report.html" }, { label = "Evidence Check", href = "observability-governance-evidence.html" }, { label = "Real vs simulated", href = "observability-governance-real-vs-simulated.html" }, { label = "Medium edition", href = "../medium/observability-governance-medium.html" }, { label = "Technical edition", href = "../technical/observability-governance-technical.html" }]

[dimensions]
factor = { label = "Scenario", unit = "", all = "All scenarios" }
result = { pass = "All thirteen answered", fail = "Gaps or a false answer" }
severity = [{ id = "none", label = "Held", tone = "ok" }, { id = "qualified", label = "Qualified", tone = "warn" }, { id = "broken", label = "Broken", tone = "bad" }]
[[dimensions.variants]]
key = "L0"
name = "Application logs"
color = "red"
policy = "each component's own log with its own ids (incident id where known, X-Request-Id propagated), trace ids removed, plus the approval service's tables"
[[dimensions.variants]]
key = "L1"
name = "Logs + traces"
color = "blue"
policy = "the same log lines with trace and span ids, plus every OpenTelemetry span of every process (standard GenAI and HTTP conventions)"
[[dimensions.variants]]
key = "L2"
name = "Execution lineage"
color = "green"
policy = "hash-chained evidence events keyed by execution, action and attempt; witness anchors; the deployment API's transaction lookup by idempotency key"
governed = true

[[pages]]
id = "overview"
title = "Overview"
icon = "home"
  [[pages.blocks]]
  type = "run_card"
  kpis = [["{{run.scenarios}}", "Scenarios"], ["{{run.rows}}", "Rows (scenario × layer)"], ["{{all.held}}", "Held"], ["{{all.qualified}}", "Qualified"], ["{{all.broken}}", "Broken"], ["{{checks.passed}}/{{checks.total}}", "Run checks"]]
  flow_title = "What every scenario records"
  flow = [{ icon = "cpu", title = "Agent runtimes", sub = "target + concurrent; real processes", tone = "blue" }, { icon = "lock", title = "Policy + approval", sub = "versioned, action-bound", tone = "purple" },
          { icon = "server", title = "Deployment API", sub = "every request, the system of record", tone = "gray" }, { icon = "file", title = "Logs", sub = "L0", tone = "orange" },
          { icon = "layers", title = "Traces", sub = "L1", tone = "blue" }, { icon = "check", title = "Lineage", sub = "L2, scored against truth", tone = "green" }]
  systems = "systems"
  badges = [["flask", "Run {{run.id}}"], ["check", "Checks {{checks.passed}}/{{checks.total}}"], ["refresh", "Replay: {{replay.served}} answers from tape, {{replay.misses}} misses, {{replay.identical}}"], ["cpu", "Model {{run.model}}"]]
  [[pages.blocks]]
  type = "table"
  data = "start"
  style = "margin-top:16px"
  title = "Start here: E12a, the lost response"
  sub = "Select a row: the first attempt committed, its response was lost, and the retry was an idempotent replay. Idempotency made the retry safe; lineage makes it explainable. The Method page has the experiment contract."
  [[pages.blocks]]
  type = "metric_grid"
  style = "margin-top:16px"
  items = [{ value = "{{L0.held.kn}}", label = "Logs · all answered", metric = "held-L0" }, { value = "{{L0.qualified.kn}}", label = "Logs · gaps", metric = "qualified-L0" },
           { value = "{{L0.broken.kn}}", label = "Logs · a false answer", metric = "broken-L0" }, { value = "{{L1.held.kn}}", label = "Logs + traces · all answered", metric = "held-L1" },
           { value = "{{L1.qualified.kn}}", label = "Logs + traces · gaps", metric = "qualified-L1" }, { value = "{{L1.broken.kn}}", label = "Logs + traces · a false answer", metric = "broken-L1" },
           { value = "{{L2.held.kn}}", label = "Lineage · all answered", metric = "held-L2" }, { value = "{{L2.qualified.kn}}", label = "Lineage · gaps", metric = "qualified-L2" },
           { value = "{{L2.broken.kn}}", label = "Lineage · a false answer", metric = "broken-L2" }]
  [[pages.blocks]]
  type = "table"
  data = "matrix"
  title = "Every scenario, every layer"
  sub = "✓ all thirteen correct · ~ some missing or partial · ✕ at least one false answer, with the count of correct answers. Select a row on the Scenarios page for its detail."
  [[pages.blocks]]
  type = "callout"
  icon = "bulb"
  title = "How a row's outcome is decided"
  text = "Each scenario runs once and is read three ways. An investigator per layer answers thirteen questions (trigger, principal and delegation, agent, model and configuration, policy version, approval, approver, capability, attempts, side effect, number of changes, real mitigation, integrity) from that layer alone, and each answer is scored against the deployment API's and approval service's own databases and the scenario pins. Held: all thirteen correct. Qualified: some answers missing or partial, none false. Broken: the layer recorded an answer that is false. A coverage test, not a benchmark: the lineage was designed to capture these facts; the failure scenarios test whether it survives. Correct answers in total: logs {{L0.correct}}, logs + traces {{L1.correct}}, lineage {{L2.correct}}, each out of {{L0.answers}}. Preregistered expectations held {{exp.held}}/{{exp.total}}; predictions {{pred.held}}/{{pred.total}}."

[[pages]]
id = "method"
title = "Method"
icon = "flask"
  [[pages.blocks]]
  type = "head"
  title = "Method: what this POC tests, and how"
  sub = "A forensic-reconstruction and failure-injection POC. Read the contract, then open the flagship case below."
  [[pages.blocks]]
  type = "table"
  data = "contract"
  title = "The experiment contract"
  sub = "Fixed before the recorded run; the preregistration's digest is frozen in the run manifest."
  [[pages.blocks]]
  type = "table"
  data = "start"
  title = "Start here: E12a, the lost response"
  sub = "The first attempt commits, its response is lost, the agent times out and retries with the same key. Select a row to compare what each layer can reconstruct."

[[pages]]
id = "runs"
title = "Scenarios"
icon = "list"
count = "rows"
  [[pages.blocks]]
  type = "case_explorer"
  heading = "Scenarios × layers"
  flag_tab = "Gaps and false answers"
  search = "Search rows, scenarios, what was missing…"
  csv_head = "row,scenario,layer,{factor},all_answered,outcome,note"
  columns = [{ label = "Outcome", show = "severity" }, { label = "Layer", kv = "Layer" }, { label = "Group", kv = "Group" }, { label = "Production changed", kv = "Production changed" }]

[[pages]]
id = "problems"
title = "Gaps & false answers"
icon = "alert"
  [[pages.blocks]]
  type = "head"
  title = "Where each layer could not reconstruct the execution"
  sub = "Every row that did not answer all thirteen questions, and what was missing or wrong. Select a row for its answers, steps and lineage."
  [[pages.blocks]]
  type = "table"
  data = "problems"
  title = "Qualified and broken · run {{run.id}}"
  sub = "{{all.broken}} broken and {{all.qualified}} qualified, out of {{run.rows}} rows."
  [[pages.blocks]]
  type = "table"
  data = "every"
  title = "All rows"
  sub = "{{run.scenarios}} scenarios × three layers. Select a row for its input, output, answers, steps and lineage."

[[pages]]
id = "checks"
title = "Checks"
icon = "check"
  [[pages.blocks]]
  type = "head"
  title = "Run integrity"
  sub = "checks.json (written by the run): {{checks.passed}} of {{checks.total}}. Replay from the tape: {{replay.served}} answers served, {{replay.misses}} misses, {{replay.identical}}."
  [[pages.blocks]]
  type = "table"
  data = "checks"
  title = "Checks · run {{run.id}}"
  sub = "A failing check means the published evidence cannot be trusted as it stands."

[[pages]]
id = "lineage"
title = "Data lineage"
icon = "layers"
  [[pages.blocks]]
  type = "head"
  title = "From the frozen inputs to the published number"
  sub = "The files that carry each scenario's data, in order. Every row's Data lineage tab lists its own files with record counts."
  [[pages.blocks]]
  type = "table"
  data = "lineage"
  title = "Per-scenario lineage"
  sub = "Paths inside the run directory; ‹scenario› is a scenario id such as the first on the Scenarios page."
  [[pages.blocks]]
  type = "table"
  data = "allruns"
  title = "Runs found"
  sub = "Every run directory with scored scenarios is listed and selectable on the Scenarios page ({{run.sources}} found): the recorded run and its replay."

[[pages]]
id = "raw"
title = "Raw evidence"
icon = "folder"
footer = true
  [[pages.blocks]]
  type = "artifacts"
  sub = "Where every value on these pages comes from."
  files = [["observability_governance_poc/runs/{{run.id}}/scenarios/‹scenario›/reconstruction.json", "each layer's answers, verdicts, sources and joins"],
           ["observability_governance_poc/runs/{{run.id}}/scenarios/‹scenario›/truth.json", "ground truth from the systems of record"],
           ["observability_governance_poc/runs/{{run.id}}/scenarios/‹scenario›/evidence/", "the hash-chained evidence export and its verification (L2)"],
           ["observability_governance_poc/runs/{{run.id}}/scenarios/‹scenario›/logs/", "each component's log (L0, L1)"],
           ["observability_governance_poc/runs/{{run.id}}/scenarios/‹scenario›/telemetry/", "OpenTelemetry spans and metrics per process (L1)"],
           ["observability_governance_poc/runs/{{run.id}}/scenarios/‹scenario›/world/", "the deployment API's request log and revisions (truth)"],
           ["observability_governance_poc/runs/{{run.id}}/scenarios/‹scenario›/tape/", "every model answer, replayable"],
           ["observability_governance_poc/runs/{{run.id}}/facts.json", "every number the editions and evidence documents substitute"],
           ["observability_governance_poc/runs/{{run.id}}/manifest.json", "frozen input and code digests"]]

[[pages]]
id = "reproduce"
title = "Reproduce"
icon = "terminal"
footer = true
  [[pages.blocks]]
  type = "reproduce"
  quick_sub = "From the governance_for_ai_agents folder."
  quickstart = [["Set up the POC (Python, uv)", "make setup"], ["Run the tests (no model)", "make test"], ["The flagship scenario and its evidence", "make demo"],
                ["Replay the published run from its tape", "make replay"], ["Verify the published evidence chains", "make verify"], ["Rebuild this page", "make console"]]
  environment = [["Python", "{{run.python}}", "uv sync --group dev"], ["Model", "{{run.model}}", "ollama pull (a new recording only)"], ["Scenarios", "{{run.scenarios}} per run", "make proof"]]
  replay_title = "Replay"
  replay_sub = "make replay re-runs every scenario with the model's answers served from the recorded tape: {{replay.served}} answers served, {{replay.misses}} misses, {{replay.identical}} to the recorded run."
  reproduced_as = "same outcomes and verdicts"

[claims]
title = ""

