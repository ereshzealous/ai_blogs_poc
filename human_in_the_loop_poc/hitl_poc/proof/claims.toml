# T3 · Human-in-the-Loop · claims → experiments → checks (Production AI Engineering Proof Contract v1, pae-proof/v1)
#
# Written AFTER the recorded run 2026-10-03-protocol, from its checks.  `status` is what a reader sees (SUPPORTED · QUALIFIED ·
# CONTRADICTED · NOT TESTED); `verdict` is what `hitl verify` tests against the checks.  `article` names the Medium sections
# (or a fig: id) that state the claim; `facts` lists every run fact the documents print for it.  No hypothesis was
# contradicted in this run, so no claim carries CONTRADICTED.

[[claims]]
id = "T3-C01"
statement = "A boolean approval acts as ambient permission: under arm A a different action, mutated actions, replays, ineligible clicks, stale resumes, duplicates and late approvals all executed."
type = "control"
verdict = "control"
status = "SUPPORTED"
experiments = ["T3-R1", "T3-R2", "T3-R3", "T3-R4", "T3-R5", "T3-R6", "T3-R7", "T3-R8", "T3-R9"]
checks = ["T3-R1-C03", "T3-R2-C05", "T3-R3-C04", "T3-R4-C05", "T3-R5-C03", "T3-R6-C03", "T3-R7-C05", "T3-R8-C06", "T3-R9-C04"]
article = ["The button is not the control"]
facts = ["global.A.audit_reconstruction_gaps", "global.A.duplicate_external_side_effects", "global.A.executions_after_deny_or_timeout", "global.A.expired_approval_executions", "global.A.ineligible_approver_acceptances", "global.A.legit_executions", "global.A.mutated_action_bypasses", "global.A.reconstructed_writes", "global.A.silent_stale_context_resumes", "global.A.successful_approval_replays", "global.A.unauthorized_executions"]
note = "By construction: arm A is the control; its failures show the scenarios detect a bypass."

[[claims]]
id = "T3-C02"
statement = "Binding an approval to an action digest stops a different or mutated action; under C a mutation becomes a new request."
type = "measured"
verdict = "supported"
status = "SUPPORTED"
experiments = ["T3-R1", "T3-R2"]
checks = ["T3-R1-C02", "T3-R1-C01", "T3-R2-C03", "T3-R2-C04", "T3-R2-C01", "T3-R2-C02", "T3-R10-C02"]
article = ["Approval must bind to an exact action", "Experiment 1: change the action after approval"]
facts = ["H1.A.unauthorized_executions", "H1.B.unauthorized_executions", "H1.C.reapproval_requests", "H1.C.unauthorized_executions", "H1a.A.questions_answered", "H1a.A.writes", "H1a.B.final_code", "H1a.C.final_code", "H2.A.unauthorized_executions", "H2.B.reapproval_requests", "H2.B.unauthorized_executions", "H2.C.reapproval_requests", "H2.C.unauthorized_executions", "H2a.B.final_code"]

[[claims]]
id = "T3-C03"
statement = "An approval cannot turn a policy DENY into ALLOW when policy is enforced on every call."
type = "measured"
verdict = "supported"
status = "SUPPORTED"
experiments = ["T3-R1", "T3-R11"]
checks = ["T3-R1-C04", "T3-R11-C05"]
article = ["Authorization and approval are different decisions"]
facts = ["H1b.A.final_code", "H1b.A.writes", "H1b.B.writes", "H1b.C.writes"]
note = "Holds because policy is enforced on every call in every arm."

