         "live.A2.safety_failures", "live.A0.unsafe_credits", "live.A1.unsafe_credits", "live.A2.unsafe_credits", "live.model.calls", "live.model.distinct_prompts",
         "live.model.prompts_with_varying_output", "live.model.repair_calls", "live.model.fallback_calls", "live.replay.files", "live.replay.different",
