  op = "<="
  ref = "A.500.median_tool_definition_tokens"
  scale = 0.10
  threshold_source = "experiment/preregistration.md §6 H2"
  [[experiments.checks]]
  id = "F1-R4-C02"
  description = "H4: the control plane showed at most eight business tools at the first step, at every size"
  kind = "hypothesis"
  fact = "hyp.H4.max_business_tools"
  op = "<="
  value = 8
  threshold_source = "experiment/preregistration.md §6 H4"
  [[experiments.checks]]
  id = "F1-R4-C03"
  description = "H4: the control plane's tool-definition tokens at the largest estate are within a quarter of its value at the smallest"
  kind = "hypothesis"
  fact = "C.500.median_tool_definition_tokens"
  op = "within"
  ref = "C.50.median_tool_definition_tokens"
  tolerance = 0.25
  threshold_source = "experiment/preregistration.md §6 H4"
  [[experiments.checks]]
  id = "F1-R4-C04"
  description = "All tools' tool-definition tokens grew with the catalog"
  kind = "measurement"
  fact = "A.500.median_tool_definition_tokens"
  op = ">"
  ref = "A.50.median_tool_definition_tokens"

