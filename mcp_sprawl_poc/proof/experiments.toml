question = "When vendor duplicates, retired tools, staging copies and a shadow server sit beside the authoritative one, does a trap get executed?"
claim = "Relevance is not authority: a look-alike that ranks high must still not run."
hypothesis = "Search ranks traps above the authoritative tool; the control plane executes no trap at any size, while the baselines do."
setup = "Categories C03 to C06 place look-alike implementations beside the authoritative one; the ledger records which implementation executed in every row; the ORD-4917 request's hybrid-search ranking is recorded."
variable = "Arm and catalog size."
invariant = "No trap implementation executes in the control plane."
limitations = ["The benchmark varies the catalog size, not the number of look-alikes at a fixed size: this is not an overlap sweep.", "One retrieval design (BM25 plus embeddings, reciprocal-rank fusion) at a fixed top-k."]
  [[experiments.checks]]
  id = "F1-R3-C01"
