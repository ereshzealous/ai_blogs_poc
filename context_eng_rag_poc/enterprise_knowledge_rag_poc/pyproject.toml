[project]
name = "s2-enterprise-knowledge-rag-poc"
version = "0.1.0"
description = "S2 POC: governed enterprise knowledge retrieval, evidence packets and citation verification vs naive RAG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rA -p no:cacheprovider"
markers = [
    "model: calls a local Ollama model (skipped when Ollama or the model is unavailable)",
]
