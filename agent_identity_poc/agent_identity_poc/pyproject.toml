[project]
name = "t1-agent-identity-poc"
version = "1.0.0"
description = "T1 POC: the identity chain behind one agent action. Invoker, delegation, agent, runtime workload and tool credential, carried from a monitoring event to a Kubernetes rollback, audited and revocable per layer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
aid = "aid.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rA -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
