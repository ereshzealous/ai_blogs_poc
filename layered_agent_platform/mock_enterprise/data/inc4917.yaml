incidents:
  - id: INC-4917
    title: Checkout latency elevated in production
    severity: SEV2
    status: investigating
    service: checkout-api
    environment: production
    opened_at: "2026-09-08T10:21:12Z"
    assignment_group: checkout-oncall
    description: >-
      Alert CheckoutLatencyP95High firing since 10:19. Customers report slow checkout and
      intermittent timeouts. Started shortly after the morning production deployments.
    related_alerts: [ALR-55120, ALR-55121]
    linked_changes: []
    channel: "#inc-4917-checkout-latency"
  - id: INC-4916
    title: Search results intermittently empty
    severity: SEV3
    status: open
    service: search-api
    environment: production
    opened_at: "2026-09-08T09:02:40Z"
    assignment_group: search-oncall
    description: Some catalogue searches return no results; retries succeed.
    related_alerts: []
    linked_changes: []
    channel: null
  - id: INC-4911
    title: Card authorisation declines spike
    severity: SEV2
    status: resolved
    service: payment-gateway
    environment: production
    opened_at: "2026-09-06T18:44:05Z"
    resolved_at: "2026-09-06T19:31:10Z"
    assignment_group: payments-oncall
    description: Card processor returned elevated soft declines; resolved by processor.
    related_alerts: []
    linked_changes: []
    channel: "#inc-4911-card-declines"
  - id: INC-4890
    title: Checkout 5xx after session cache failover
    severity: SEV2
    status: resolved
    service: checkout-api
    environment: production
    opened_at: "2026-08-29T13:10:00Z"
    resolved_at: "2026-08-29T13:52:00Z"
    assignment_group: checkout-oncall
    description: redis-sessions failover dropped sessions; checkout-api returned 5xx until reconnect.
    related_alerts: []
    linked_changes: [CHG-29870]
    channel: "#inc-4890-checkout-5xx"

